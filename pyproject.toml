[project]
name = "investment-advisor"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    # ── Base: everything required to boot the API, the workers and the beat ──
    # Deliberately excludes torch, the ML/RAG stack, browser automation and the
    # dev/security tooling. Those moved into optional-dependencies below; see
    # `require_extra()` in src/utils/extras.py for how a missing one surfaces.
    # 基礎相依僅含開機所需；重量級套件移至下方 optional-dependencies。
    "aiohttp>=3.14.3",
    "aiosmtplib==5.1.2",
    "aiosqlite==0.19.0",
    "alembic>=1.13",
    "asyncpg==0.29.0",
    "beautifulsoup4>=4.12.3",
    "celery[redis]==5.6.0",
    "cryptography==50.0.0",
    # Renamed upstream from duckduckgo-search; 3.9.3 passed httpx's removed
    # `proxies` kwarg and had been dead since httpx 0.28.
    "ddgs==9.14.4",
    "diskcache==5.6.3",
    "fastapi==0.124.4",
    "feedparser>=6.0.10",
    "filelock==3.20.3",
    "fredapi==0.5.1",
    "httpx>=0.25.1",
    "httpx-sse>=0.4.3",
    "jinja2==3.1.6",
    "listparser>=0.19",
    "lxml==6.1.0",
    "Mako>=1.3.12",
    "markdown==3.8.1",
    "mcp>=1.28.1",
    "numpy==1.26.4",
    "ollama>=0.4.0",
    "pandas==2.3.3",
    "pandas-market-calendars==4.4.1",
    "pgvector==0.2.4",
    "psycopg2-binary==2.9.9",
    "pydantic-settings>=2.0",
    "pydub==0.25.1",
    "python-dotenv==1.2.2",
    "python-json-logger==2.0.7",
    "python-multipart>=0.0.32",
    "pytz>=2024.1",
    "redis==6.4.0",
    "requests==2.34.0",
    "schedule==1.2.1",
    "slowapi==0.1.9",
    "sqlalchemy>=2.0.31",
    "starlette==0.49.1",
    "tavily-python==0.5.0",
    "urllib3==2.7.0",
    "uvicorn[standard]>=0.31.1",
    "yfinance==0.2.50",
]

[project.optional-dependencies]
# Zero-shot time-series forecasting. This is the ~900MB PyTorch layer: without
# the CPU-index pin it resolves to torch+cu130 and ~2.9GB of nvidia/* wheels,
# which once filled a 63GB Docker disk. src/services/forecast_service.py falls
# back to a numpy-only forecaster when this extra is absent, so the default
# install still produces a forecast band.
# 這是 ~900MB 的 torch 層；未安裝時 forecast_service 會改用 numpy 版實作。
forecast = [
    "timesfm[torch]==2.0.2",
    "transformers==5.5.0",
]

# Portfolio optimisation. Currently no module imports either package — kept as
# an opt-in so the solver is one `pip install` away if the allocator is ever
# rewritten to use it, rather than shipping it to everyone on the chance.
optimize = [
    "cvxpy==1.6.0",
    "scikit-learn==1.5.2",
]

# Long-term memory / RAG.
memory = [
    "mem0ai>=2.0.0",
    "qdrant-client==1.17.1",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-ollama>=0.3.0",
    "llama-index-llms-ollama>=0.3.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "llama-index-readers-file>=0.2.0",
    "nltk>=3.10.0",
]

# Web scraping / browser automation.
scrape = [
    "playwright>=1.44.0",
    "newspaper3k>=0.2.8",
    "lxml-html-clean>=0.1.0",
    "pytrends==4.9.2",
]

# OpenTelemetry export. Only needed with the `observability` compose profile;
# src/utils/tracing.py self-disables when OTEL_EXPORTER_OTLP_ENDPOINT is unset.
obs = [
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
    "opentelemetry-instrumentation-fastapi==0.60b1",
    "opentelemetry-instrumentation-httpx==0.60b1",
    "opentelemetry-instrumentation-psycopg2==0.60b1",
    "opentelemetry-instrumentation-requests==0.60b1",
    "opentelemetry-instrumentation-sqlalchemy==0.60b1",
    "opentelemetry-instrumentation-urllib3==0.60b1",
    "opentelemetry-sdk==1.39.1",
]

# Declarative prompt programming.
dspy = ["dspy==3.0.4b1"]

# LINE messaging channel (imports as `linebot`).
channels-line = ["line-bot-sdk==3.22.0"]

# Test + security tooling. Never installed into a production image.
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "freezegun==1.2.2",
    "bandit>=1.7.7",
    "safety==3.7.0",
    "pip-audit==2.9.0",
    "pip-licenses==4.3.3",
]


[tool.coverage.run]
# CI gates on `pytest --cov=src --cov-fail-under=65`. Note pytest.ini's
# [coverage:*] sections were dead — coverage.py never reads pytest.ini — so
# this is the first configuration that has actually taken effect.
# 注意 pytest.ini 裡的 [coverage:*] 從來沒生效過（coverage.py 不讀 pytest.ini）。
source = ["src"]
# Explicit: the 65% gate is a statement-coverage number. Turning on branch
# coverage would silently move the goalposts.
# 明寫 false：65% 門檻是敘述覆蓋率，開 branch 會無聲改變基準。
branch = false
parallel = false
# No `omit`. The obvious candidates are either already excluded (src/scripts/,
# src/scratch/ and src/refactor/ have no __init__.py, so coverage never
# descends into them) or live product code — research_automation_service is
# imported by the ticker-universe endpoints and the scheduler,
# transcription_service by webhook_service. Omitting those would be gaming the
# gate, not measuring it.
# 不設 omit：明顯的候選不是早就不在統計內，就是活的產品程式碼，排除它們等於灌水。

[tool.coverage.report]
precision = 2
skip_empty = true
show_missing = true
# Deliberately no `fail_under` here — the threshold lives in the CI command
# line only, so there is exactly one place to change it.
# 刻意不設 fail_under：門檻只存在於 CI 命令列，避免兩處打架。
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
