# ═══════════════════════════════════════════════════════════════════════════
# Parameter registry — the pre-registered surface of thresholds a future Change Engine may adjust.
# 參數登錄檔——未來變更引擎可調整之門檻的事先登記範圍。
#
# WHY: operator requirement (2026-10-18): thresholds may be changed by the system, but only when the change is
# meaningful, verified, and a trend has formed. Registering bounds, a discrete grid (which caps the number of
# trials N for multiple-testing correction), a rollback value and the evidence metric BEFORE any change is what
# makes "verified" checkable. Approved once through ADR-003; editing this file stays R3.
#
# THIS FILE IS NOT READ AT RUNTIME YET (G0). Nothing here changes behaviour. G2 adds the single reader.
# tests/invariants/test_parameter_registry.py enforces the shape.
#
# Fields: class A reversible-cheap | B sizing/selectivity | C safety/capital exposure | D mechanism that judges
# changes (never self-loosens). risk_direction +1 = larger value, larger risk; -1 = the reverse.
# policy: adaptive (bidirectional inside the grid, on evidence) | tighten_only | frozen.
# grid: ascending discrete candidates; must contain rollback_value (= schema default) and never a special value.
# mission-store entries are PATHS into config/mission.yaml — never copy its numbers here.
# ═══════════════════════════════════════════════════════════════════════════
version: 1
parameters:
  - key: event_analysis_daily_cap
    store: settings
    class: A
    risk_direction: 1          # more analyses per day = more LLM spend
    policy: adaptive
    owner: event_pipeline
    rollback_value: 8
    special_values: [0]        # 0 = unlimited; a step must never land on or cross it
    bounds: {min: 4, max: 16}
    grid: [4, 6, 8, 12, 16]
    cooldown_days: 63
    evidence:
      metric: llm_cost_per_useful_decision
      horizons_days: [5, 63]
      min_n: 30
      counterfactual_source: llm_real_cost_daily
  - key: universe_research_max_age_days
    store: settings
    class: B
    risk_direction: 1          # older research tolerated = riskier
    policy: adaptive
    owner: proposal_validator
    rollback_value: 14
    bounds: {min: 7, max: 30}
    grid: [7, 10, 14, 21, 30]
    cooldown_days: 63
    evidence:
      metric: net_signed_alpha_marginal_band
      horizons_days: [5, 63]
      min_n: 30
      counterfactual_source: trade_proposals_stale_score
  - key: batch_deploy_max_order_usd
    store: settings
    class: B
    risk_direction: 1
    policy: adaptive
    owner: order_cap_policy
    rollback_value: 100.0
    bounds: {min: 50, max: 200}
    grid: [50.0, 75.0, 100.0, 150.0, 200.0]
    cooldown_days: 63
    evidence:
      metric: drawdown_contribution_and_below_min_order_share
      horizons_days: [5, 63]
      min_n: 30
      counterfactual_source: proposal_shadow_below_min_order
  - key: batch_deploy_min_confidence
    store: settings
    class: B
    risk_direction: -1         # lower threshold = more candidates funded = riskier
    policy: adaptive
    owner: batch_cash_deployment
    rollback_value: 5.5
    bounds: {min: 5.0, max: 7.0}
    grid: [5.0, 5.5, 6.0, 6.5, 7.0]
    cooldown_days: 63
    evidence:
      metric: net_signed_alpha_marginal_band
      horizons_days: [5, 63]
      min_n: 30
      counterfactual_source: threshold_band_recorder   # does not exist yet — milestone G1
  - key: rotation_min_score_delta
    store: settings
    class: B
    risk_direction: -1
    policy: adaptive
    owner: sentinel_rotation
    rollback_value: 2.0
    bounds: {min: 1.5, max: 3.0}
    grid: [1.5, 2.0, 2.5, 3.0]
    cooldown_days: 63
    evidence:
      metric: net_buy_minus_sell_return_after_friction
      horizons_days: [5, 63]
      min_n: 30
      counterfactual_source: threshold_band_recorder   # milestone G1
  - key: rotation_min_holding_days
    store: settings
    class: B
    risk_direction: -1
    policy: adaptive
    owner: sentinel_rotation
    rollback_value: 5
    special_values: [0]        # 0 disables the check
    bounds: {min: 3, max: 10}
    grid: [3, 5, 7, 10]
    cooldown_days: 63
    evidence:
      metric: net_buy_minus_sell_return_after_friction
      horizons_days: [5, 63]
      min_n: 30
      counterfactual_source: threshold_band_recorder   # milestone G1
  - key: benchmark_parking_max_order_usd
    store: settings
    class: A
    risk_direction: 1
    policy: tighten_only
    owner: benchmark_parking
    rollback_value: 250.0
    bounds: {min: 10, max: 250}
    untestable_reason: Parking buys the benchmark only; the cap bounds deployment speed, not selectivity, so no outcome metric separates values.
  - key: tradable_capital_pct
    store: settings
    class: C
    risk_direction: 1
    policy: tighten_only
    owner: capital_policy
    rollback_value: 75.0
    special_values: [0]        # 0 stops all trading
    bounds: {min: 1, max: 75}
    untestable_reason: Net alpha of the active sleeve is not demonstrated at this account size (years_to_significance is in decades); keep the default and only tighten on risk evidence.
  - key: stop_loss_pct
    store: settings
    class: C
    risk_direction: 1
    policy: tighten_only
    owner: sentinel_exit
    rollback_value: 8.0
    bounds: {min: 1, max: 8}
    untestable_reason: Too few stop events to validate a value; exits are safety controls and may only be tightened.
  - key: promotion.min_deflated_sharpe
    store: mission
    class: D
    risk_direction: -1
    policy: tighten_only
    mission_path: promotion.min_deflated_sharpe
    owner: strategy_lab
    untestable_reason: Judges other changes; a judge that loosens itself certifies itself. Only ADR-003 or an auditable tightening may move it.
  - key: budgets.max_hypothesis_trials_per_quarter
    store: mission
    class: D
    risk_direction: 1
    policy: tighten_only
    mission_path: budgets.max_hypothesis_trials_per_quarter
    owner: strategy_lab
    untestable_reason: The multiple-testing budget is the denominator of every other test; the engine may only lower it.
