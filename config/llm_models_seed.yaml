# Seed model list — "currently used 4 models" plus 2 Ollama suggestions.
# See docs/architecture/multi_provider_multi_model_design.md §7.4 / §3.7.
#
# Used by `scripts/seed_llm_defaults.py` (Phase B) to upsert `llm_models`
# rows for the SYSTEM user. Each entry references a provider_code that
# must exist in config/llm_providers.yaml.

models:
  # ── OpenAI ────────────────────────────────────────────────────────
  - provider_code: openai
    model_code: gpt-4.1-nano
    display_name: "GPT-4.1 nano"
    capabilities:
      tool_calling: true
      vision: false
      json_mode: true
      streaming: true
      embeddings: false
    context_window: 128000
    input_cost_per_1k: 0.0001
    output_cost_per_1k: 0.0004

  # ── Google Gemini ─────────────────────────────────────────────────
