    label_zh: 自訂 RSS 來源
    help_en: >-
      Merged with the built-in list in src/config/rss_config.py. The merge has
      always existed; until this schema there was no UI that wrote the key.
    help_zh: 會與內建清單合併。此合併邏輯早已存在，但過去沒有任何 UI 會寫入這個鍵。
  - key: podcast_feeds
    group: ingest
    type: json
    default: []
    label_en: Podcast feeds
    label_zh: Podcast 來源
    help_en: >-
      JSON list of {name, url}. Previously a commented-out JavaScript array
      inside an n8n Code node.
    help_zh: JSON 陣列 {name, url}；原本是 n8n Code 節點裡註解掉的 JS 陣列。
  - key: ai_energy_tickers
    group: ingest
    type: list
    default: [CEG, VST, MSFT, AMZN, GOOGL]
