    label_en: Telegram
    label_zh: Telegram
  - key: channel_telegram_bot_token
    group: notify
    type: secret
    default: ''
    depends: channel_telegram_enabled
    label_en: Telegram bot token
    label_zh: Telegram bot token
  - key: channel_telegram_chat_id
    group: notify
    type: string
    default: ''
    depends: channel_telegram_enabled
    label_en: Telegram chat ID
    label_zh: Telegram chat ID
  - key: channel_line_enabled
    group: notify
    type: bool
    default: false
    label_en: LINE
    label_zh: LINE
  - key: channel_line_access_token
    group: notify
