    group: notify
    type: secret
    default: ''
    depends: channel_discord_enabled
    label_en: Discord webhook URL
    label_zh: Discord webhook URL
    help_en: Channel Settings → Integrations → Webhooks. Treat it as a credential.
  - key: notification_webhook_url
