    default: 1000
    min: 1
    label_en: Risk keyword hard cap
    label_zh: 風險關鍵詞上限

  # ── System ───────────────────────────────────────────────────────────────
  - key: cost_profile
    group: system
    type: enum
    enum: [frugal, balanced, aggressive]
    default: balanced
    label_en: Operating Cost Profile
    label_zh: 運算成本方案
    help_en: Operating cadence (sentinel tick interval, external news scans, and model tier allocation).
  - key: schedule_daily
    group: system
    type: time
    default: '17:00'
    label_en: Daily report time
    label_zh: 每日報表時間
  - key: schedule_daily_days
    group: system
    type: list
    default: [mon, tue, wed, thu, fri]
    label_en: Daily report days
    label_zh: 每日報表執行日
  - key: schedule_weekly
    group: system
    type: time
    default: '10:00'
    label_en: Weekly report time
    label_zh: 每週報表時間
  - key: schedule_weekly_day
    group: system
    type: enum
    enum: [mon, tue, wed, thu, fri, sat, sun]
    default: sat
    label_en: Weekly report day
    label_zh: 每週報表執行日
  - key: DISPLAY_TIMEZONE
    group: system
    type: string
    default: Asia/Taipei
    label_en: Display timezone
    label_zh: 顯示時區
  - key: telemetry_enabled
    group: system
    type: bool
    default: false
    label_en: Product telemetry
    label_zh: 產品遙測
    help_en: Records anonymous usage events to the local product_events table only.
  - key: INTERNAL_BASE_URL
    group: system
    type: string
    default: http://mcp_server:8000
    restart: true
    label_en: Internal API base URL
    label_zh: 內部 API 位址
  - key: WS_PORT
    group: system
    type: int
    default: 8000
    min: 1
    max: 65535
    restart: true
    label_en: WebSocket port
    label_zh: WebSocket 連接埠
  - key: enable_net_alpha_attribution
    group: allocation
    type: bool
    default: true
    label_en: Real-time Net Alpha & Cash Drag Attribution
    label_zh: 實時淨 Alpha 歸因與現金拖累儀表
    help_en: Quantifies gross vs net alpha deducting LLM and subscription costs, measuring cash drag vs downside protection.
    help_zh: 自動扣除模型調用與訂閱成本精算實時淨 Alpha，並量化現金拖累機會成本與下行防守保護價值。
  - key: target_annual_net_alpha_pct
    group: allocation
    type: float
    default: 0.10
    min: 0.01
    max: 1.00
    label_en: Target Annualized Net Alpha (Excess over SPY)
    label_zh: 目標年化淨 Alpha (超越標普500超額)
    help_en: Annual net alpha hurdle target after deducting all costs (default 0.10 = +10%).
    help_zh: 扣除所有模型與運營成本後之年度淨超額目標（預設 0.10 即年化打贏大盤 10%）。
  - key: monthly_saas_subscription_cost_usd
    group: allocation
    type: float
    default: 0.0
    min: 0.0
    max: 1000.0
    label_en: Monthly SaaS & Data Subscription Cost (USD)
    label_zh: 每月軟體與數據訂閱費用攤提 (USD)
    help_en: Monthly fixed software and data subscription cost prorated into net alpha calculations.
    help_zh: 每月軟體與數據訂閱固定費用，於淨 Alpha 精算中按天數比例攤提扣除。
  - key: enable_staggered_fills_reconciliation
    group: trading
    type: bool
    default: true
    label_en: Intraday Staggered Fills Reconciliation & Position Onboarding
    label_zh: 盤中階梯限價單撮合對帳與持倉自動接管
    help_en: Monitors intraday staggered limit orders and automatically onboards filled positions to trailing stop-loss guards.
    help_zh: 盤中定時輪詢階梯限價單撮合成交狀態，並自動向 ExitCompositor 與 Sentinel 掛載動態保護停損。
  - key: staggered_fills_reconciliation_interval_minutes
    group: trading
    type: int
    default: 15
    min: 5
    max: 60
    label_en: Staggered Fills Reconciliation Interval (Minutes)
    label_zh: 階梯限價撮合對帳間隔 (分鐘)
    help_en: Cadence in minutes between intraday limit order fill checks during US market hours.
    help_zh: 美股交易時段內階梯掛單撮合輪詢與持倉接管之週期頻率（預設 15 分鐘）。
  - key: enable_hard_token_budget_guard
    group: ai
    type: bool
    default: true
    label_en: Hard Token Budget Guard (Cost Defense)
    label_zh: 帳戶級硬性代幣預算熔斷守衛
    help_en: Enforces hard daily and monthly ceilings on LLM costs, locking down background calls to protect net alpha.
    help_zh: 對 LLM 支出設置每日與每月硬性上限，超標時自動熔斷背景調用以保衛淨超額報酬。
  - key: daily_llm_budget_usd
    group: ai
    type: float
    default: 0.10
    min: 0.01
    max: 10.0
    label_en: Daily LLM Token Budget (USD)
    label_zh: 每日 LLM 模型花費上限 (USD)
    help_en: Daily expenditure ceiling for LLM reasoning before triggering hard budget lockout (default $0.10).
    help_zh: 每日 LLM 推理費用上限，超過即觸發硬性熔斷轉入 0-LLM 模式（預設 $0.10 USD）。
  - key: monthly_llm_budget_usd
    group: ai
    type: float
    default: 2.50
    min: 0.10
    max: 50.0
    label_en: Monthly LLM Token Budget (USD)
    label_zh: 每月 LLM 模型花費上限 (USD)
    help_en: Monthly expenditure ceiling for LLM reasoning to ensure annual token friction stays under 1.5% of equity.
    help_zh: 每月 LLM 總預算上限，確保全年模型摩擦成本低於總資產 1.5%（預設 $2.50 USD）。
  - key: enable_sentinel_zero_llm_mode
    group: ai
    type: bool
    default: true
    label_en: Sentinel 100% 0-LLM Mathematical Patrol
    label_zh: Sentinel 哨兵 100% 0-LLM 數理巡航
    help_en: Forces Sentinel 10-minute patrols to run purely deterministic ATR, VPIN, and jump diffusion calculations.
    help_zh: 強制 Sentinel 每 10 分鐘巡航採用純量化數理判定（ATR、VPIN、跳躍擴散），達成 0 Token 守護。
  - key: enable_deterministic_council_fallback
    group: ai
    type: bool
    default: true
    label_en: Deterministic Mathematical Council Fallback
    label_zh: 確定性數理議會替代決策器
    help_en: Automatically routes routine rebalancing and sub-$250 allocations to 0-LLM quantitative engines.
    help_zh: 例行再平衡與小額配置自動由 Bayesian HMM 與多因子數理議會替代，0 Token 0 秒延遲。
  - key: enable_staggered_order_stalking
    group: trading
    type: bool
    default: true
    label_en: Intraday Staggered Order Stalking & Repricing
    label_zh: 盤中階梯限價動態追單改價
    help_en: Dynamically adjusts Tier 1/2 limit orders towards VWAP on strong intraday trending assets at 14:00 EST.
    help_zh: 每日 14:00 EST 對多頭強勢標的將 Tier 1/2 限價向日內均價貼近微調，大幅提升吸籌成交率。
  - key: enable_staggered_moc_conversion
    group: trading
    type: bool
    default: true
    label_en: Market-Close Dip Conversion to MOC Execution
    label_zh: 尾盤動能接管強制吸籌建倉
    help_en: Converts remaining Tier 1 limit orders to MOC fills at 15:50 EST for strong assets when cash ratio exceeds 35%.
    help_zh: 每日 15:50 EST 撤單前，若現金仍高於 35%，將強勢標的 Tier 1 轉為市價/MOC 成交以消除現金拖累。
  - key: enable_cross_sector_momentum_injection
    group: trading
    type: bool
    default: true
    label_en: Enable Cross-Sector Momentum Injection & HHI De-concentration
    label_zh: 啟用跨板塊動能注入與 HHI 集中度自癒引擎
    help_en: Dynamically injects top-momentum blue-chip leaders from under-represented sectors into batch plans when tech sector or HHI breaches limits.
    help_zh: 當投組科技股集中度超標或板塊 HHI > 0.25 時，批次建倉自動保留配額注入儲備庫中非科技頂級龍頭（如能源 COP、材料 ECL、金融 V），主動平衡板塊風險。
  - key: cross_sector_injection_quota_pct
    group: trading
    type: float
    default: 0.35
    min: 0.10
    max: 0.60
    label_en: Cross-Sector Injection Quota Percentage
    label_zh: 跨板塊自癒注入預算配額比例
    help_en: Percentage of batch deployment capital allocated to non-tech sector contenders during drift self-healing.
    help_zh: 啟動集中度自癒時，分配給非科技主題標的之批次資金比例（預設 35%）。
  - key: portfolio_hhi_breach_threshold
    group: trading
    type: float
    default: 0.25
    min: 0.10
    max: 0.50
    label_en: Portfolio Sector HHI Concentration Breach Threshold
    label_zh: 投組實盤板塊 HHI 集中度熔斷門檻
    help_en: Herfindahl-Hirschman Index threshold for portfolio sector weights above which self-healing de-concentration is triggered.
    help_zh: 投組板塊 HHI 集中度上限，超過此門檻（預設 0.25）判定為 DRIFT_BREACH 並啟動跨板塊自癒注入。
  - key: tech_sector_concentration_cap_pct
    group: trading
    type: float
    default: 0.30
    min: 0.15
    max: 0.60
    label_en: Technology Sector NLV Concentration Hard Cap
    label_zh: 科技板塊全帳戶淨值集中度硬上限
    help_en: Maximum allowable technology sector exposure relative to total NLV before active injection is mandated.
    help_zh: 科技板塊佔總淨值之最大上限比例（預設 30%），超標時強制向低配板塊分散。
  - key: enable_alpha_spread_bidding
    group: trading
    type: bool
    default: true
    label_en: Enable Pre-Market Alpha Spread Bidding & Friction Offset
    label_zh: 啟用開盤建倉前動態利差競標與自適應摩擦抵消
    help_en: Dynamically measures expected gross alpha and transaction friction pre-market to adjust cross-sector allocation quota.
    help_zh: 在開盤前度量候選標的之預期超額利差與即時買賣摩擦，自適應調節跨板塊配額。
  - key: alpha_bidding_hurdle_bps
    group: trading
    type: float
    default: 15.0
    min: 0.0
    max: 100.0
    label_en: Alpha Bidding Net Spread Hurdle (bps)
    label_zh: 動態利差競標淨超額門檻 (bps)
    help_en: Net alpha spread hurdle required to trigger quota expansion.
    help_zh: 淨利差需覆蓋此基準門檻（預設 15.0 bps / 0.15%），方可觸發配額上浮。
  - key: cross_sector_max_bidding_quota_pct
    group: trading
    type: float
    default: 0.45
    min: 0.20
    max: 0.60
    label_en: Cross-Sector Maximum Bidding Quota Percentage
    label_zh: 跨板塊利差競標最大上浮配額比例
    help_en: Maximum quota allocated to cross-sector contender when net alpha spread exceeds 1.5x hurdle.
    help_zh: 當淨利差達到 1.5x Hurdle 時，跨板塊自癒標的配額最高可擴展之比例（預設 45%）。
  - key: cross_sector_min_bidding_quota_pct
    group: trading
    type: float
    default: 0.20
    min: 0.05
    max: 0.35
    label_en: Cross-Sector Minimum Bidding Defensive Quota Percentage
    label_zh: 跨板塊利差競標保底防守配額比例
    help_en: Minimum defensive quota allocated to cross-sector contender when friction is elevated.
    help_zh: 當交易摩擦過高或淨利差微弱時，跨板塊標的配額防守性下修之保底比例（預設 20%）。
  - key: alpha_bidding_diversification_premium_bps
    group: trading
    type: float
    default: 12.0
    min: 0.0
    max: 50.0
    label_en: Cross-Sector Diversification Alpha Premium (bps)
    label_zh: 跨板塊多角化降低 HHI 超額溢價加成 (bps)
    help_en: Expected gross alpha premium awarded to cross-sector contenders for reducing portfolio HHI concentration.
    help_zh: 跨板塊候選標的因降低投組集中度與非系統性風險所獲得的預期超額利差加成（預設 12.0 bps）。
  - key: enable_cross_sector_beta_damping
    group: trading
    type: bool
    default: true
    label_en: Enable Cross-Sector Beta & Correlation Damping
    label_zh: 啟用跨板塊標的即時波動率相關性動態阻尼
    help_en: Dynamically measures rolling beta and correlation against SPY to scale dip stalking and MOC orders.
    help_zh: 盤中即時度量跨板塊標的與 SPY 基準之滾動貝塔與相關性，自適應調控追單收斂速度與尾盤 MOC 金額。
  - key: beta_damping_contagion_threshold
    group: trading
    type: float
    default: 1.25
    min: 1.0
    max: 2.5
    label_en: Beta Damping Contagion Amplified Threshold
    label_zh: 貝塔阻尼高貝塔系統性傳染門檻
    help_en: Beta threshold at or above which contagion damping is activated (0.60x - 0.85x damping).
    help_zh: 有效貝塔大於等於此門檻時觸發 CONTAGION_AMPLIFIED，啟動 0.60x ~ 0.85x 阻尼收縮。
  - key: beta_damping_decoupled_threshold
    group: trading
    type: float
    default: 0.75
    min: 0.2
    max: 1.0
    label_en: Beta Damping Defensive Decoupled Threshold
    label_zh: 貝塔阻尼低貝塔解耦防守門檻
    help_en: Beta threshold below which defensive boost is activated (1.15x boost, BOOST_STALKING).
    help_zh: 有效貝塔小於等於此門檻且弱相關時觸發 DEFENSIVE_DECOUPLED，啟動 1.15x 激勵追單吸籌。
  - key: beta_damping_correlation_threshold
    group: trading
    type: float
    default: 0.75
    min: 0.4
    max: 0.95
    label_en: Beta Damping Correlation Contagion Threshold
    label_zh: 貝塔阻尼相關性傳染門檻
    help_en: Pearson correlation threshold paired with beta > 1.0 to trigger contagion damping.
    help_zh: 當標的與大盤相關性大於等於此門檻且貝塔大於 1.0 時，亦判定為系統性傳染並阻尼縮額。
  - key: beta_damping_market_stress_drawdown_pct
    group: trading
    type: float
    default: -1.2
    min: -5.0
    max: -0.5
    label_en: Market Stress Drawdown Trigger (%)
    label_zh: 大盤跳水觸發門檻（%）
    help_en: Intraday benchmark drawdown percentage that triggers MARKET_STRESS_DAMPED (0.50x hard damping, FREEZE_STALKING).
    help_zh: 大盤 SPY 日內跌幅觸及此門檻且標的貝塔敏感時，啟動 0.50x 剛性阻尼並凍結追單改價以捍衛現金。
  - key: enable_cross_sector_harvest_rebalance
    group: trading
    type: bool
    default: true
    label_en: Enable Cross-Sector Dynamic Harvest & Rebalance
    label_zh: 啟用跨板塊注入標的動態出清與再平衡利差回流
    help_en: Periodically harvests defensive contenders once portfolio HHI de-concentration is achieved and recirculates capital.
    help_zh: 當投組 HHI 集中度自癒完成且標的利潤達標時，分批收割鎖利並將資金循環回流至核心資產。
  - key: cross_sector_harvest_min_profit_pct
    group: trading
    type: float
    default: 10.0
    min: 2.0
    max: 50.0
    label_en: Cross-Sector Harvest Minimum Profit Percentage
    label_zh: 跨板塊收割最低未實現利潤門檻（%）
    help_en: Minimum unrealized profit required to trigger partial profit harvesting.
    help_zh: 跨板塊防守標的未實現利潤達到此門檻（預設 10.0%）且 HHI 健康時啟動分批減碼。
  - key: cross_sector_harvest_safe_hhi_threshold
    group: trading
    type: float
    default: 0.18
    min: 0.10
    max: 0.30
    label_en: Cross-Sector Harvest Safe HHI Target Threshold
    label_zh: 跨板塊收割投組健康 HHI 基準門檻
    help_en: Portfolio HHI threshold below which de-concentration is considered achieved and harvesting is permitted.
    help_zh: 投組板塊 HHI 降至此門檻（預設 0.18）以下時判定集中度自癒完成，允許資金收割回流。
  - key: enable_microstructure_spoofing_shield
    group: trading
    type: bool
    default: true
    label_en: Enable Microstructure Quote Spoofing & Depth Shielder
    label_zh: 啟用盤中微觀獵殺與自適應反欺詐訂單簿嗅探
    help_en: Sniffs predatory order book cancel-to-fill ratios and shifts staggered limit buys downward to catch true distress flush.
    help_zh: 即時嗅探盤口假單撤單比率 (CFR) 與微觀空洞，將階梯吸籌目標價向下平移防範誘單接飛刀。
  - key: spoofing_cancel_to_fill_ratio_threshold
    group: trading
    type: float
    default: 3.0
    min: 1.5
    max: 10.0
    label_en: Microstructure Spoofing Cancel-to-Fill Ratio Threshold
    label_zh: 微觀假單撤單比率 (CFR) 警示門檻
    help_en: Cancel-to-fill ratio above which predatory spoofing or stop-hunt risk is declared.
    help_zh: 當盤口短時撤單與成交比率達到此門檻（預設 3.0）時觸發 SPOOF_HUNT_DETECTED。
  - key: spoofing_anti_hunt_downward_offset_pct
    group: trading
    type: float
    default: 0.004
    min: 0.001
    max: 0.020
    label_en: Anti-Hunt Downward Price Offset Percentage
    label_zh: 反獵殺階梯限價向下平移安全邊際比例
    help_en: Percentage to shift staggered limit buy orders downward when spoofing risk is elevated.
    help_zh: 偵測到微觀獵殺時，階梯吸籌買單向下平移之安全邊際幅度（預設 0.004 = 40 bps）。
  - key: enable_dark_pool_pricing
    group: trading
    type: bool
    default: true
    label_en: Enable Cross-Market Dark Pool Pricing & Calibration
    label_zh: 啟用跨市場暗池大宗換手與隔夜掛單動態校準
    help_en: Tracks pre/after-market dark pool prints and FINRA ADF block trades to calibrate staggered limit dip targets.
    help_zh: 盤前盤後追蹤暗池與大宗換手印痕，動態校準主力階梯限價吸籌錨點。
  - key: dark_pool_accumulation_threshold
    group: trading
    type: float
    default: 0.65
    min: 0.50
    max: 0.90
    label_en: Dark Pool Accumulation Buy Ratio Threshold
    label_zh: 暗池大宗機構吸籌買方佔比門檻
    help_en: Dark pool buy ratio above which institutional accumulation is declared and limit order is anchored to block VWAP.
    help_zh: 暗池大宗買單佔比達到此門檻時判定機構吸籌，將 Tier 1 吸籌限價錨定至 Block VWAP。
  - key: dark_pool_distribution_threshold
    group: trading
    type: float
    default: 0.65
    min: 0.50
    max: 0.90
    label_en: Dark Pool Distribution Sell Ratio Threshold
    label_zh: 暗池大宗機構出貨拋售佔比門檻
    help_en: Dark pool sell ratio above which institutional distribution is declared and limit orders are shifted downward.
    help_zh: 暗池大宗賣單佔比達到此門檻時判定機構出貨，階梯限價向下平移防範承接拋售潮。
  - key: dark_pool_max_limit_shift_pct
    group: trading
    type: float
    default: 0.008
    min: 0.002
    max: 0.030
    label_en: Dark Pool Maximum Limit Price Shift Percentage
    label_zh: 暗池大宗換手最大價格校準幅度
    help_en: Maximum allowable percentage shift applied to limit orders based on dark pool prints.
    help_zh: 依據暗池大宗印痕調整階梯限價之最大幅度（預設 0.008 = 80 bps）。
  - key: enable_convex_sharpe_optimization
    group: trading
    type: bool
    default: true
    label_en: Enable Multi-Factor Convex Sharpe Frontier Optimization
    label_zh: 啟用利差回流資本最優夏普邊界動態二次規劃
    help_en: Optimizes recirculated capital deployment across high-alpha core assets using convex quadratic programming.
    help_zh: 運用凸二次規劃精算回流利差與可支配資金在核心高 Alpha 標的之邊際夏普最優權重。
  - key: convex_sharpe_max_weight_cap
    group: trading
    type: float
    default: 0.25
    min: 0.10
    max: 0.50
    label_en: Convex Sharpe Optimization Max Weight Cap per Ticker
    label_zh: 凸二次規劃單一標的最高配置權重上限
    help_en: Maximum capital allocation weight allowed for a single ticker to prevent over-concentration.
    help_zh: 凸規劃求解中單一標的之權重剛性上限（預設 25%）。
  - key: convex_sharpe_risk_free_rate
    group: trading
    type: float
    default: 0.045
    min: 0.000
    max: 0.100
    label_en: Convex Sharpe Optimization Risk-Free Benchmark Rate
    label_zh: 凸二次規劃無風險基準利率
    help_en: Annualized risk-free rate used in Sharpe ratio tangency calculation.
    help_zh: 計算切線夏普比率時採用之年化無風險基準利率（預設 4.5%）。
  - key: enable_iv_surface_skew_hedging
    group: trading
    type: bool
    default: true
    label_en: Enable Dynamic IV Surface Skew & Tail Risk Hedging
    label_zh: 啟用動態隱含波動率曲面偏度與極端尾部避險引擎
    help_en: Monitors option IV skew and term structure inversion to protect against extreme tail risk crashes.
    help_zh: 監控選擇權隱含波動率偏度與期限結構倒掛，防範極端黑天鵝尾部風險。
  - key: iv_skew_warning_threshold
    group: trading
    type: float
    default: 1.25
    min: 1.05
    max: 2.00
    label_en: IV Skew Warning Ratio Threshold
    label_zh: 選擇權隱含波動率偏度預警門檻
    help_en: 25-Delta Put/Call IV ratio threshold triggering elevated risk warning and limit price downward shift.
    help_zh: 25-Delta Put/Call 隱含波動率比率達到此門檻時啟動風控預警並下移限價掛單。
  - key: iv_skew_extreme_threshold
    group: trading
    type: float
    default: 1.50
    min: 1.20
    max: 2.50
    label_en: IV Skew Extreme Panic Threshold
    label_zh: 選擇權隱含波動率極端恐慌倒掛門檻
    help_en: 25-Delta Put/Call IV ratio threshold triggering tail risk emergency defense and aggressive limit downward shift.
    help_zh: 25-Delta Put/Call 隱含波動率比率達到此門檻時判定黑天鵝極端恐慌，建倉規模壓縮至 40% 並大幅下移掛單。
  - key: iv_term_structure_inversion_threshold
    group: trading
    type: float
    default: -0.03
    min: -0.10
    max: 0.00
    label_en: IV Term Structure Inversion Threshold
    label_zh: 隱含波動率期限結構倒掛門檻
    help_en: Term structure slope (90d - 30d IV) below which acute crash panic backwardation is declared.
    help_zh: 遠期與短期隱含波動率之差小於此門檻時判定極端短期恐慌倒掛（預設 -3.0% vol）。
  - key: iv_skew_max_limit_shift_pct
    group: trading
    type: float
    default: 0.008
    min: 0.002
    max: 0.030
    label_en: Maximum IV Skew Limit Price Shift Percentage
    label_zh: 選擇權隱含波動率偏度最大限價下移幅度
    help_en: Maximum allowable downward shift percentage applied to limit orders under elevated IV skew.
    help_zh: 遭遇隱含波動率偏度恐慌時階梯限價單向下平移之最大幅度（預設 0.008 = 80 bps）。
  - key: enable_microstructure_ofi_defense
    group: trading
    type: bool
    default: true
    label_en: Enable Microstructure Order Flow Imbalance & Vacuum Defense
    label_zh: 啟用微觀訂單流失衡率與做市商流動性真空防禦
    help_en: Monitors order flow imbalance (OFI) and spreads to block orders during market maker liquidity vacuums.
    help_zh: 監控 Cont et al. (2014) OFI 訂單流失衡與價差衝擊，在做市商撤單形成的流動性真空期間阻斷買單。
  - key: ofi_spread_shock_multiplier
    group: trading
    type: float
    default: 2.5
    min: 1.5
    max: 5.0
    label_en: Microstructure Spread Shock Multiplier
    label_zh: 微觀做市商價差衝擊倍數門檻
    help_en: Spread expansion multiple relative to median spread triggering liquidity vacuum freeze defense.
    help_zh: 當前買賣價差相對於中位數價差之跳增倍數達到此門檻時判定做市商撤單真空（預設 2.5x）。
  - key: ofi_vacuum_cooldown_seconds
    group: trading
    type: int
    default: 120
    min: 30
    max: 600
    label_en: Microstructure Liquidity Vacuum Freeze Cooldown Seconds
    label_zh: 微觀流動性真空防禦冷凍冷卻時長（秒）
    help_en: Number of seconds to freeze aggressive buy orders following a detected liquidity vacuum shock.
    help_zh: 偵測到流動性真空價差衝擊後，暫停新開多頭以防滑點吞噬之冷卻秒數（預設 120 秒）。





