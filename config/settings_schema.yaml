# ═══════════════════════════════════════════════════════════════════════════
# Settings schema — the registry for every user-facing configuration key.
#
# WHY THIS FILE EXISTS
#
# The `settings` table is a schema-less key/value store. Before this file, the
# consequences were:
#
#   * ~100 keys existed only as string literals scattered across src/, with no
#     list of what was valid;
#   * defaults were re-declared at each read site and had already drifted —
#     `target_cash_ratio` was read with three different fallbacks (0.1, 0.10,
#     0.20) in four places;
#   * encryption was decided by regex-guessing the key name
#     (settings_repository's `sensitive_patterns`), so a credential whose name
#     lacked "key"/"token"/"secret" was silently stored in plaintext;
#   * the UI was 1030 lines of hand-written JSX, one block per field, and the
#     data-source list was declared a third time inside it.
#
# Adding a key here gives it: a default, a type, validation, encryption if it is
# a secret, and a rendered form field — with no Python or TypeScript change.
#
# SCOPE: user-facing configuration only. The same table is also used as a
# machine-written scratch store (53 of 128 live rows are `alpha_spy_*` generated
# code, plus `cached_*` runtime caches). Those are deliberately absent: the
# strict path is `save_settings_bulk` (the HTTP endpoints), while the internal
# single-key `save_setting` stays permissive so those writers keep working.
#
# 本檔是所有「使用者可見」設定鍵的註冊表。settings 表原本無 schema：~100 個鍵
# 只以字串常數散落各處、預設值在各讀取點重複宣告且已漂移、加密靠猜鍵名。
# 注意：同一張表也被機器寫入當暫存（線上 128 列中 53 列是產生的程式碼），
# 故本檔僅涵蓋使用者設定；嚴格驗證只作用在 HTTP 的 bulk 寫入路徑。
#
# FIELD REFERENCE
#   type      string | secret | int | float | bool | enum | json | list | cron | time
#   secret    encrypted at rest; never returned by the API (masked + has_value)
#   danger    UI must require explicit confirmation (money / trading impact)
#   restart   takes effect only after a container restart
#   depends   only shown/meaningful when the named bool key is true
# ═══════════════════════════════════════════════════════════════════════════

version: 1

groups:
  - id: ai
    label_en: AI Engine
    label_zh: AI 引擎
  - id: trading
    label_en: Trading & Risk
    label_zh: 交易與風控
  - id: allocation
    label_en: Allocation
    label_zh: 資產配置
  - id: sentinel
    label_en: Sentinel
    label_zh: 哨兵監控
  - id: notify
    label_en: Notifications
    label_zh: 通知
  - id: sources
    label_en: Data Sources
    label_zh: 資料來源
  - id: broker
    label_en: Brokers
    label_zh: 券商
  - id: ingest
    label_en: Content Ingestion
    label_zh: 內容攝取
  - id: system
    label_en: System
    label_zh: 系統

settings:

  # ── AI engine ────────────────────────────────────────────────────────────
  # AI_MODEL* are legacy fallbacks. The live path is the llm_tier_bindings
  # table, managed by the AI Engine UI; these are only consulted when a tier has
  # no binding. All five are NULL in the live database, which is the healthy
  # state — they exist so an unbound tier degrades rather than crashing.
  # AI_MODEL* 是舊路徑的 fallback；實際走 llm_tier_bindings 表。
  - key: AI_PROVIDER
    group: ai
    type: enum
    enum: [OpenRouter, Google Gemini, Groq, Ollama, OpenAI, NVIDIA]
    default: OpenRouter
    label_en: Default provider
    label_zh: 預設供應商
    help_en: Legacy fallback. Providers are normally managed per-tier in the AI Engine panel.
  - key: AI_MODEL
    group: ai
    type: string
    default: null
    label_en: Fallback model (smart tier)
    label_zh: 備援模型（smart）
    help_en: Only used when the smart tier has no binding in llm_tier_bindings.
  - key: AI_MODEL_ADVANCED
    group: ai
    type: string
    default: null
    label_en: Fallback model (advanced tier)
    label_zh: 備援模型（advanced）
  - key: AI_MODEL_SMART
    group: ai
    type: string
    default: null
    label_en: Fallback model (smart tier, explicit)
    label_zh: 備援模型（smart，明確）
  - key: AI_MODEL_FAST
    group: ai
    type: string
    default: null
    label_en: Fallback model (fast tier)
    label_zh: 備援模型（fast）
  - key: AI_MODEL_NANO
    group: ai
    type: string
    default: null
    label_en: Fallback model (nano tier)
    label_zh: 備援模型（nano）
  - key: external_mcp_servers
    group: ai
    type: json
    default: []
    label_en: External MCP servers
    label_zh: 外部 MCP 伺服器
    help_en: JSON list of SSE/stdio endpoints exposed to the conversation agent.
  - key: auto_promote_synthesized_factors
    group: ai
    type: bool
    default: true
    label_en: Auto-promote synthesized factors
    label_zh: 自動晉升自研量化因子
    help_en: Automatically promote synthesized code artifacts from provisional canary shadow tracking to active status upon passing evaluation.
    help_zh: 當自研因子通過回測、WFA、蒙地卡羅與金絲雀影子考覈無異常時，由排程自動晉升為實盤 ACTIVE 因子。
  - key: factor_max_correlation_threshold
    group: ai
    type: float
    default: 0.65
    label_en: Factor max correlation threshold
    label_zh: 自研因子最大相關性閾值
    help_en: Maximum allowed Spearman/Pearson correlation between candidate factors and active live factors to prevent multi-collinearity.
    help_zh: 候選量化因子與線上在線 ACTIVE 因子的最大允許相關係數（預設 0.65）。超過此門檻將觸發共線性阻斷，避免重複配置。
  - key: adaptive_council_meta_learning_enabled
    group: ai
    type: bool
    default: true
    label_en: Adaptive Council Meta-Learning Loop (A1)
    label_zh: 自適應評議會元學習閉環
    help_en: Dynamically condition council expert voting weights on market regime, EVT tail risk, and historical attribution win-rates.
    help_zh: 整合 D1 健康度、O1 貝氏體制與 O2 EVT 尾部黑天鵝，動態校準專家投票權重並賦予黑天鵝否決權。
  - key: meta_learning_smoothing_kappa
    group: ai
    type: float
    default: 10.0
    min: 1.0
    max: 50.0
    label_en: Meta-learning attribution smoothing factor (kappa)
    label_zh: 元學習歸因平滑因子（kappa）
    help_en: Prior weight parameter kappa for Laplace/Dirichlet smoothing in rolling win rate calibration.
    help_zh: 專家滾動勝率貝氏更新之平滑權重係數 kappa（預設 10.0）。
  - key: meta_learning_black_swan_risk_veto
    group: ai
    type: bool
    default: true
    label_en: EVT Black Swan Risk Agent Veto Power
    label_zh: 極值黑天鵝 Risk Agent 一票否決權
    help_en: Automatically anchor Risk Agent weight >= 0.50 with mandatory veto authority when EVT Black Swan alert is WARNING or CRITICAL.
    help_zh: 當 O2 EVT 極值黑天鵝預警為 WARNING 或 CRITICAL 時，強制將 Risk Agent 權重提升至 50% 以上並啟用一票否決權。
  - key: cognitive_blindspot_detection_enabled
    group: ai
    type: bool
    default: true
    label_en: Online Cognitive Blindspot Detector & Self-Reflection (A2)
    label_zh: 在線認知盲區偵測與自動反省校準
    help_en: Detect repeated failure patterns and inject self-reflection constraints into council agent debate prompts.
    help_zh: 自動偵測專家連敗與體制錯配盲區，並向評議會辯論注入自我反省校準約束。
  - key: cognitive_blindspot_consecutive_failure_threshold
    group: ai
    type: int
    default: 2
    min: 2
    max: 10
    label_en: Blindspot Consecutive Failure Threshold
    label_zh: 認知盲區連續失誤門檻
    help_en: Minimum number of consecutive decision misses before classifying an active blindspot and triggering reflection constraints.
    help_zh: 專家連續預測失誤觸發盲區警報與反省約束的最低連敗次數（預設 2 次）。
  - key: council_memory_retrieval_enabled
    group: ai
    type: bool
    default: true
    label_en: Council Debate Memory & Vector Precedent Retrieval (A3)
    label_zh: 評議會歷史辯論向量檢索與決策歸因知識庫
    help_en: Semantically retrieves historical debate minutes with post-trade alpha attribution to enrich council debate context and CIO deliberations.
    help_zh: 自動以向量檢索歷史相似辯論前例與事後 Alpha 結算歸因，注入評議會專家系統提示詞與 CIO 終審裁決。
  - key: council_memory_similarity_threshold
    group: ai
    type: float
    default: 0.60
    min: 0.10
    max: 0.99
    label_en: Debate Memory Semantic Similarity Threshold
    label_zh: 辯論記憶語意相似度門檻
    help_en: Cosine similarity cutoff for retrieving past council debate minutes via pgvector embeddings.
    help_zh: 經由 pgvector 向量嵌入檢索歷史評議會紀要之最低餘弦相似度門檻（預設 0.60）。
  - key: council_memory_top_k
    group: ai
    type: int
    default: 3
    min: 1
    max: 10
    label_en: Debate Memory Top-K Precedents
    label_zh: 辯論記憶前例檢索數量 (Top-K)
    help_en: Maximum number of relevant historical debate precedents injected into the council deliberation context.
    help_zh: 注入評議會各專家與 CIO 決策上下文之歷史相似辯論先例最大數量（預設 3 筆）。
  - key: council_diversity_enabled
    group: ai
    type: bool
    default: true
    label_en: Council Diversity Entropy & Groupthink Shielder (A4)
    label_zh: 評議會專家意見歧異度與群體思維盲區熵值警戒 (A4)
    help_en: Computes normalized Shannon Diversity Entropy across expert votes to detect echo chambers and inject Devil's Advocate challenges.
    help_zh: 計算評議會專家投票之標準化香農多樣性熵值，在意見過度同質化時發出群體思維警戒並注入魔鬼代言人反向審查。
  - key: groupthink_entropy_threshold
    group: ai
    type: float
    default: 0.40
    min: 0.10
    max: 0.80
    label_en: Groupthink Normalized Entropy Threshold
    label_zh: 群體思維標準化熵值門檻
    help_en: Normalized Shannon entropy threshold below which council consensus is flagged for potential echo-chamber herd bias.
    help_zh: 評議會標準化多樣性熵值下限門檻（預設 0.40）；低於此值且多數意見高度集中時觸發群體思維警戒。
  - key: groupthink_dominant_ratio_threshold
    group: ai
    type: float
    default: 0.80
    min: 0.50
    max: 0.99
    label_en: Groupthink Dominant Stance Ratio Threshold
    label_zh: 群體思維多數立場集中度門檻
    help_en: Minimum proportion of weighted votes aligned in the dominant stance required to trip the groupthink alert.
    help_zh: 評議會單一多數立場（買/賣/觀望）佔總加權票數之最低集中比例門檻（預設 0.80 即 80%）。
  - key: groupthink_haircut_pct
    group: ai
    type: float
    default: 0.25
    min: 0.05
    max: 0.60
    label_en: Groupthink Position Conviction Haircut
    label_zh: 群體思維部位置信度保護折減率
    help_en: Haircut percentage applied to position sizing or signal conviction when an echo chamber is identified.
    help_zh: 觸發群體思維警戒時，建議部位大小或信號置信度之強制安全折減比率（預設 0.25 即 25% 折減）。
  - key: debate_termination_enabled
    group: ai
    type: bool
    default: true
    label_en: Dynamic Debate Termination & Information Gain (A5)
    label_zh: 跨專家交互辯論動態終止與邊際資訊增益 (A5)
    help_en: Dynamically stops council debate rounds early when arguments converge and marginal information gain drops below threshold.
    help_zh: 監控專家多輪辯論之語意收斂度與邊際資訊增益，在觀點已定時提早動態終止以節省 30%~50% 呼叫延遲與 Token 成本。
  - key: debate_min_rounds
    group: ai
    type: int
    default: 2
    min: 1
    max: 5
    label_en: Debate Minimum Required Rounds
    label_zh: 評議會最小必辯輪次
    help_en: Minimum number of debate rounds that must execute before dynamic early stopping is permitted.
    help_zh: 啟用動態提早終止前必須執行的最低辯論輪次（預設 2 輪），確保專家充分陳述初始觀點。
  - key: debate_max_rounds
    group: ai
    type: int
    default: 5
    min: 2
    max: 10
    label_en: Debate Maximum Round Limit
    label_zh: 評議會最大輪次上限
    help_en: Hard ceiling for total allowed debate rounds regardless of convergence.
    help_zh: 評議會辯論輪次之剛性上限（預設 5 輪）；達到此輪次時強制終止並轉由 CIO 裁決。
  - key: debate_marginal_info_gain_threshold
    group: ai
    type: float
    default: 0.12
    min: 0.01
    max: 0.50
    label_en: Marginal Information Gain Cutoff (epsilon)
    label_zh: 邊際資訊增益終止門檻 (epsilon)
    help_en: Threshold for Delta Information Gain below which further debate rounds are deemed redundant.
    help_zh: 輪次間邊際資訊增益下限門檻（預設 0.12）；低於此門檻且論點高度相似時觸發提早終止。
  - key: debate_argument_similarity_threshold
    group: ai
    type: float
    default: 0.85
    min: 0.50
    max: 0.99
    label_en: Debate Argument Semantic Convergence Similarity
    label_zh: 辯論論點語意收斂相似度門檻
    help_en: Semantic argument similarity threshold across rounds indicating expert arguments have reached saturation.
    help_zh: 前後輪次論點語意相似度門檻（預設 0.85）；超過代表各專家僅在重複相同論據無新資訊。
  - key: council_counterfactual_enabled
    group: ai
    type: bool
    default: true
    label_en: Council Counterfactual Reasoning & Stress Inoculation (A6)
    label_zh: 評議會反事實推理與情境壓力假設生成 (A6)
    help_en: Generates dynamic 'What-If' stress scenarios probing consensus vulnerabilities before CIO final verdict.
    help_zh: 在 CIO 終審前生成反事實壓力假設（如利率反彈、供應鏈斷鏈、巨頭砍單），要求專家提出防守抗跌方案。
  - key: council_counterfactual_max_scenarios
    group: ai
    type: int
    default: 3
    min: 1
    max: 6
    label_en: Counterfactual Maximum Scenarios Count
    label_zh: 反事實情境最大生成數量
    help_en: Maximum number of counterfactual stress scenarios synthesized for a single deliberation.
    help_zh: 單次評議會終審所生成之反事實情境假設數量上限（預設 3 組）。
  - key: council_counterfactual_conviction_threshold
    group: ai
    type: float
    default: 0.70
    min: 0.50
    max: 0.95
    label_en: Counterfactual Trigger Conviction Threshold
    label_zh: 反事實壓力測試啟動置信度門檻
    help_en: Minimum consensus conviction score required to trigger intensive counterfactual stress testing.
    help_zh: 評議會共識置信度門檻（預設 0.70）；高於此門檻之單邊共識將強制啟動反事實壓力測試以防過度自信。
  - key: council_contagion_enabled
    group: ai
    type: bool
    default: true
    label_en: Cross-Market Contagion & Inter-Asset Transmission (A7)
    label_zh: 跨市場連鎖傳導與資產外溢分析 (A7)
    help_en: Evaluates multi-channel spillover risks (Rates, FX, Commodities, Credit) before final investment deliberation.
    help_zh: 於評議會決策前評估利率、匯率、大宗原物料及信用利差等跨市場連鎖外溢風險，確保無宏觀盲區。
  - key: council_contagion_risk_threshold
    group: ai
    type: float
    default: 0.65
    min: 0.10
    max: 0.95
    label_en: Contagion Alert Risk Threshold
    label_zh: 跨市場外溢警報風險門檻
    help_en: Overall cross-market contagion risk score threshold to trigger high-priority risk-off and hedging alerts.
    help_zh: 跨市場傳染綜合風險評分臨界值（預設 0.65）；超過該門檻時強制啟動宏觀對沖避險覆蓋建議。
  - key: council_contagion_lookback_days
    group: ai
    type: int
    default: 30
    min: 5
    max: 180
    label_en: Contagion Transmission Lookback Days
    label_zh: 跨市場外溢分析回測觀察期 (天)
    help_en: Number of historical days used to compute dynamic asset cross-correlation and spillover beta.
    help_zh: 計算資產跨市場動態相關性與外溢 Beta 所參考之歷史交易日長度（預設 30 天）。

  # ── Trading & risk ───────────────────────────────────────────────────────
  - key: ai_trading_enabled
    group: trading
    type: bool
    default: false
    danger: true
    label_en: Autonomous trading
    label_zh: 自動交易
    help_en: >-
      Master switch for placing real orders. This — not TRADING_MODE — is the
      brake: the eToro token has no demo permission, so TRADING_MODE=paper makes
      every broker call fail outright instead of degrading.
    help_zh: 下真實訂單的總開關。TRADING_MODE=paper 在本專案是全停而非降級，安全煞車請用此鍵。
  - key: auto_trade_threshold
    group: trading
    type: int
    default: 75
    min: 0
    max: 100
    danger: true
    label_en: Auto-execute confidence (buy)
    label_zh: 自動執行信心門檻（買進）
  - key: auto_trade_threshold_sell
    group: trading
    type: int
    default: 60
    min: 0
    max: 100
    danger: true
    label_en: Auto-execute confidence (sell)
    label_zh: 自動執行信心門檻（賣出）
  - key: enable_slippage_guard
    group: trading
    type: bool
    default: true
    label_en: Enable anti-slippage & spread circuit breaker
    label_zh: 啟用防滑點與買賣價差熔斷守衛
    help_en: Guards against broker spread markup and opening volatility by checking bid-ask spread before order execution.
    help_zh: 下單前檢測即時買賣價差與開盤前 5 分鐘波動率，防止市價單被券商價差吃損。
  - key: max_allowed_spread_pct
    group: trading
    type: float
    default: 0.0015
    min: 0.0005
    max: 0.0100
    label_en: Max allowed bid-ask spread (ratio)
    label_zh: 允許之最大買賣價差比例
    help_en: Maximum allowable (ask - bid) / mid spread ratio before triggering circuit breaker (default 0.0015 = 0.15%).
    help_zh: 允許的最大買賣價差比率，超過即觸發熔斷保護暫緩市價下單（預設 0.0015 即 0.15%）。
  - key: enable_dynamic_fill_quality_tracking
    group: trading
    type: bool
    default: true
    label_en: Enable dynamic fill quality tracking
    label_zh: 啟用動態成交品質追蹤
    help_en: Tracks realized vs expected execution slippage using EWMA and syncs metrics to Redis.
    help_zh: 透過 EWMA 動態追蹤實際與預期成交滑點偏離，並透過 Redis 分散式快取跨程序同步。
  - key: fill_quality_ewma_alpha
    group: trading
    type: float
    default: 0.20
    min: 0.05
    max: 0.50
    label_en: Fill quality EWMA alpha factor
    label_zh: 成交品質 EWMA 平滑係數
    help_en: Exponential smoothing factor applied to new fill slippage deviations (default 0.20).
    help_zh: 新成交滑點偏離套用之指數平滑權重係數（預設 0.20）。
  - key: liquidity_black_hole_multiplier_threshold
    group: trading
    type: float
    default: 2.50
    min: 1.50
    max: 5.00
    label_en: Liquidity black hole multiplier threshold
    label_zh: 流動性黑洞補償乘數熔斷門檻
    help_en: Slippage multiplier threshold triggering liquidity black hole breaker when adverse fills occur (default 2.50x).
    help_zh: 當連續發生逆向選擇時觸發流動性黑洞熔斷保護之滑價補償乘數門檻（預設 2.50 倍）。
  - key: max_slippage_compensation_buffer
    group: trading
    type: float
    default: 0.0025
    min: 0.0005
    max: 0.0100
    label_en: Maximum slippage compensation limit price buffer
    label_zh: 自適應限價最大滑價補償緩衝
    help_en: Maximum price premium buffer added to adaptive limit orders (default 0.0025 = 25 bps).
    help_zh: 自適應限價單允許之最大保護溢價緩衝（預設 0.0025 即 25 bps），防範極端追價摩擦。
  - key: market_open_delay_minutes
    group: trading
    type: int
    default: 5
    min: 0
    max: 30
    label_en: Market open delay window (minutes)
    label_zh: 美股開盤延遲保護視窗（分鐘）
    help_en: Number of minutes after market open (09:30 EST) to pause market orders to avoid extreme opening auction spreads.
    help_zh: 開盤（09:30 EST）後暫緩市價單之下單分鐘數，避開開盤集合競價極端價差（預設 5 分鐘至 09:35 EST）。
  - key: enable_market_open_cash_deployment
    group: trading
    type: bool
    default: true
    label_en: Enable market-open disciplined batch cash deployment
    label_zh: 啟用美股開盤階梯式分批建倉
    help_en: Automatically deploys idle cash into top high-conviction holdings in disciplined batches at market open.
    help_zh: 開盤 09:35 EST 定時評估閒置現金，以階梯式分批模式注入最高確信度核心標的。
  - key: batch_cash_deployment_portion
    group: trading
    type: float
    default: 0.33
    min: 0.10
    max: 1.00
    label_en: Batch cash deployment portion
    label_zh: 每批次建倉動用比例
    help_en: Portion of deployable excess cash to deploy per batch (default 0.33 = 1/3 per batch).
    help_zh: 每次批次建倉動用可支配現金的比例（預設 0.33 即 1/3，分 3 批推進）。
  - key: enable_earnings_blackout_guard
    group: trading
    type: bool
    default: true
    label_en: Enable earnings release blackout guard
    label_zh: 啟用財報發布避開守衛
    help_en: Automatically defers opening positions in candidates within pre/post earnings blackout window to avoid binary event volatility.
    help_zh: 標的於財報日前後視窗內自動暫緩建倉，規避二元財報波動與引申波動率 (IV) 崩跌風險。
  - key: earnings_blackout_pre_hours
    group: trading
    type: float
    default: 48.0
    min: 12.0
    max: 120.0
    label_en: Earnings blackout pre-release window (hours)
    label_zh: 財報發布前避開時間（小時）
    help_en: Hours prior to earnings announcement to pause opening new positions (default 48.0h).
    help_zh: 財報發布前暫緩開倉之保護小時數（預設 48 小時即 2 天）。
  - key: earnings_blackout_post_hours
    group: trading
    type: float
    default: 24.0
    min: 6.0
    max: 72.0
    label_en: Earnings blackout post-release window (hours)
    label_zh: 財報發布後沉澱時間（小時）
    help_en: Hours after earnings announcement to pause opening new positions for volatility to settle (default 24.0h).
    help_zh: 財報發布後暫緩開倉之市場消化沉澱小時數（預設 24 小時即 1 天）。
  - key: enable_macro_calendar_blackout_guard
    group: trading
    type: bool
    default: true
    label_en: Enable high-impact macro calendar blackout guard
    label_zh: 啟用重大宏觀數據發布避開守衛
    help_en: Pauses market-wide order execution immediately around FOMC rate decisions and CPI releases to avoid extreme slippage.
    help_zh: 於聯準會 FOMC 利率決議與 CPI 發布窗口暫緩市價下單，防範極端滑點與流動性真空。
  - key: macro_blackout_pre_minutes
    group: trading
    type: int
    default: 60
    min: 15
    max: 180
    label_en: Macro event pre-release window (minutes)
    label_zh: 宏觀數據發布前保護視窗（分鐘）
    help_en: Minutes prior to high-impact macro event (FOMC/CPI/NFP) to pause market orders (default 60 min).
    help_zh: 重大宏觀事件發布前暫緩市價下單之分鐘數（預設 60 分鐘）。
  - key: macro_blackout_post_minutes
    group: trading
    type: int
    default: 30
    min: 10
    max: 120
    label_en: Macro event post-release window (minutes)
    label_zh: 宏觀數據發布後沉澱視窗（分鐘）
    help_en: Minutes after high-impact macro event to pause market orders (default 30 min).
    help_zh: 重大宏觀事件發布後暫緩市價下單之沉澱分鐘數（預設 30 分鐘）。
  - key: tiered_approval_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable tiered auto-approval
    label_zh: 啟用分級自動核准
    help_en: Automatically approve high-confidence small-sized orders within strict risk bounds without human block.
    help_zh: 在嚴格風控邊界下，自動核准放行符合條件的高勝率小額試單，避免因無人在線而錯失時機。
  - key: tiered_approval_auto_score_min
    group: trading
    type: float
    default: 6.8
    min: 5.0
    max: 10.0
    label_en: Tiered auto-approval min score
    label_zh: 分級自動核准最低信心分數
    help_en: Minimum confidence score required to qualify for tiered auto-approval (0-10 scale).
    help_zh: 進入分級自動核准之最低信心門檻（0-10 分制，預設 6.8 分）。
  - key: tiered_approval_max_amount_usd
    group: trading
    type: float
    default: 30.0
    min: 5.0
    max: 100.0
    danger: true
    label_en: Tiered auto-approval max amount ($)
    label_zh: 分級自動核准單筆金額上限（美元）
    help_en: Maximum USD amount per trade allowed to be auto-approved.
    help_zh: 單筆交易允許自動放行之最高金額上限（美元）。
  - key: tiered_approval_max_daily_count
    group: trading
    type: int
    default: 3
    min: 1
    max: 20
    label_en: Tiered auto-approval max daily count
    label_zh: 每日分級自動核准上限筆數
    help_en: Maximum number of orders that can be auto-approved per day.
    help_zh: 每日允許分級自動放行之最大訂單筆數，防止異常行情連續自動下單。
  - key: enable_fixed_stops
    group: trading
    type: bool
    default: false
    danger: true
    label_en: Enable fixed-percentage stops
    label_zh: 啟用固定百分比停損停利
    help_en: >-
      When false (recommended for long-term investing), positions are NOT sold based
      on arbitrary fixed percentages (-8% / +20%), but managed through opportunity cost
      rotation, concentration rebalancing, and thesis breakdown analysis.
    help_zh: 設為 false 時（長線投資推薦），部位不會因死板的固定百分比（如 -8% 或 +20%）被強制賣出，改以機會成本換庫、集中度再平衡與核心論點分析驅動。
  - key: stop_loss_pct
    group: trading
    type: float
    default: 8.0
    min: 1.0
    max: 50.0
    danger: true
    label_en: Stop-loss threshold (%)
    label_zh: 停損門檻百分比（%）
    help_en: Used only when enable_fixed_stops is true.
    help_zh: 僅在 enable_fixed_stops 為 true 時生效。
  - key: take_profit_pct
    group: trading
    type: float
    default: 20.0
    min: 5.0
    max: 200.0
    label_en: Take-profit threshold (%)
    label_zh: 停利門檻百分比（%）
    help_en: Used only when enable_fixed_stops is true.
    help_zh: 僅在 enable_fixed_stops 為 true 時生效。
  - key: enable_trailing_stops
    group: trading
    type: bool
    default: true
    label_en: Enable trailing stops
    label_zh: 啟用移動停損
    help_en: Dynamically trail stops behind peak prices to protect realized gains.
    help_zh: 啟用最高價回檔追蹤停損機制，當持倉獲利回檔超過設定門檻時自動鎖利出場。
  - key: trailing_stop_pct
    group: trading
    type: float
    default: 6.0
    min: 1.0
    max: 30.0
    label_en: Trailing stop threshold (%)
    label_zh: 移動停損回檔門檻（%）
    help_en: Allowable drawdown from peak price before triggering trailing stop exit.
    help_zh: 自部位最高價允許回檔之最大百分比，超過即觸發移動停損出場。
  - key: enable_ratchet_take_profit
    group: trading
    type: bool
    default: false
    label_en: Enable ratchet take-profit
    label_zh: 啟用階梯鎖利
    help_en: Dynamically tighten trailing stops as profit targets are reached.
    help_zh: 當未實現獲利達到不同階梯目標時，動態收緊移動停損保護利潤。
  - key: enable_stagnation_pruning
    group: trading
    type: bool
    default: true
    label_en: Enable dead-capital stagnation pruning
    label_zh: 啟用死資金停滯修剪
    help_en: Prune sideways/stagnant holdings lacking momentum after minimum days to liberate liquidity for top-performing alpha assets.
    help_zh: 持倉達門檻天數且損益橫盤鈍化、跑輸大盤時，主動停滯平倉修剪以釋放流動性換庫至強勢 Alpha 標的（長期贏家自動豁免）。
  - key: stagnation_prune_min_days
    group: trading
    type: int
    default: 15
    min: 5
    max: 90
    label_en: Minimum holding days for stagnation pruning
    label_zh: 死資金修剪最短觀察天數
    help_en: Minimum holding duration in days before evaluating dead-capital momentum stall.
    help_zh: 評估死資金橫盤停滯的最短持倉天數門檻（預設 15 天）。
  - key: enable_pyramiding
    group: trading
    type: bool
    default: true
    label_en: Enable momentum pyramiding position scaling
    label_zh: 啟用波段動能金字塔順勢加碼
    help_en: Pyramiding position scale-in on momentum breakout winners once trailing stop locks profits above cost (zero-risk guarantee).
    help_zh: 當強勢股獲利進入成熟期且停損已鎖定在成本之上時，自動執行金字塔順勢遞減加碼擴大 Alpha 效益。
  - key: max_pyramid_stages
    group: trading
    type: int
    default: 2
    min: 1
    max: 5
    label_en: Maximum pyramiding stages
    label_zh: 金字塔加碼最高階梯數
    help_en: Maximum number of scale-in stages allowed per winning position.
    help_zh: 單一強勢股持倉允許執行的最大金字塔順勢加碼階梯數（預設 2 階）。
  - key: pyramid_stage1_min_pnl_pct
    group: trading
    type: float
    default: 8.0
    min: 3.0
    max: 50.0
    label_en: Stage 1 minimum profit hurdle (%)
    label_zh: 第一階加碼最低浮盈門檻 (%)
    help_en: Minimum unrealized profit percentage required to trigger Stage 1 pyramiding scale-in.
    help_zh: 觸發第一階金字塔加碼所需之最低未實現報酬率門檻（預設 +8.0%）。
  - key: pyramid_stage2_min_pnl_pct
    group: trading
    type: float
    default: 16.0
    min: 5.0
    max: 100.0
    label_en: Stage 2 minimum profit hurdle (%)
    label_zh: 第二階加碼最低浮盈門檻 (%)
    help_en: Minimum unrealized profit percentage required to trigger Stage 2 pyramiding scale-in.
    help_zh: 觸發第二階金字塔加碼所需之最低未實現報酬率門檻（預設 +16.0%）。
  - key: pyramid_stage1_scale_ratio
    group: trading
    type: float
    default: 0.25
    min: 0.05
    max: 0.50
    label_en: Stage 1 scale-in ratio
    label_zh: 第一階加碼部位比例
    help_en: Position scale ratio for Stage 1 pyramiding (e.g. 0.25 = +25% of current shares).
    help_zh: 第一階金字塔加碼部位比例（預設 0.25，即加碼現有股數之 25%）。
  - key: pyramid_stage2_scale_ratio
    group: trading
    type: float
    default: 0.15
    min: 0.05
    max: 0.50
    label_en: Stage 2 scale-in ratio
    label_zh: 第二階加碼部位比例
    help_en: Position scale ratio for Stage 2 pyramiding (e.g. 0.15 = +15% of current shares).
    help_zh: 第二階金字塔加碼部位比例（預設 0.15，即加碼現有股數之 15%）。
  - key: enable_breakout_volume_filter
    group: trading
    type: bool
    default: true
    label_en: Enable breakout volume & false breakout filter
    label_zh: 啟用量價突破與假突破過濾
    help_en: Filter out false breakouts, low-volume traps, and overextended VWAP surges during momentum breakout and pyramiding entries.
    help_zh: 在動能突破與順勢金字塔加碼時，檢驗成交量放量比率、VWAP 位階與長上影線，過濾無量誘多與假突破。
  - key: breakout_min_volume_ratio
    group: trading
    type: float
    default: 1.2
    min: 0.5
    max: 5.0
    label_en: Minimum volume expansion ratio for breakout
    label_zh: 突破最低放量倍數 (vs ADV20)
    help_en: Minimum volume multiple relative to 20-day ADV required for breakout confirmation.
    help_zh: 突破確認所需之最低放量倍數（相對於 20 日日均量 ADV20，預設 1.2 倍）。
  - key: breakout_max_vwap_dev_pct
    group: trading
    type: float
    default: 6.0
    min: 1.0
    max: 20.0
    label_en: Maximum allowable VWAP deviation (%)
    label_zh: VWAP 最大允許正乖離率 (%)
    help_en: Maximum price deviation percentage above VWAP before flagging as overbought exhaustion.
    help_zh: 現價高於 VWAP 的最大容許偏離百分比，超過時判定為短線過度延伸（預設 +6.0%）。
  - key: breakout_max_upper_shadow_ratio
    group: trading
    type: float
    default: 0.40
    min: 0.10
    max: 0.80
    label_en: Maximum upper shadow ratio for pin bar rejection
    label_zh: 假突破長上影線比例上限
    help_en: Maximum allowable upper shadow ratio of the candle before flagging as a false breakout / pin bar rejection.
    help_zh: K 線上影線佔整體振幅的最大允許比例，超過時判定為衝高回落假突破（預設 0.40 即 40%）。
  - key: enable_macro_volatility_hedging
    group: trading
    type: bool
    default: true
    label_en: Enable macro volatility hedging
    label_zh: 啟用跨市場波動率體制自動避險
    help_en: Autonomously dynamically scale defensive cash and deploy inverse ETF hedges during market volatility spikes and regime shifts.
    help_zh: 當大盤波動率體制突變進入恐慌／極端波動時，自主調整防禦陣型動態增厚現金或配置反向避險標的。
  - key: macro_hedge_vix_threshold
    group: trading
    type: float
    default: 30.0
    min: 15.0
    max: 60.0
    label_en: Macro hedge VIX threshold
    label_zh: 宏觀波動率避險觸發門檻 (VIX)
    help_en: VIX level above which macro volatility defensive hedging and cash scaling are activated.
    help_zh: 當 VIX 超過此門檻或 Z-Score 達到極端值時啟動避險機制（預設 30.0）。
  - key: macro_hedge_target_cash_ratio
    group: trading
    type: float
    default: 0.25
    min: 0.10
    max: 0.60
    label_en: Defensive target cash ratio during macro hedge
    label_zh: 避險模式目標防守現金比例
    help_en: Target defensive cash ratio cap scaled up dynamically during high/critical volatility regimes.
    help_zh: 極端波動時動態調升之防守現金佔比上限（預設 25%）。
  - key: macro_hedge_instrument
    group: trading
    type: string
    default: SH
    label_en: Macro hedge instrument
    label_zh: 預設反向指數避險標的
    help_en: Recommended inverse ETF or defensive asset ticker for macro hedging (e.g. SH, SQQQ, TLT).
    help_zh: 啟用指數對沖時推薦之反向/避險標的，如 SH、SQQQ 或 TLT（預設 SH）。
  - key: enable_inverse_etf_hedge
    group: trading
    type: bool
    default: false
    label_en: Enable inverse ETF hedging allocation
    label_zh: 啟用反向 ETF 避險標的建倉
    help_en: Whether to directly purchase inverse ETF hedges in addition to dynamic cash scaling during extreme panic.
    help_zh: 是否在極端恐慌時除拉高現金外，亦直接買入反向 ETF 對沖標的（預設關閉，優先現金防守）。
  - key: enable_tactical_factor_rotation
    group: trading
    type: bool
    default: true
    label_en: Enable tactical factor rotation & liquidity premium
    label_zh: 啟用多因子流動性溢價與智能波段換倉
    help_en: Autonomously rotate defensive cash and underperforming capital into top alpha elasticity leaders when market rebounds.
    help_zh: 結合市場週期體制與量價流動性溢價，於大盤回穩或反轉時自動將防守避險釋放的現金精準切換至 Alpha 彈性最大板塊。
  - key: factor_liquidity_premium_weight
    group: trading
    type: float
    default: 0.35
    min: 0.10
    max: 0.70
    label_en: Liquidity premium factor weight
    label_zh: 流動性溢價因子評分權重
    help_en: Base weight assigned to volume expansion and Amihud liquidity premium metrics in candidate scoring.
    help_zh: 在候選標的綜合評分中，Amihud 與 ADV 放量之流動性溢價指標所佔的基礎權重。
  - key: tactical_rotation_min_edge_pct
    group: trading
    type: float
    default: 0.08
    min: 0.03
    max: 0.25
    label_en: Tactical rotation minimum net alpha edge
    label_zh: 波段換倉超額 Alpha 淨門檻
    help_en: Minimum net alpha edge after roundtrip transaction and friction costs required before executing a portfolio swap.
    help_zh: 新候選標的相較持有標的必須具備之最低超額評分差距，方可觸發汰弱換強換倉（預設 8% 即 0.08）。
  - key: tactical_rotation_max_swaps_per_tick
    group: trading
    type: int
    default: 2
    min: 1
    max: 5
    label_en: Maximum tactical rotation swaps per cycle
    label_zh: 單次波段換倉最大筆數限制
    help_en: Maximum number of position swaps allowed per evaluation cycle to prevent excessive turnover.
    help_zh: 防止頻繁過度交易，限制單一評估週期內最多執行之換倉組數（預設 2 組）。
  - key: enable_rebound_cash_reinvestment
    group: trading
    type: bool
    default: true
    label_en: Enable rebound cash reinvestment
    label_zh: 啟用恐慌拐點反彈現金直投
    help_en: Prioritize direct deployment of defensive cash into top alpha elasticity leaders during early market rebounds.
    help_zh: 當市場由極端恐慌回落或處於超跌反彈階段時，自動將防守閒置現金優先注入 Top Alpha 彈性領導標的。
  - key: enable_tactical_factor_replay_tuning
    group: trading
    type: bool
    default: true
    label_en: Enable tactical factor replay auto-evolution
    label_zh: 啟用多因子回放回測與夏普自動調參
    help_en: Autonomously replay historical regimes and calibrate factor weight matrices using Simulated Annealing and Walk-Forward cross validation.
    help_zh: 自動於背景排程執行歷史時間序列重播，透過模擬退火與 Walk-Forward 前向走查最佳化 4 大市場週期的因子權重矩陣。
  - key: replay_evolution_lookback_bars
    group: trading
    type: int
    default: 252
    min: 60
    max: 1260
    label_en: Replay evolution lookback bars
    label_zh: 歷史回放回測評估天數
    help_en: Historical bar length used to partition In-Sample calibration and Out-of-Sample validation periods.
    help_zh: 歷史回放回測使用的 Bar 數長度，用於切分 In-Sample 訓練與 Out-of-Sample 驗證集（預設 252 交易日）。
  - key: replay_evolution_wfo_train_ratio
    group: trading
    type: float
    default: 0.70
    min: 0.50
    max: 0.90
    label_en: Walk-forward optimization train ratio
    label_zh: WFO 前向走查訓練集比例
    help_en: Proportion of historical bars allocated to In-Sample annealing calibration versus Out-of-Sample validation.
    help_zh: 歷史資料中分配給 In-Sample 模擬退火校準的資料比例（預設 70% 訓練、30% 驗證）。
  - key: replay_evolution_min_sharpe_improvement
    group: trading
    type: float
    default: 0.15
    min: 0.05
    max: 0.50
    label_en: Minimum Sharpe improvement for promotion
    label_zh: 因子矩陣晉級夏普最低提升門檻
    help_en: Minimum relative Out-of-Sample Sharpe improvement required to promote an evolved factor weight matrix.
    help_zh: 演化出的新因子權重矩陣在 Out-of-Sample 驗證中相較基準至少需達到的 Sharpe 提升幅度（預設 +15%）。
  - key: tactical_phase_factor_weights
    group: trading
    type: json
    default: null
    label_en: Evolved tactical phase factor weights matrix
    label_zh: 已演化儲存之多市場週期因子權重矩陣
    help_en: Calibrated factor weight assignments for 4 market phases produced by replay auto-evolution.
    help_zh: 經歷史回放回測與模擬退火演化所驗證通過之 4 大市場週期因子權重矩陣（JSON 結構）。
  - key: enable_factor_drift_guard
    group: trading
    type: bool
    default: true
    label_en: Enable factor drift & concept drift guard
    label_zh: 啟用因子特徵漂移與失效守衛
    help_en: Monitors rolling 30d Spearman Rank IC and Information Ratio across core factors to detect concept drift and factor inversion.
    help_zh: 滾動監控 6 大核心量化因子之 30 天 Spearman Rank IC 與資訊比率，即時偵測因子特徵漂移與失效。
  - key: enable_factor_auto_healing
    group: trading
    type: bool
    default: true
    label_en: Enable closed-loop factor auto-healing
    label_zh: 啟用閉環因子自癒重平衡
    help_en: Automatically curtails weights of inverted/decaying factors and reallocates freed weights to regime-appropriate defensive anchors.
    help_zh: 當因子發生顯著衰退或負向反轉時，自動施加阻尼抑制並將釋放出的權重動態重平衡至當前市場體制之防守因子。
  - key: factor_ic_decay_threshold
    group: trading
    type: float
    default: 0.00
    min: -0.15
    max: 0.05
    label_en: Factor IC drift decay threshold
    label_zh: 因子 IC 漂移衰退判定門檻
    help_en: Rolling Rank IC threshold below which a factor is classified as decaying/inverted and subject to auto-healing curtailment.
    help_zh: 因子滾動 Rank IC 低於此門檻時判定為特徵漂移失效，啟動自癒阻尼削弱（預設 0.00）。
  - key: factor_ic_lookback_days
    group: trading
    type: int
    default: 30
    min: 10
    max: 90
    label_en: Factor IC evaluation lookback window (days)
    label_zh: 因子 IC 評估回看天數
    help_en: Number of rolling calendar days used to calculate Rank IC and Information Ratio.
    help_zh: 用於計算因子 Rank IC 與 IC-IR 的滾動歷史回看天數（預設 30 天）。
  - key: factor_healing_defense_bias
    group: trading
    type: float
    default: 0.60
    min: 0.20
    max: 1.00
    label_en: Factor auto-healing defensive anchor bias
    label_zh: 因子自癒防守錨點偏向比率
    help_en: Proportion of curtailed weight allocated to low-volatility anchor vs quality anchor during defensive rebalancing.
    help_zh: 在防禦震盪與景氣末期體制下，自癒釋放權重分配給低波動防守因子的比率（預設 60%）。
  - key: enable_factor_genetic_evolution
    group: trading
    type: bool
    default: true
    label_en: Enable factor genetic hyper-evolution
    label_zh: 啟用多因子權重遺傳演算法超參數演化
    help_en: Autonomously optimize regime factor weights and hyper-parameters using genetic algorithm with Walk-Forward cross validation.
    help_zh: 啟用每週離線遺傳演算法 (GA)，以族群交叉突變與 Walk-Forward 走查最佳化 4 大體制多因子權重與超參數。
  - key: factor_ga_population_size
    group: trading
    type: int
    default: 20
    min: 10
    max: 100
    label_en: Factor GA population size
    label_zh: 因子遺傳演算法族群規模
    help_en: Number of candidate factor weight chromosomes per generation.
    help_zh: 因子權重遺傳演算法每代染色體個體數量（預設 20）。
  - key: factor_ga_generations
    group: trading
    type: int
    default: 20
    min: 5
    max: 100
    label_en: Factor GA generations
    label_zh: 因子遺傳演算法演化世代數
    help_en: Number of evolution generations to execute per GA run.
    help_zh: 因子權重遺傳演算法演化的總世代數（預設 20 代）。
  - key: factor_ga_mutation_rate
    group: trading
    type: float
    default: 0.20
    min: 0.05
    max: 0.80
    label_en: Factor GA mutation rate
    label_zh: 因子遺傳演算法變異機率
    help_en: Probability of Gaussian simplex perturbation mutation on chromosomes.
    help_zh: 因子染色體高斯擾動單體突變機率（預設 0.20）。
  - key: factor_ga_crossover_rate
    group: trading
    type: float
    default: 0.80
    min: 0.20
    max: 1.00
    label_en: Factor GA crossover rate
    label_zh: 因子遺傳演算法交叉機率
    help_en: Probability of regime block swap and convex blend crossover between parents.
    help_zh: 雙親體制區塊與凸幾何單體混血交叉重組機率（預設 0.80）。
  - key: factor_ga_auto_promote
    group: trading
    type: bool
    default: true
    label_en: Auto-promote evolved GA factor matrix
    label_zh: 因子遺傳演化通過晉級門檻自動生效
    help_en: Automatically apply verified best genetic factor weights to production settings when passing WFO and Shannon diversity gates.
    help_zh: 當遺傳演化最優染色體通過 WFO 效率、Sharpe 提升、回撤防守與香農多樣性門檻時，自動套用為生產環境權重。
  - key: enable_factor_orthogonalization
    group: trading
    type: bool
    default: true
    label_en: Enable cross-sectional factor orthogonalization
    label_zh: 啟用截面因子動態正交化
    help_en: Dynamically orthogonalize cross-sectional factor scores using Löwdin or Gram-Schmidt algorithms to eliminate multicollinearity.
    help_zh: 啟用格拉姆-施密特或低丁對稱正交化，消除 6 大因子間的多重共線性與隱性曝險集中。
  - key: factor_orthogonalization_method
    group: trading
    type: str
    default: lowdin
    label_en: Factor orthogonalization method
    label_zh: 因子正交化演算法
    help_en: Mathematical orthogonalization method to apply ('lowdin' for minimum deformation symmetric, 'gram_schmidt' for priority sequential).
    help_zh: 因子截面正交化方法：lowdin（對稱正交化，保留最大經濟意涵）或 gram_schmidt（基底優先級正交化）。
  - key: enable_factor_interaction_terms
    group: trading
    type: bool
    default: true
    label_en: Enable factor non-linear interaction terms
    label_zh: 啟用因子非線性特徵交互作用
    help_en: Evaluate and incorporate second-order cross-factor synergies (e.g. Momentum x Smart Money, Quality x Value).
    help_zh: 啟用動能主力協同、品質價值協同等非線性交互項，捕捉多因子加成效應。
  - key: factor_max_vif_threshold
    group: trading
    type: float
    default: 5.0
    min: 2.0
    max: 20.0
    label_en: Factor multicollinearity VIF alert threshold
    label_zh: 因子多重共線性 VIF 警報門檻
    help_en: Variance Inflation Factor threshold above which multicollinearity is flagged as severe.
    help_zh: 方差膨脹因子 (VIF) 超過此門檻時判定存在顯著共線性並發出警報（預設 5.0）。
  - key: enable_dynamic_risk_parity
    group: trading
    type: bool
    default: true
    label_en: Enable dynamic risk parity allocation
    label_zh: 啟用多資產動態風險平價配置
    help_en: Dynamically balance portfolio risk contributions using Cyclical Coordinate Descent and Extreme Tail CVaR optimization.
    help_zh: 啟用等風險貢獻 (ERC) 與極端尾部 CVaR 優化，確保各持倉對總風險貢獻均等並防範黑天鵝肥尾。
  - key: risk_parity_lookback_days
    group: trading
    type: int
    default: 60
    min: 20
    max: 252
    label_en: Risk parity lookback days
    label_zh: 風險平價協方差回看天數
    help_en: Number of trading days used to estimate asset return covariance and historical tail CVaR.
    help_zh: 計算資產報酬協方差矩陣與歷史尾部 CVaR 之回看交易日數（預設 60 天）。
  - key: risk_parity_cvar_confidence
    group: trading
    type: float
    default: 0.95
    min: 0.90
    max: 0.99
    label_en: Risk parity CVaR confidence level
    label_zh: 風險平價尾部 CVaR 信心水準
    help_en: Confidence level for historical Conditional Value-at-Risk calculation (e.g. 0.95 for 95% tail shortfall).
    help_zh: 歷史條件在險價值 (CVaR / Expected Shortfall) 之信心水準（預設 0.95）。
  - key: risk_parity_cvar_penalty_weight
    group: trading
    type: float
    default: 0.30
    min: 0.0
    max: 1.0
    label_en: Extreme tail CVaR shrinkage penalty weight
    label_zh: 極端尾部 CVaR 風險預算收縮權重
    help_en: Sensitivity multiplier for penalizing risk budgets of assets exhibiting severe left-tail crash risks.
    help_zh: 對具備左尾肥尾崩跌風險標的收縮風險預算之懲罰敏感度（預設 0.30）。
  - key: risk_parity_max_weight_cap
    group: trading
    type: float
    default: 0.35
    min: 0.15
    max: 0.50
    label_en: Risk parity single asset weight cap
    label_zh: 風險平價單一標的持倉上限
    help_en: Maximum portfolio weight cap permitted for any single asset under risk parity allocation.
    help_zh: 風險平價配置下任一單一標的之最大權重上限（預設 35%）。
  - key: enable_vpin_toxicity_guard
    group: trading
    type: bool
    default: true
    label_en: Enable VPIN & Kyle's Lambda Microstructure Guard
    label_zh: 啟用微觀結構訂單流毒性與知情交易者檢定守衛
    help_en: Guards against informed predatory order flow and adverse selection using Volume-Synchronized Probability of Toxicity (VPIN) and Kyle's Lambda price impact regression.
    help_zh: 使用成交量同步機率毒性 (VPIN) 與 Kyle's Lambda 價格衝擊模型，檢定知情交易者聚集並在前置阻斷滑點吃損。
  - key: vpin_bucket_size_adv_ratio
    group: trading
    type: float
    default: 0.02
    min: 0.005
    max: 0.10
    label_en: VPIN volume bucket size as ADV ratio
    label_zh: VPIN 成交量桶大小佔 ADV 比率
    help_en: Target share volume for each VPIN volume clock bucket as a fraction of Average Daily Volume (e.g. 0.02 for ~50 buckets/day).
    help_zh: 單一成交量時鐘桶之目標股數佔日均成交量 (ADV) 之比率（預設 0.02，約每日 50 桶）。
  - key: vpin_alert_threshold
    group: trading
    type: float
    default: 0.40
    min: 0.20
    max: 0.80
    label_en: VPIN toxic regime alert threshold
    label_zh: VPIN 重度毒性熔斷門檻
    help_en: VPIN threshold above which order flow is classified as TOXIC, triggering an execution halt to prevent adverse selection.
    help_zh: VPIN 超過此門檻時判定體制為 TOXIC，前置熔斷暫緩下單以防範逆向選擇吃損（預設 0.40）。
  - key: vpin_window_buckets
    group: trading
    type: int
    default: 50
    min: 10
    max: 100
    label_en: VPIN rolling window bucket count
    label_zh: VPIN 滾動計算時鐘桶數
    help_en: Number of completed volume buckets used to calculate rolling VPIN and Kyle's Lambda.
    help_zh: 滾動計算 VPIN 與 Kyle's Lambda 價格衝擊回歸之已完成成交量桶數量（預設 50 桶）。
  - key: vpin_execution_pace_minutes
    group: trading
    type: int
    default: 5
    min: 1
    max: 15
    label_en: VPIN toxic deferral cooling period (minutes)
    label_zh: VPIN 毒性熔斷暫緩冷卻時間（分鐘）
    help_en: Waiting buffer in minutes applied to order execution when severe toxic flow is detected.
    help_zh: 當標的遭遇重度毒性訂單流時，下單執行之建議暫緩冷卻等待分鐘數（預設 5 分鐘）。
  - key: enable_bayesian_jump_guard
    group: trading
    type: bool
    default: true
    label_en: Enable Bayesian Regime-Switching Jump-Diffusion Guard
    label_zh: 啟用多期動態貝葉斯更新與機制轉換跳躍擴散守衛
    help_en: Decomposes price volatility into continuous diffusion and discrete jumps using Merton Jump-Diffusion and Bipower Variation, performing conjugate Gamma-Poisson Bayesian updating to halt trading during acute jump regimes.
    help_zh: 運用 Merton 跳躍擴散與 Bipower 雙冪變異分離連續擴散波動與離散跳躍，並以 Gamma-Poisson 共軛貝葉斯更新跳躍頻率，於重度跳躍衝擊體制前置熔斷暫緩下單。
  - key: jump_intensity_alert_threshold
    group: trading
    type: float
    default: 6.0
    min: 2.0
    max: 20.0
    label_en: Bayesian jump intensity acute alert threshold (jumps/year)
    label_zh: 貝葉斯年化跳躍強度重度熔斷門檻（次/年）
    help_en: Annualized jump intensity λ_jump threshold above which asset enters ACUTE_JUMP_REGIME, triggering immediate trade deferral.
    help_zh: 年化跳躍強度 λ_jump 之警戒上限門檻（預設 6.0 次/年）；超過或伴隨下行跳躍衝擊時觸發 ACUTE_JUMP_REGIME 暫緩下單。
  - key: jump_detection_sigma_multiplier
    group: trading
    type: float
    default: 3.0
    min: 1.5
    max: 5.0
    label_en: Jump detection continuous volatility multiplier
    label_zh: 離散跳躍檢定之連續波動倍數門檻
    help_en: Multiplier θ applied to daily continuous volatility σ_cont to statistically identify discrete jump returns (|r_t| > θ * σ_cont).
    help_zh: 乘以日連續擴散波動率 σ_cont 之統計檢定倍數 θ（預設 3.0）；當日收益率絕對值超過該倍數時識別為離散跳躍事件。
  - key: jump_bipower_lookback_days
    group: trading
    type: int
    default: 60
    min: 20
    max: 252
    label_en: Bipower variation rolling lookback days
    label_zh: 雙冪變異與跳躍檢定滾動回看天數
    help_en: Historical trading days lookback window used to calculate realized variance and bipower variation.
    help_zh: 計算實現方差 (RV) 與連續雙冪方差 (BV) 之滾動歷史交易日天數（預設 60 天）。
  - key: jump_acute_position_scale
    group: trading
    type: float
    default: 0.50
    min: 0.20
    max: 1.00
    label_en: Acute jump regime position scale multiplier
    label_zh: 重度跳躍體制部位縮減係數
    help_en: Position sizing multiplier applied when an asset is in acute jump conditions to limit tail loss exposure.
    help_zh: 當標的遭遇極端跳躍風險但需防禦持有或調節時之部位規模縮減係數（預設 0.50）。
  - key: enable_rl_execution_sor
    group: trading
    type: bool
    default: true
    label_en: Enable RL Execution Smart Order Routing (SOR)
    label_zh: 啟用強化學習自適應動態訂單拆單與智慧路由
    help_en: Optimizes multi-step order execution using Tabular Q-Learning MDP to minimize market impact, spread friction, and inventory variance risk.
    help_zh: 運用強化學習馬爾可夫決策過程 (MDP) 求解動態最優清算軌道，最小化暫時市場衝擊、買賣價差摩擦與庫存方差風險。
  - key: rl_sor_learning_rate
    group: trading
    type: float
    default: 0.10
    min: 0.01
    max: 0.50
    label_en: RL SOR TD(0) learning rate (alpha)
    label_zh: 智慧路由強化學習 TD(0) 學習率 (α)
    help_en: Temporal Difference learning rate determining the adaptation speed of Q-table updates from realized execution fills.
    help_zh: 時間差分 TD(0) 學習率 α（預設 0.10），決定在線成交反饋對 Q-Table 價值函數的更新收斂步長。
  - key: rl_sor_discount_factor
    group: trading
    type: float
    default: 0.95
    min: 0.50
    max: 0.99
    label_en: RL SOR discount factor (gamma)
    label_zh: 智慧路由強化學習未來獎勵折扣因子 (γ)
    help_en: Discount factor for future execution rewards in the Bellman optimality equation.
    help_zh: 貝爾曼最優方程未來切片獎勵之折扣因子 γ（預設 0.95），權衡即期成交成本與跨期庫存風險。
  - key: rl_sor_exploration_rate
    group: trading
    type: float
    default: 0.05
    min: 0.0
    max: 0.50
    label_en: RL SOR epsilon-greedy exploration rate
    label_zh: 智慧路由 ε-greedy 隨機探索率
    help_en: Probability of taking random actions during execution to discover non-obvious routing advantages.
    help_zh: 實盤或模擬訓練時之隨機探索機率 ε（預設 0.05 即 5%），在利用已知最優與探索潛在優勢間取得平衡。
  - key: rl_sor_inventory_risk_aversion
    group: trading
    type: float
    default: 0.15
    min: 0.01
    max: 1.00
    label_en: RL SOR inventory risk aversion coefficient (phi)
    label_zh: 智慧路由庫存方差風險厭惡係數 (φ)
    help_en: Penalty coefficient applied to remaining inventory variance risk (phi * q^2 * sigma^2).
    help_zh: 懲罰持倉延遲暴露之庫存方差風險係數 φ（預設 0.15）；越高代表越傾向提早清空庫存避免價格不利波動。
  - key: enable_macro_event_causal_graph
    group: trading
    type: bool
    default: true
    label_en: Enable Macro Event Causal Graph & Narrative Risk Engine
    label_zh: 啟用宏觀突發事件即時輿情因果傳播與大腦避險代理
    help_en: Maintains a directed weighted causal network graph and models real-time narrative shock diffusion across macro sources, industry hubs, and asset targets.
    help_zh: 維護有向加權宏觀因果網絡圖譜，即時求解輿情突發事件在宏觀衝擊源、產業傳導樞紐與投資標的間之震盪擴散與淨受損度。
  - key: event_graph_decay_factor
    group: trading
    type: float
    default: 0.75
    min: 0.10
    max: 0.99
    label_en: Causal graph shock diffusion damping/decay factor (d)
    label_zh: 因果圖譜震盪擴散阻尼衰減係數 (d)
    help_en: Damping factor governing the network shock propagation intensity across causal hops (default 0.75).
    help_zh: 網絡拓撲震盪擴散之阻尼係數 d（預設 0.75），決定衝擊波跨節點傳導時的吸收衰減幅度。
  - key: event_graph_shock_alert_threshold
    group: trading
    type: float
    default: 0.40
    min: 0.10
    max: 1.00
    label_en: Event graph systemic shock alert threshold
    label_zh: 因果圖譜系統性衝擊通報門檻
    help_en: Systemic shock intensity threshold triggering urgent hedging warnings and batch deployment deferrals (default 0.40).
    help_zh: 觸發緊急避險預警與開盤建倉前置暫緩的系統性衝擊強度警戒門檻（預設 0.40）。
  - key: event_graph_half_life_hours
    group: trading
    type: float
    default: 24.0
    min: 1.0
    max: 168.0
    label_en: Macro event narrative shock half-life (hours)
    label_zh: 突發輿情衝擊指數半衰期 (小時)
    help_en: Time half-life in hours for active macro news events before their shock impact naturally decays (default 24h).
    help_zh: 突發新聞與輿情事件衝擊強度隨時間衰減的指數半衰期（預設 24 小時），模擬市場隨時間消化事件影響。
  - key: enable_event_graph_auto_trim
    group: trading
    type: bool
    default: true
    label_en: Enable causal shock priority trimming
    label_zh: 啟用因果圖譜重創標的優先減碼調節
    help_en: Prioritize trimming assets with severe causal network damage when raising defensive cash during macro stress events.
    help_zh: 當宏觀壓力升高需拉高防守現金時，依據因果受損度優先調節重創標的，防範單一板塊斷鏈風險。
  - key: enable_bayesian_hmm_factor_allocation
    group: trading
    type: bool
    default: true
    label_en: Enable Bayesian HMM continuous factor allocation
    label_zh: 啟用貝葉斯隱馬爾可夫連續因子配置
    help_en: Compute continuous posterior regime probabilities via Hamilton filter and blend multi-factor weights dynamically.
    help_zh: 透過在線漢密爾頓貝葉斯濾波計算 4 大體制連續後驗機率，連續平滑混合 6 大因子權重，消除離散階梯斷層。
  - key: bayesian_hmm_transition_stickiness
    group: trading
    type: float
    default: 0.94
    min: 0.70
    max: 0.99
    label_en: Bayesian HMM transition matrix diagonal stickiness
    label_zh: 貝葉斯隱馬爾可夫轉移矩陣對角持續性
    help_en: Diagonal persistence probability in the 4-state Markov transition matrix (default 0.94).
    help_zh: 隱馬爾可夫 4 狀態轉移矩陣對角線持續機率（預設 0.94），避免噪音造成頻繁體制偽切換。
  - key: bayesian_hmm_entropy_defense_threshold
    group: trading
    type: float
    default: 1.15
    min: 0.50
    max: 1.90
    label_en: Bayesian HMM Shannon entropy defense threshold
    label_zh: 貝葉斯隱馬爾可夫香農熵防禦門檻
    help_en: Entropy threshold above which regime ambiguity triggers defensive shift towards quality and low volatility.
    help_zh: 當後驗體制分佈之香農熵超過此門檻時，判定為體制轉換劇烈模糊期，啟動防守因子偏向保護。
  - key: enable_bayesian_hmm_entropy_guard
    group: trading
    type: bool
    default: true
    label_en: Enable Bayesian HMM entropy ambiguity guard
    label_zh: 啟用貝葉斯隱馬爾可夫香農熵模糊守衛
    help_en: Dynamically shifts factor allocations toward defensive anchors during regime transition ambiguity.
    help_zh: 在體制轉換模糊過渡期，動態將因子配置向低波動與高品質防守錨點傾斜，抑制順勢追高甩轎摩擦。
  - key: bayesian_hmm_observation_lookback
    group: trading
    type: int
    default: 30
    min: 10
    max: 90
    label_en: Bayesian HMM observation lookback days
    label_zh: 貝葉斯隱馬爾可夫觀測變數回看天數
    help_en: Lookback period for calculating VIX Z-score and trend metrics in market observations.
    help_zh: 計算 VIX Z-score、趨勢偏離度等觀測特徵之歷史滾動天數（預設 30 天）。
  - key: protection_lockout_reset_at
    group: trading
    type: string
    default: ""
    label_en: Lockout reset timestamp watermark
    label_zh: 風控連虧熔斷重設時間戳
    help_en: Watermark timestamp; decision outcomes resolved before this time are archived and ignored by consecutive loss lockout.
    help_zh: 熔斷重設浮水印時間戳；在此時間點前結算之決策視為已歸檔歷史，不再觸發連續虧損鎖定。
  - key: enable_unified_risk_gateway
    group: trading
    type: bool
    default: true
    label_en: Enable unified risk gateway
    label_zh: 啟用統一中央風控閘門
    help_en: Consolidates trading protections, calendar blackouts, VPIN toxicity, jump diffusion, and slippage guards into a unified pre-trade evaluation pipeline.
    help_zh: 將分散的交易保護、財報避開、微觀訂單流毒性、跳躍擴散突波與滑點守衛整合為統一前置風險閘門。
  - key: inference_cost_hurdle_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable inference cost-to-alpha hurdle gate
    label_zh: 啟用推理成本超額收益門檻閘門
    help_en: Bypasses multi-agent LLM debates on small orders and routine rebalances to prevent AI fees from eroding net fund alpha.
    help_zh: 在小額訂單與日常例行再平衡時自動分流至 0-LLM 數理引擎，避免昂貴的模型推理費用吞噬超額淨 Alpha。
  - key: small_order_bypass_threshold_usd
    group: trading
    type: float
    default: 250.0
    min: 50.0
    max: 2000.0
    label_en: Small order 0-LLM math engine threshold (USD)
    label_zh: 小額訂單 0-LLM 數理引擎分流門檻 (USD)
    help_en: Trade amount below which routine execution bypasses full LLM council and uses deterministic mathematical allocation.
    help_zh: 當交易金額小於此門檻時，日常執行直接採用確定性數理因子模型，杜絕無謂 Token 消耗。
  - key: enable_staggered_dip_buying
    group: trading
    type: bool
    default: true
    label_en: Enable smart staggered dip buying
    label_zh: 啟用主力支撐階梯限價吸籌
    help_en: Deploys intraday limit buy orders anchored to institutional support (AVWAP, POC, VAL) rather than aggressive market orders.
    help_zh: 依據機構主力籌碼成本線（AVWAP、POC、VAL）分 3 階梯掛設被動限價買單，避免開盤盲目追高。
  - key: staggered_tier1_allocation_pct
    group: trading
    type: float
    default: 0.40
    min: 0.10
    max: 0.80
    label_en: Staggered Tier 1 allocation ratio
    label_zh: 階梯限價首檔配置比例
    help_en: Fraction of target budget allocated to Tier 1 mild pullback (anchored to AVWAP/POC).
    help_zh: 首檔輕度回踩限價單之資金配置比例（預設 40%）。
  - key: staggered_tier2_allocation_pct
    group: trading
    type: float
    default: 0.35
    min: 0.10
    max: 0.80
    label_en: Staggered Tier 2 allocation ratio
    label_zh: 階梯限價第二檔配置比例
    help_en: Fraction of target budget allocated to Tier 2 structural support (anchored to VAL/Key Support).
    help_zh: 第二檔結構支撐限價單之資金配置比例（預設 35%）。
  - key: staggered_tier3_allocation_pct
    group: trading
    type: float
    default: 0.25
    min: 0.10
    max: 0.80
    label_en: Staggered Tier 3 allocation ratio
    label_zh: 階梯限價第三檔配置比例
    help_en: Fraction of target budget allocated to Tier 3 deep flush / stop-hunt discount.
    help_zh: 第三檔恐慌甩轎深度折價限價單之資金配置比例（預設 25%）。
  - key: staggered_tier1_dip_pct
    group: trading
    type: float
    default: 0.008
    min: 0.002
    max: 0.05
    label_en: Staggered Tier 1 dip discount ratio
    label_zh: 階梯限價首檔預設折價幅度
    help_en: Default price discount for Tier 1 if institutional anchor exceeds current price (0.008 = -0.8%).
    help_zh: 首檔限價單相對於當前市價之預設折價幅度（0.008 代表 -0.8%）。
  - key: staggered_tier2_dip_pct
    group: trading
    type: float
    default: 0.020
    min: 0.005
    max: 0.10
    label_en: Staggered Tier 2 dip discount ratio
    label_zh: 階梯限價第二檔預設折價幅度
    help_en: Default price discount for Tier 2 structural support (0.020 = -2.0%).
    help_zh: 第二檔限價單相對於當前市價之預設折價幅度（0.020 代表 -2.0%）。
  - key: staggered_tier3_dip_pct
    group: trading
    type: float
    default: 0.038
    min: 0.010
    max: 0.15
    label_en: Staggered Tier 3 dip discount ratio
    label_zh: 階梯限價第三檔預設折價幅度
    help_en: Default price discount for Tier 3 deep panic flush (0.038 = -3.8%).
    help_zh: 第三檔限價單相對於當前市價之預設折價幅度（0.038 代表 -3.8%）。
  - key: staggered_auto_cancel_at_market_close
    group: trading
    type: bool
    default: true
    label_en: Auto-cancel pending staggered orders at market close
    label_zh: 收盤前自動撤銷未成交階梯掛單
    help_en: Automatically sweeps and cancels all pending limit dip buy orders at 15:55 EST to release cash and prevent overnight risk.
    help_zh: 美股收盤前（15:55 EST）自動撤除未成交掛單並釋放保留現金，杜絕留單過夜與隔日跳空風險。
  - key: enable_universe_momentum_pruning
    group: allocation
    type: bool
    default: true
    label_en: Enable adaptive universe momentum pruning
    label_zh: 啟用標的池自適應動能剪枝
    help_en: Prunes stagnant candidates that fail to outperform SPY benchmark over 14 days and cleans stale shadow positions.
    help_zh: 自動修剪在候選池停留超過 14 天且動能衰竭、落後 SPY 大盤之標的，並清理過期影子持倉。
  - key: universe_candidate_max_stagnation_days
    group: allocation
    type: int
    default: 14
    min: 3
    max: 60
    label_en: Max candidate stagnation days before pruning
    label_zh: 候選標的動能停滯容忍上限天數
    help_en: Maximum days a candidate can remain without outperforming benchmark before being pruned to cold storage.
    help_zh: 候選標的在未展現超越大盤 Alpha 前於候選池保留之最長天數（預設 14 天）。
  - key: universe_candidate_relative_strength_cutoff
    group: allocation
    type: float
    default: -0.025
    min: -0.20
    max: 0.05
    label_en: Candidate relative strength cutoff vs SPY
    label_zh: 候選標的相對 SPY 強弱門檻
    help_en: 14-day cumulative return delta vs SPY below which a candidate is deemed stagnant (-0.025 = -2.5%).
    help_zh: 候選標的 14 天相對於 SPY 報酬率差值低於此值時觸發動能淘汰（預設 -2.5%）。
  - key: universe_max_contenders_per_sector
    group: allocation
    type: int
    default: 3
    min: 1
    max: 10
    label_en: Max candidate contenders per sector
    label_zh: 單一產業板塊候選股上限
    help_en: Maximum contenders allowed per sector in the active candidate pool to prevent sector crowding.
    help_zh: 活躍候選池中同一板塊最多容納的候選標的檔數（預設 3 檔，防止板塊過度擁擠）。
  - key: breakout_filter_fail_open
    group: trading
    type: bool
    default: true
    label_en: Breakout filter fail-open on missing data
    label_zh: 缺少歷史量價數據時寬鬆放行
    help_en: Allow trading signals to pass if historical OHLCV data is insufficient for breakout verification.
    help_zh: 當歷史 OHLCV 數據不足無法評估量價時，預設寬鬆放行（Fail-Open）。
  - key: strategy_evolution_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable strategy discovery & evolution
    label_zh: 啟用策略自學演化循環
    help_en: Allow background discovery and evolution cycles to test, optimize, and promote trading strategy contracts.
    help_zh: 允許背景排程定期進行全歷史回測、參數優化與策略晉級演化循環。
  - key: capital_rotation_enabled
    group: trading
    type: bool
    default: true
    danger: true
    label_en: Opportunity cost capital rotation
    label_zh: 機會成本換庫
    help_en: >-
      When better investment opportunities are scouted and cash is limited, automatically
      rotate capital out of the lowest-conviction holding into the superior candidate.
    help_zh: 當市場或自選清單出現評分顯著更高的新機會且資金有限時，自動賣出/減碼評分最低的現有持倉進行換庫。
  - key: rotation_min_score_delta
    group: trading
    type: float
    default: 2.0
    min: 0.5
    max: 5.0
    label_en: Min score advantage for rotation
    label_zh: 換庫最低評分優勢
    help_en: Minimum score gap (e.g. 2.0 points) required between a new candidate and an existing holding to trigger rotation.
    help_zh: 新標的評分必須高於現有持倉至少此數值（例如 8.5 vs 6.0，差 2.5 分）才執行換庫，避免頻繁摩擦成本。
  - key: rebalance_risk_diversification_enabled
    group: trading
    type: bool
    default: true
    label_en: Rebalancing for risk diversification
    label_zh: 集中度與風險再平衡
    help_en: Automatically trim positions that exceed max_single_position_weight to diversify portfolio risk.
    help_zh: 當單一持倉超出最大持倉權重（max_single_position_weight）時，自動減碼超額部位以分散投資組合風險。
  - key: protect_winning_compounders
    group: trading
    type: bool
    default: true
    label_en: Protect winning compounders
    label_zh: 中長期結構性贏家保護
    help_en: Protect verified long-term structural compounders from premature trimming during routine rebalances, trimming only excess profits for opportunity costs while preserving core holdings.
    help_zh: 保護經深研確認之中長期結構性贏家（股價穩居生命線、基本面卓越且動能強勁），避免在例行再平衡中被機械式減碼；若有更佳機會僅調節超額浮盈，堅定保留核心底倉。
  - key: autonomous_exit_enabled
    group: trading
    type: bool
    default: true
    danger: true
    label_en: Autonomous position exits
    label_zh: 自動執行部位出場與換庫
    help_en: Automatically execute capital rotation, rebalancing, and thesis exits without manual approval.
    help_zh: 自動執行機會成本換庫、風險再平衡與論點破壞出場，無需等待手動確認，減少人為介入。
  - key: autonomous_reporting_mode
    group: trading
    type: bool
    default: true
    label_en: Autonomous Zero-Interruption Execution Mode
    label_zh: 全自主無人值守運作模式（從要我決策變成跟我報告）
    help_en: Transition from asking human to decide to reporting execution results. Suppresses interactive approval requests, auto-executes pre-authorized signals, and autonomously skips/logs unqualified trades without human interruption.
    help_zh: 徹底切換為「從要我決策，變成跟我報告」之無人值守全自動運作模式。消滅 Telegram/LINE 之交互審批阻塞，符合標準自動執行並通報，不符標準則自主略過，不要求用戶手動介入。
  - key: auto_trade_min_threshold
    group: trading
    type: int
    default: 30
    min: 0
    max: 100
    label_en: Minimum actionable confidence
    label_zh: 最低可行動信心
  - key: ai_max_daily_trades
    group: trading
    type: int
    default: 3
    min: 0
    max: 100
    danger: true
    label_en: Max trades per day
    label_zh: 每日最大交易次數
  - key: tradable_capital_usd
    group: trading
    type: float
    default: 100.0
    min: 0
    danger: true
    label_en: Tradable capital (USD)
    label_zh: 可交易資本（USD）
    help_en: Hard cap on capital the autonomous path may deploy.
  - key: monthly_data_subscription_cost_usd
    group: trading
    type: float
    default: 0.0
    min: 0.0
    label_en: Monthly Data Subscription Cost (USD)
    label_zh: 每月數據源訂閱費用（USD）
    help_en: Fixed monthly cost paid to external data providers (e.g. Polygon, FMP). Amortized daily into True Net PnL.
    help_zh: 每月支付給外部數據商（如 Polygon, FMP）之固定訂閱費；將每日攤提以核算真實淨利。
  - key: min_trade_amount
    group: trading
    type: float
    default: 50.0
    min: 0
    label_en: Minimum order size (USD)
    label_zh: 最小下單金額（USD）
  - key: risk_profile
    group: trading
    type: enum
    enum: [Conservative, Balanced, Moderate, Aggressive]
    default: Balanced
    label_en: Risk profile
    label_zh: 風險偏好
  # Circuit breakers. risk_manager.py read these with its own hardcoded
  # fallbacks (max_daily=3, holding_days=21, loss_pct=0.15, streak=3, and a
  # different 5/3/30/0.20 set on its error path) — two defaults for the same
  # knob depending on which branch ran.
  # 斷路器：risk_manager 原本自帶兩組不同的 fallback，視走哪個分支而定。
  - key: cb_loss_streak
    group: trading
    type: int
    default: 3
    min: 1
    max: 20
    danger: true
    label_en: Circuit breaker — consecutive losses
    label_zh: 斷路器：連續虧損次數
  - key: cb_loss_pct
    group: trading
    type: float
    default: 0.15
    min: 0.0
    max: 1.0
    danger: true
    label_en: Circuit breaker — drawdown fraction
    label_zh: 斷路器：回撤比例
  - key: cb_holding_days
    group: trading
    type: int
    default: 21
    min: 1
    max: 365
    label_en: Circuit breaker — max holding days
    label_zh: 斷路器：最長持有天數
  - key: max_pending_approvals
    group: trading
    type: int
    default: 5
    min: 1
    max: 100
    label_en: Max pending approvals
    label_zh: 最多待審核數
  - key: sor_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable smart order routing (SOR) & slicing
    label_zh: 啟用智能訂單路由與分批執行
    help_en: Dynamically slice large parent orders into TWAP/VWAP child orders with liquidity constraints to prevent market impact and slippage.
    help_zh: 啟用智能訂單路由，將大額委託依流動性切分為 TWAP 或 VWAP 子訂單分批執行，防範滑價與市場衝擊。
  - key: sor_adv_max_pct
    group: trading
    type: float
    default: 0.015
    min: 0.001
    max: 0.050
    label_en: Maximum executable volume ratio of 20d ADV
    label_zh: 20日日均成交量最大執行比例上限
    help_en: Maximum fraction of a ticker's 20-day average daily volume executable in a single session; excess shares are held in a rollover queue.
    help_zh: 單日調倉佔該標的 20 日日均成交量 (ADV20) 之最大執行上限（預設 0.015 即 1.5%），超額部分轉入待執行隊列。
  - key: sor_max_slippage_bps
    group: trading
    type: float
    default: 35.0
    min: 5.0
    max: 150.0
    danger: true
    label_en: Smart order execution max slippage (bps)
    label_zh: 智能訂單執行最大容許滑價 (bps)
    help_en: Maximum allowable execution slippage in basis points relative to arrival price before triggering an immediate execution circuit breaker.
    help_zh: 子訂單相對於抵達價格之最大容許滑價門檻（預設 35 bps）；若成交滑價超過此限制立即觸發熔斷並撤銷剩餘委託。
  - key: sor_default_execution_window_minutes
    group: trading
    type: int
    default: 30
    min: 5
    max: 240
    label_en: Default order slicing execution window (minutes)
    label_zh: 預設分批訂單執行時間窗口（分鐘）
    help_en: Target duration over which child slices are scheduled during TWAP or VWAP algorithmic execution.
    help_zh: TWAP 或 VWAP 演算法執行分批子訂單之預設時間跨度窗口（預設 30 分鐘）。
  - key: sor_twap_jitter_pct
    group: trading
    type: float
    default: 0.15
    min: 0.0
    max: 0.40
    label_en: TWAP time interval and size randomization jitter
    label_zh: TWAP 時間間隔與子單規模隨機微擾比例
    help_en: Percentage randomization applied to slice intervals and quantities to disguise order footprints from HFT algorithms.
    help_zh: 施加於 TWAP 子單時間間隔與數量之均勻隨機微擾比例（預設 0.15 即 15%），避免被高頻做市商算法模式識別與掠奪。
  - key: execution_feedback_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable order execution feedback & slippage analytics
    label_zh: 啟用訂單執行監控與成交回報反饋
    help_en: Records fill executions, analyzes Perold implementation shortfall, and evaluates venue execution quality.
    help_zh: 記錄訂單真實成交回報，執行 Perold 實施缺口歸因分解，並監控交易場所與經紀商之執行品質。
  - key: execution_slippage_alert_threshold_bps
    group: trading
    type: float
    default: 25.0
    min: 5.0
    max: 100.0
    label_en: Adverse selection slippage alert threshold (bps)
    label_zh: 逆向選擇滑價警報門檻 (bps)
    help_en: Slippage threshold in basis points above which trade fills are flagged for potential adverse selection or front-running.
    help_zh: 單筆成交相對於抵達價格之滑價警報門檻（預設 25 bps）；超標時標記潛在逆向選擇或毒性訂單流異常。
  - key: almgren_chriss_eta_default
    group: trading
    type: float
    default: 0.15
    min: 0.01
    max: 1.00
    label_en: Almgren-Chriss default market impact coefficient (eta)
    label_zh: Almgren-Chriss 預設市場衝擊係數 (eta)
    help_en: Baseline temporary market impact coefficient η used in the square-root execution model prior to empirical calibration.
    help_zh: Almgren-Chriss 平方根市場衝擊模型之基準暫時衝擊係數 η（預設 0.15）；將依歷史成交記錄動態校準。
  - key: execution_dynamic_eta_calibration
    group: trading
    type: bool
    default: true
    label_en: Enable dynamic EWMA market impact calibration
    label_zh: 啟用動態 EWMA 市場衝擊係數校準
    help_en: Dynamically recalibrates asset-level market impact coefficient η using empirical fill executions and EWMA filtering.
    help_zh: 依據真實成交樣本與指數加權移動平均 (EWMA)，在線動態校準各資產之市場衝擊參數 η 並閉環反饋至拆單引擎。
  - key: slippage_compensator_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable adaptive slippage compensator (P6)
    label_zh: 啟用自適應訂單執行滑價補償器 (P6)
    help_en: Dynamically monitors realized vs expected slippage deviations, modulates SOR slicing parameters, and injects empirical friction into opportunity cost evaluation.
    help_zh: 動態追蹤實際成交滑價與模型預期偏差，自適應微調 SOR 拆單切片與時窗，並將真實摩擦成本注入換庫機會成本門檻。
  - key: slippage_ewma_alpha
    group: trading
    type: float
    default: 0.20
    min: 0.01
    max: 0.50
    label_en: Slippage multiplier EWMA smoothing factor (alpha)
    label_zh: 滑價補償乘數 EWMA 平滑係數 (alpha)
    help_en: Exponential smoothing weight applied to newly observed slippage deviation ratios.
    help_zh: 應用於最新成交滑價偏離比率之指數平滑權重係數（預設 0.20）。
  - key: slippage_min_multiplier
    group: trading
    type: float
    default: 0.50
    min: 0.10
    max: 1.00
    label_en: Minimum slippage compensation multiplier
    label_zh: 滑價補償乘數下限
    help_en: Floor for the adaptive slippage compensation multiplier in highly liquid regimes.
    help_zh: 高流動性良好成交環境下滑價補償乘數之保護下限（預設 0.50）。
  - key: slippage_max_multiplier
    group: trading
    type: float
    default: 3.00
    min: 1.50
    max: 5.00
    label_en: Maximum slippage compensation multiplier
    label_zh: 滑價補償乘數上限
    help_en: Ceiling for the adaptive slippage compensation multiplier during illiquid or high-friction conditions.
    help_zh: 流動性枯竭或高滑價磨擦衝擊時滑價補償乘數之保護上限（預設 3.00）。
  - key: slippage_adverse_penalty_bps
    group: trading
    type: float
    default: 5.0
    min: 0.0
    max: 50.0
    label_en: Adverse selection safety penalty buffer (bps)
    label_zh: 逆向選擇安全懲罰緩衝 (bps)
    help_en: Additional safety buffer in basis points added to expected slippage when recent fills exhibit toxic order flow.
    help_zh: 當近期成交出現逆向選擇或毒性訂單流異常時額外附加的安全防護緩衝（預設 5.0 bps）。
  - key: slippage_baseline_bps
    group: trading
    type: float
    default: 10.0
    min: 1.0
    max: 50.0
    label_en: Baseline fallback execution slippage (bps)
    label_zh: 基準備援執行滑價 (bps)
    help_en: Fallback baseline slippage used for cold-start assets before empirical execution history exists.
    help_zh: 尚無真實成交樣本之冷啟動標的所使用之基準執行滑價（預設 10.0 bps）。
  - key: circuit_breaker_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable intraday liquidity circuit breaker (P7)
    label_zh: 啟用盤中流動性衝擊與自適應緊急熔斷器 (P7)
    help_en: Real-time intraday liquidity and flash-crash monitoring engine that detects spread expansion, price gaps, and volatility surges, halting order execution and alerting via P3 Actionable Hub.
    help_zh: 盤中即時流動性枯竭與閃崩防禦引擎，即時監控買賣點差擴張、價格瞬時跳空與波動率突增，及時熔斷訂單執行並連動 P3 行動推播中心。
  - key: circuit_breaker_spread_multiplier_threshold
    group: trading
    type: float
    default: 3.0
    min: 1.5
    max: 10.0
    label_en: Circuit breaker spread expansion multiplier threshold
    label_zh: 流動性熔斷點差擴張倍數門檻
    help_en: Ratio of current bid-ask spread to baseline spread that triggers a liquidity shock circuit breaker.
    help_zh: 當前買賣點差相對於基底點差之擴張倍數門檻（預設 3.0 倍）；超過即觸發流動性熔斷。
  - key: circuit_breaker_spread_absolute_bps_threshold
    group: trading
    type: float
    default: 50.0
    min: 10.0
    max: 200.0
    label_en: Circuit breaker absolute spread threshold (bps)
    label_zh: 流動性熔斷絕對點差門檻 (bps)
    help_en: Minimum absolute spread in basis points required along with the spread multiplier to trigger a liquidity shock halt.
    help_zh: 配合點差倍數觸發熔斷之絕對點差下限門檻（預設 50 bps），避免低點差標的輕微跳動誤觸。
  - key: circuit_breaker_price_gap_pct
    group: trading
    type: float
    default: 3.5
    min: 1.0
    max: 10.0
    label_en: Circuit breaker price gap shock threshold (%)
    label_zh: 瞬時價格跳空閃崩熔斷門檻 (%)
    help_en: Absolute percentage change between current price and baseline price that triggers an immediate price gap shock circuit breaker.
    help_zh: 最新報價相對於基準價之瞬時價格跳空百分比門檻（預設 3.5%）；超過即觸發閃崩熔斷。
  - key: circuit_breaker_vol_spike_sigma
    group: trading
    type: float
    default: 3.0
    min: 1.5
    max: 5.0
    label_en: Circuit breaker volatility surge threshold (sigma)
    label_zh: 波動率劇增熔斷門檻 (sigma)
    help_en: Normalized volatility standard deviation multiple above historical baseline that triggers a volatility surge halt.
    help_zh: 當前瞬時波動率相對於歷史基線之標準差倍數門檻（預設 3.0 sigma）；超標即觸發波動劇增熔斷。
  - key: circuit_breaker_cooldown_minutes
    group: trading
    type: int
    default: 15
    min: 1
    max: 120
    label_en: Circuit breaker cooldown period (minutes)
    label_zh: 熔斷冷卻恢復期（分鐘）
    help_en: Default cooldown period in minutes after a circuit breaker trigger before execution automatically returns to normal status.
    help_zh: 熔斷觸發後自動轉入冷卻觀察期之持續時間（預設 15 分鐘）；期滿無新衝擊則平穩回歸正常。
  - key: volatility_spillover_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable cross-asset volatility spillover contagion shielder (M7)
    label_zh: 啟用跨資產波動率傳染矩陣與防禦防護器 (M7)
    help_en: Dynamically propagates liquidity shocks from halted leader tickers to correlated cluster peers and industry basket holdings, elevating execution slippage multipliers and expanding cash reserves.
    help_zh: 當龍頭標的觸發流動性熔斷時，自動依據 60 日相關性與產業族群權重傳播波動率溢出懲罰，調升同群標的滑價補償乘數並動態擴增防禦現金。
  - key: volatility_spillover_threshold
    group: trading
    type: float
    default: 0.40
    min: 0.10
    max: 0.90
    label_en: Volatility spillover contagion trigger threshold
    label_zh: 波動率傳染衝擊觸發門檻
    help_en: Minimum composite contagion intensity required to apply spillover protections to peer tickers.
    help_zh: 判定同群關聯標的啟動波及防護之綜合傳染強度下限門檻（預設 0.40）。
  - key: volatility_spillover_max_slippage_elevation
    group: trading
    type: float
    default: 2.50
    min: 1.20
    max: 5.00
    label_en: Maximum spillover slippage multiplier elevation
    label_zh: 傳染波及最大滑價乘數調升上限
    help_en: Upper bound for the elevated slippage multiplier applied to correlated peer assets during contagion waves.
    help_zh: 遭遇波動率傳染波及之同群關聯標的所能被調升之最大滑價補償乘數上限（預設 2.50 倍）。
  - key: volatility_spillover_max_cash_expansion_pct
    group: trading
    type: float
    default: 0.15
    min: 0.02
    max: 0.35
    label_en: Maximum contagion defensive cash expansion ratio
    label_zh: 傳染波及最大防禦現金擴增上限
    help_en: Maximum additional cash reserve percentage injected into the portfolio during peak cross-asset contagion shocks.
    help_zh: 遭遇系統性或跨資產波動率傳染時，投組額外強制拉升之防禦現金儲備上限（預設 0.15 即 +15%）。
  - key: volatility_spillover_half_life_minutes
    group: trading
    type: float
    default: 30.0
    min: 5.0
    max: 180.0
    label_en: Volatility spillover exponential decay half-life (minutes)
    label_zh: 波動率傳染指數衰減半衰期（分鐘）
    help_en: Half-life in minutes for exponential decay of contagion spillover intensity after shock inception.
    help_zh: 傳染衝擊自觸發起之指數衰減半衰期（預設 30 分鐘）；期滿影響強度減半，平穩回歸常態。
  - key: macro_surprise_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable Macro Surprise Index & Liquidity Beta Dampener (M8)
    label_zh: 啟用動態宏觀經濟驚奇指數與流動性傳導乘數 (M8)
    help_en: Monitors macroeconomic data releases against consensus expectations to dynamically dampen portfolio target beta and expand defensive cash buffers.
    help_zh: 監控 FRED 宏觀經濟數據相對於市場預期之標準化驚奇差 (Z-Score)，在遭遇緊縮或衰退衝擊時動態阻尼投組目標 Beta 並擴增防禦現金。
  - key: macro_surprise_shock_threshold
    group: trading
    type: float
    default: 1.50
    min: 0.50
    max: 3.00
    label_en: Macro surprise shock trigger threshold
    label_zh: 宏觀驚奇衝擊觸發門檻 (Z-score)
    help_en: Standardized Macro Surprise Index (MSI) absolute threshold beyond which hawkish or recessionary shocks are triggered.
    help_zh: 標準化宏觀驚奇指數 (MSI) 絕對值門檻（預設 1.50）；超過此值即觸發緊縮鷹派衝擊或衰退衝擊狀態機。
  - key: macro_surprise_min_beta_multiplier
    group: trading
    type: float
    default: 0.50
    min: 0.20
    max: 0.90
    label_en: Minimum liquidity beta dampener multiplier
    label_zh: 流動性 Beta 阻尼最小乘數下限
    help_en: Lower bound on portfolio target beta multiplier during severe macroeconomic shock waves.
    help_zh: 遭遇嚴重宏觀衝擊時，投組目標 Beta 允許被阻尼壓縮之最小乘數下限（預設 0.50 倍）。
  - key: macro_surprise_max_cash_adjustment
    group: trading
    type: float
    default: 0.15
    min: 0.02
    max: 0.30
    label_en: Maximum macro surprise defensive cash adjustment
    label_zh: 宏觀驚奇最大防禦現金擴增比例
    help_en: Maximum additional cash reserve percentage injected into the portfolio during peak macro shocks.
    help_zh: 遭遇極端宏觀驚奇衝擊時，系統強制額外擴增之最大防禦現金比率（預設 0.15 即 +15%）。
  - key: toxicity_detector_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable order book toxicity & VPIN detector (E3)
    label_zh: 啟用訂單簿深度失衡與毒性流偵測器 (E3)
    help_en: Detects informed trading flow and adverse selection via VPIN volume clock and queue depth imbalance before spreads widen.
    help_zh: 透過 VPIN 交易量時鐘與盤口掛單深度失衡 (OBI)，在點差顯著擴大前提前捕捉知情交易者毒性訂單流。
  - key: vpin_bucket_size
    group: trading
    type: float
    default: 1000.0
    min: 100.0
    max: 50000.0
    label_en: VPIN volume bucket capacity (shares)
    label_zh: VPIN 交易量時鐘單桶容量（股）
    help_en: Discrete trade volume slice required to complete a single VPIN volume clock observation bucket.
    help_zh: 完成單個 VPIN 觀察桶所需累積之離散成交股數容量（預設 1,000 股）。
  - key: vpin_window_buckets
    group: trading
    type: int
    default: 20
    min: 5
    max: 100
    label_en: VPIN rolling evaluation window (buckets)
    label_zh: VPIN 滾動評估視窗桶數
    help_en: Number of recent completed volume buckets used to calculate the rolling probability of informed trading toxicity.
    help_zh: 用於計算滾動知情交易毒性機率之最新已完成交易量桶數量（預設 20 桶）。
  - key: vpin_elevated_threshold
    group: trading
    type: float
    default: 0.50
    min: 0.20
    max: 0.80
    label_en: VPIN elevated toxicity alert threshold
    label_zh: VPIN 中度毒性預警門檻
    help_en: VPIN threshold above which order routing throttles execution intervals and boosts slippage compensation.
    help_zh: 觸發微觀執行降速與調升滑價補償保護之 VPIN 毒性門檻（預設 0.50）。
  - key: vpin_critical_threshold
    group: trading
    type: float
    default: 0.75
    min: 0.50
    max: 0.95
    label_en: VPIN critical toxicity flash-crash threshold
    label_zh: VPIN 重度毒性閃崩防禦門檻
    help_en: Critical VPIN threshold triggering immediate aggressive flow halting to prevent adverse selection execution.
    help_zh: 判定市場存在極端掠奪性毒性流之 VPIN 門檻（預設 0.75）；超標時即刻阻斷市價主動吃單。
  - key: obi_extreme_threshold
    group: trading
    type: float
    default: 0.60
    min: 0.20
    max: 0.95
    label_en: Order Book Imbalance extreme skew threshold
    label_zh: 訂單簿深度失衡極端偏斜門檻
    help_en: Absolute normalized queue depth imbalance |OBI| above which order book skew is flagged as high risk.
    help_zh: 盤口佇列買賣深度失衡度絕對值門檻（預設 0.60）；超標代表盤口掛單單邊極端失衡。
  - key: toxicity_slippage_boost_max
    group: trading
    type: float
    default: 1.00
    min: 0.10
    max: 3.00
    label_en: Maximum slippage boost for toxic flow
    label_zh: 毒性訂單流最大額外滑價倍數加成
    help_en: Maximum additional multiplier added to the adaptive slippage compensator when critical toxicity is detected.
    help_zh: 偵測到重度毒性訂單流時，額外疊加至 P6 自適應滑價補償器之最大乘數加成（預設 +1.00x）。
  - key: liquidity_hunt_guard_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable liquidity hole & stop-hunt guard (E4)
    label_zh: 啟用微結構流動性空洞與假突破獵殺防線
    help_en: Dynamically monitors order book depth depletion and predatory algorithmic liquidity sweeps to prevent adverse selection and bull/bear trap slippage.
    help_zh: 即時監控盤口深度枯竭空洞與做市商獵殺停損之假突破掃蕩，自動延遲或轉為被動限價單，防止逆向選擇與追高殺跌滑價。
  - key: liquidity_hole_depth_depletion_threshold
    group: trading
    type: float
    default: 0.70
    min: 0.30
    max: 0.95
    label_en: Liquidity hole depth depletion threshold
    label_zh: 流動性空洞深度枯竭門檻
    help_en: Normalized drop in aggregate top-of-book depth relative to rolling baseline that triggers a liquidity hole alert.
    help_zh: 盤口即時買賣深度相對滾動基準的驟降比例門檻（預設 0.70，即深度蒸發 70% 觸發警報）。
  - key: liquidity_hole_spread_expansion_threshold
    group: trading
    type: float
    default: 2.0
    min: 1.2
    max: 10.0
    label_en: Liquidity hole spread expansion multiplier
    label_zh: 流動性空洞點差膨脹倍數門檻
    help_en: Ratio of current bid-ask spread to baseline spread required in conjunction with depth depletion to confirm a liquidity vacuum.
    help_zh: 當前買賣點差相對基準點差之膨脹倍數門檻（預設 2.0x，與深度枯竭同時滿足時確認流動性真空）。
  - key: stop_hunt_score_threshold
    group: trading
    type: float
    default: 0.65
    min: 0.30
    max: 0.95
    label_en: Stop-hunt composite score threshold
    label_zh: 假突破掃蕩獵殺評分警報門檻
    help_en: Composite threshold combining level penetration, rapid mean-reversion retracement, and volume spike to flag a predatory trap.
    help_zh: 結合穿透度、迅速均值回歸回吐比與爆量倍數之綜合獵殺評分門檻（預設 0.65，超過則判定為誘多/誘空獵殺）。
  - key: hunt_guard_cooldown_seconds
    group: trading
    type: int
    default: 60
    min: 10
    max: 600
    label_en: Microstructure guard defense cooldown (seconds)
    label_zh: 獵殺防線防禦冷卻秒數
    help_en: Defensive cooling-off window in seconds during which aggressive orders are delayed or routed with passive limit pegs.
    help_zh: 觸發獵殺防線警報後的防禦冷卻時間（秒，預設 60 秒），此期間強制作息冷卻並預留額外滑價緩衝。
  - key: evolution_annealing_enabled
    group: trading
    type: bool
    default: true
    label_en: Enable strategy auto-evolution & grid annealing
    label_zh: 啟用策略自動演化與網格退火
    help_en: Optimizes portfolio hyperparameters via Simulated Annealing or Grid Search with Walk-Forward cross-validation.
    help_zh: 透過模擬退火法或網格搜尋自動演化最佳超參數，並透過滾動前向交叉驗證 (WFO) 防範過擬合。
  - key: evolution_search_method
    group: trading
    type: enum
    enum: [simulated_annealing, grid, random]
    default: simulated_annealing
    label_en: Evolution search method
    label_zh: 演化搜尋演算法
    help_en: Algorithm used for parameter exploration (Simulated Annealing, Grid Search, or Random Search).
    help_zh: 超參數空間搜尋演算法（模擬退火法 Simulated Annealing、網格搜尋 Grid Search 或隨機搜尋 Random Search）。
  - key: evolution_wfo_min_efficiency
    group: trading
    type: float
    default: 0.55
    min: 0.30
    max: 0.90
    label_en: Walk-forward optimization minimum efficiency ratio
    label_zh: 滾動前向驗證 (WFO) 最低效率比率門檻
    help_en: Minimum acceptable ratio of Out-of-Sample Sharpe to In-Sample Sharpe to guard against curve-fitting.
    help_zh: 樣本外 (OOS) Sharpe 與樣本內 (IS) Sharpe 之最低效率比率門檻（預設 0.55），低於此值視為過擬合拒絕晉升。
  - key: evolution_annealing_initial_temp
    group: trading
    type: float
    default: 100.0
    min: 10.0
    max: 500.0
    label_en: Simulated annealing initial temperature (T0)
    label_zh: 模擬退火初始溫度 (T0)
    help_en: Starting temperature controlling initial Metropolis acceptance probability of suboptimal mutations.
    help_zh: 模擬退火演算法之起始溫度 T0（預設 100.0），控制早期探索階段接受次優解之概率。
  - key: evolution_annealing_cooling_rate
    group: trading
    type: float
    default: 0.85
    min: 0.50
    max: 0.99
    label_en: Simulated annealing cooling rate (gamma)
    label_zh: 模擬退火幾何降溫率 (gamma)
    help_en: Multiplicative decay factor applied to temperature per iteration (T_k = T_0 * gamma^k).
    help_zh: 每一演化迭代之幾何降溫衰減因子 gamma（預設 0.85），控制系統由探索過渡至精準收斂之速度。
  - key: order_reconciliation_retry_limit
    group: trading
    type: int
    default: 5
    min: 1
    max: 20
    label_en: Order reconciliation retry limit
    label_zh: 訂單對賬重試上限
    help_en: Maximum reconciliation retries for unknown broker order status before initiating position cross-checks and auto-resolving.
    help_zh: 當券商訂單狀態為 unknown 時，最多重試對賬次數。超過此上限將進行持倉交叉核驗，若仍無法確認則結案轉為人工調查並解鎖標的。
  - key: order_lock_ttl_seconds
    group: trading
    type: int
    default: 1800
    min: 60
    max: 86400
    label_en: Order in-flight lock TTL (seconds)
    label_zh: 標的在途鎖有效時間 (秒)
    help_en: Expiration time for ticker-level in-flight execution lock preventing concurrent duplicate orders.
    help_zh: 當標的處於委託中或等待券商成交確認時，禁止同一標的重複下單的在途鎖超時時間（預設 1800 秒）。
  - key: intraday_churn_cooldown_hours
    group: trading
    type: float
    default: 24.0
    min: 0.0
    max: 72.0
    label_en: Intraday churn cooldown (hours)
    label_zh: 日內過度交易防抖冷卻 (小時)
    help_en: Cooldown period preventing opposite-direction flip-flop trades on the same ticker within specified hours to eliminate turnover churn.
    help_zh: 限制同一標的在特定時間內反覆買賣或過度調倉。若在冷卻時間內出現反向交易（買進後迅速賣出），除停損避險外將予以攔截阻斷，大幅降低週轉率磨損。
  - key: min_rebalance_hurdle_pct
    group: trading
    type: float
    default: 0.03
    min: 0.005
    max: 0.15
    label_en: Minimum rebalance delta hurdle pct
    label_zh: 最小調倉權重門檻 (比例)
    help_en: Minimum target weight delta required to execute a rebalance trade; smaller shifts are filtered out as micro-churn noise.
    help_zh: 目標權重與當前權重之變動幅度必須大於此門檻（預設 0.03 即 3%），才允許觸發調倉交易，杜絕微幅波動造成的摩擦成本吞噬超額收益。

  # ── Allocation ───────────────────────────────────────────────────────────
  # These four were `MIN_POS`/`MAX_POS`/`SECTOR_CAP`/`TARGET_SUM` module
  # constants in ticker_universe_service.py — the optimizer's shape was not
  # adjustable without editing Python.
  # 這四個原本是 ticker_universe_service 的模組常數，不改程式無法調整。
  - key: alloc_min_position
    group: allocation
    type: float
    default: 0.03
    min: 0.0
    max: 1.0
    label_en: Minimum position weight
    label_zh: 最小單一部位權重
  - key: alloc_max_position
    group: allocation
    type: float
    default: 0.20
    min: 0.0
    max: 1.0
    label_en: Maximum position weight
    label_zh: 最大單一部位權重
  - key: alloc_target_volatility
    group: allocation
    type: float
    default: 0.14
    min: 0.05
    max: 0.40
    label_en: Target portfolio volatility
    label_zh: 目標投資組合年化波動率
    help_en: Target annualized volatility (e.g. 0.14 for 14%). If projected portfolio volatility exceeds this target, equity positions are scaled down and excess capital is retained in cash.
    help_zh: 目標投資組合年化波動率（例如 0.14 代表 14%）。當投組預期年化波動率超越此目標時，線性縮減股票配置並將資金留存現金以壓降回撤。
  - key: alloc_sector_cap
    group: allocation
    type: float
    default: 0.40
    min: 0.0
    max: 1.0
    label_en: Sector exposure cap
    label_zh: 單一產業曝險上限
  - key: alloc_cluster_cap
    group: allocation
    type: float
    default: 0.30
    min: 0.10
    max: 0.60
    label_en: Correlation cluster exposure cap
    label_zh: 高相關集群曝險上限
    help_en: Cap maximum combined weight of tickers belonging to the same high-correlation cluster (correlation >= threshold), preventing cross-sector concentration collapse.
    help_zh: 高相關集群（相關係數高於門檻之標的群組）之最大合併持倉權重上限，防範跨產業假分散與共振式巨幅回撤。
  - key: alloc_correlation_cluster_threshold
    group: allocation
    type: float
    default: 0.70
    min: 0.40
    max: 0.95
    label_en: Correlation clustering threshold
    label_zh: 相關性分群共振門檻
    help_en: Minimum correlation coefficient between two tickers to be grouped into the same risk cluster.
    help_zh: 判定兩檔標的屬於同一風險集群之最低 60 日滾動相關係數門檻（預設 0.70）。
  - key: alloc_target_beta
    group: allocation
    type: float
    default: 0.90
    min: 0.30
    max: 1.50
    label_en: Target portfolio market beta
    label_zh: 目標投資組合市場 Beta
    help_en: Target weighted beta of the portfolio against the market benchmark (SPY). If projected beta exceeds the target, high-beta positions are dampened to protect against systemic volatility.
    help_zh: 投資組合相對於標普 500 (SPY) 之加權目標市場 Beta。當預期 Beta 超標時，對高 Beta 標的進行阻尼壓縮以平抑系統性大盤波動。
  - key: alloc_target_sum
    group: allocation
    type: float
    default: 0.95
    min: 0.0
    max: 1.0
    label_en: Target invested fraction
    label_zh: 目標投入比例
    help_en: The remainder is held as cash by the optimizer.
  - key: alloc_max_holdings
    group: allocation
    type: int
    default: 10
    min: 4
    max: 30
    label_en: Maximum target holdings
    label_zh: 目標最大持倉檔數
    help_en: Cap target portfolio size to top-K highest-conviction tickers, preventing capital fragmentation.
    help_zh: 將目標投資組合檔數收斂至評分最高的前 K 檔標的，避免小資金過度分散與碎屑化。
  - key: alloc_prune_micro_threshold_usd
    group: allocation
    type: float
    default: 30.0
    min: 0.0
    max: 500.0
    label_en: Micro-position pruning threshold (USD)
    label_zh: 微型部位汰除門檻（USD）
    help_en: Stale or low-conviction holdings valued below this threshold will be proactively liquidated during rebalancing.
    help_zh: 市值低於此門檻且非核心標的之邊緣持倉，在再平衡時將被主動清倉以釋放現金。
  - key: rotation_friction_multiplier
    group: allocation
    type: float
    default: 2.5
    min: 1.0
    max: 5.0
    label_en: Rotation friction multiplier
    label_zh: 換庫摩擦倍數
    help_en: Multiplier applied to round-trip trading friction (slippage + commissions) when calculating the opportunity cost hurdle for swapping positions.
    help_zh: 計算資產換庫機會成本門檻時施加於雙向交易摩擦（滑價與佣金）之安全倍數（預設 2.5 倍）。
  - key: rotation_hurdle_rate
    group: allocation
    type: float
    default: 0.010
    min: 0.001
    max: 0.050
    label_en: Rotation excess hurdle rate
    label_zh: 換庫超額利差門檻
    help_en: Minimum expected profit edge required above friction to approve swapping an existing holding for a candidate.
    help_zh: 核准換庫置換所需的超越交易摩擦之額外超額預期利差門檻（預設 0.010 即 1.0%）。
  - key: holding_decay_start_days
    group: allocation
    type: int
    default: 20
    min: 5
    max: 90
    label_en: Holding alpha decay start tenure (days)
    label_zh: 持倉 Alpha 衰減啟動天數
    help_en: Number of trading days a position can be held before momentum stall and alpha decay checks kick in.
    help_zh: 部位開倉後進入動能鈍化與 Alpha 衰減考覈前的寬限持有天數（預設 20 個交易日）。
  - key: holding_decay_rate
    group: allocation
    type: float
    default: 0.035
    min: 0.005
    max: 0.150
    label_en: Holding alpha decay rate (lambda)
    label_zh: 持倉 Alpha 衰減速率
    help_en: Exponential decay rate applied to stagnant or momentum-stalled positions beyond the start days.
    help_zh: 超過寬限期且動能鈍化或負 Alpha 之持倉所施加之指數衰減速率（預設 0.035）。
  - key: holding_decay_floor
    group: allocation
    type: float
    default: 0.40
    min: 0.10
    max: 0.80
    label_en: Holding alpha decay floor
    label_zh: 持倉 Alpha 衰減底限
    help_en: Minimum decay multiplier floor, ensuring active positions maintain baseline sizing until formal liquidation.
    help_zh: 持倉 Alpha 衰減因子之最低下限，確保持倉在正式平倉前維持基礎平滑底倉（預設 0.40）。
  - key: kelly_fraction_multiplier
    group: allocation
    type: float
    default: 0.25
    min: 0.05
    max: 1.00
    label_en: Kelly fraction multiplier
    label_zh: 凱利分數縮放倍數
    help_en: Multiplier applied to full Kelly sizing (0.25 = Quarter-Kelly) to prevent aggressive leverage and dampen equity volatility.
    help_zh: 施加於全額凱利注碼之分數縮放倍數（預設 0.25 即 Quarter-Kelly），防止過度激進下注並平抑權益波動。
  - key: kelly_min_trades
    group: allocation
    type: int
    default: 10
    min: 3
    max: 100
    label_en: Kelly sizing minimum sample trades
    label_zh: 凱利定價最低樣本交易數
    help_en: Minimum number of realized closed trades required before activating dynamic Kelly sizing; otherwise smooth fallback to prior benchmark.
    help_zh: 啟動動態凱利部位定價所需之最低已實現交易樣本數（預設 10 筆）；樣本不足時平滑回退至先驗預設基準。
  - key: kelly_min_position_pct
    group: allocation
    type: float
    default: 0.02
    min: 0.005
    max: 0.100
    label_en: Kelly sizing minimum position limit
    label_zh: 凱利定價單一部位下限
    help_en: Rigid minimum allocation floor for positive-edge trades under Kelly sizing.
    help_zh: 具正期望值交易在凱利部位定價下的剛性單一部位下限（預設 2.0%）。
  - key: kelly_max_position_pct
    group: allocation
    type: float
    default: 0.20
    min: 0.05
    max: 0.50
    label_en: Kelly sizing maximum position limit
    label_zh: 凱利定價單一部位上限
    help_en: Rigid maximum allocation cap for any single trade under Kelly sizing to prevent concentration risk.
    help_zh: 凱利部位定價下任何單一部位的剛性最大持倉上限，防止單一標的過度集中風險（預設 20.0%）。
  - key: kelly_lookback_days
    group: allocation
    type: int
    default: 90
    min: 10
    max: 365
    label_en: Kelly historical lookback window (days)
    label_zh: 凱利歷史統計回顧窗口（天）
    help_en: Number of calendar days of historical realized decisions used to calculate rolling win rate and payoff ratio.
    help_zh: 用於統計滾動已實現勝率與盈虧賠率之歷史決策回顧天數窗口（預設 90 天）。
  - key: enable_dynamic_kelly_sizing
    group: allocation
    type: bool
    default: true
    label_en: Enable dynamic Kelly sizing & cash drag eliminator
    label_zh: 啟用動態凱利部位定價與現金拖累消除
    help_en: "Dynamically sizes trade amounts according to Kelly criterion and conviction scores to avoid cash drag and micro-lots."
    help_zh: "結合凱利準則與 AI 確信度動態調整下單金額，擺脫微量固定下單與現金拖累。"
  - key: enable_convex_conviction_sizing
    group: allocation
    type: bool
    default: true
    label_en: Enable asymmetric convex conviction sizing
    label_zh: 啟用非對稱凸性確信度部位縮放
    help_en: "Scales position size non-linearly (gamma > 1) for high-conviction trades while dampening low-conviction allocations."
    help_zh: "開啟時，高確信度交易享受非對稱凸性冪次放大效益，低確信度交易非線性衰減，最大化正向幾何成長率。"
  - key: convex_sizing_gamma
    group: allocation
    type: float
    default: 1.8
    min: 1.0
    max: 3.5
    label_en: "Convex sizing convexity exponent (gamma)"
    label_zh: "凸性部位縮放冪次指數 (gamma)"
    help_en: "Non-linear convexity power exponent applied to confidence scores above neutral baseline (default: 1.8)."
    help_zh: "施加於超越中性基準確信度之非對稱凸性冪次指數（預設 1.8，數值愈大對高信心度加碼愈顯著）。"
  - key: stress_test_cvar_budget
    group: allocation
    type: float
    default: 0.08
    min: 0.03
    max: 0.20
    label_en: CVaR (Expected Shortfall @ 99%) risk budget
    label_zh: 99% 條件在險價值 (CVaR) 風險預算
    help_en: Maximum allowable 1-day 99% Conditional Value-at-Risk; exceeding this triggers pre-emptive capital preservation de-risking.
    help_zh: 投資組合允許之單日 99% 條件在險價值（Expected Shortfall）上限（預設 8.0%）；超標時自動觸發預防性避險機制。
  - key: stress_test_loss_threshold
    group: allocation
    type: float
    default: 0.10
    min: 0.05
    max: 0.30
    label_en: Worst historical stress loss threshold
    label_zh: 極端歷史情境最劣損失門檻
    help_en: Maximum allowable portfolio shock under historical replay scenarios (e.g. 2008, 2020 crash); exceeding this triggers defensive cash raise.
    help_zh: 歷史極端黑天鵝情境重演下允許之最大瞬間投組衝擊門檻（預設 10.0%）；超越時主動收縮風險敞口並提高現金水位。
  - key: stress_test_mc_simulations
    group: allocation
    type: int
    default: 1000
    min: 100
    max: 10000
    label_en: Monte Carlo stress simulation paths
    label_zh: 蒙地卡羅壓力模擬路徑數
    help_en: Number of simulated future return paths generated to evaluate the empirical probability of breaching max drawdown limits.
    help_zh: 用於估算未來 60 天內跌破 12% 最大回撤門檻之隨機幾何布朗運動路徑模擬次數（預設 1,000 次）。
  - key: stress_test_max_mdd_prob
    group: allocation
    type: float
    default: 0.15
    min: 0.01
    max: 0.50
    label_en: Maximum allowable 12% MDD breach probability
    label_zh: 跌破 12% 最大回撤之最高容許機率
    help_en: Maximum allowable Monte Carlo probability of portfolio experiencing >12% drawdown within 60 days.
    help_zh: 蒙地卡羅模擬評估未來 60 天內回撤超過 12% 的最高容許機率（預設 15.0%）；超過時觸發防禦性降險。
  - key: stress_test_emergency_cash_pct
    group: allocation
    type: float
    default: 0.35
    min: 0.15
    max: 0.70
    label_en: Pre-emptive emergency cash defense ratio
    label_zh: 預防性緊急防禦現金比例
    help_en: Target cash allocation automatically mandated when portfolio tail risk or stress test thresholds are breached.
    help_zh: 當壓力測試或尾部在險價值超標時，系統自動啟動之預防性防守現金比例（預設 35.0%）。
  - key: factor_ensemble_enabled
    group: allocation
    type: bool
    default: true
    label_en: Enable regime-conditioned multi-factor ensemble
    label_zh: 啟用體制感知動態多因子融合
    help_en: Dynamically weight Momentum, Quality, Value, Low Volatility, and Smart Money factors conditioned on macro market regimes.
    help_zh: 依據市場宏觀體制（牛市/震盪/熊市危機）動態合成動能、品質、成長價值、低波動與主力籌碼五大因子。
  - key: factor_momentum_weight_bull
    group: allocation
    type: float
    default: 0.40
    min: 0.10
    max: 0.70
    label_en: Momentum factor weight during Bull Trend
    label_zh: 牛市體制動能因子權重
    help_en: Allocation weight of momentum factor during confirmed Bull Market regime.
    help_zh: 牛市體制下賦予動能因子（12-1M 動能與相對強弱）之最高配置權重（預設 40.0%）。
  - key: factor_quality_weight_neutral
    group: allocation
    type: float
    default: 0.35
    min: 0.10
    max: 0.60
    label_en: Quality factor weight during Neutral/Sideways regime
    label_zh: 震盪體制品質因子權重
    help_en: Allocation weight of quality factor (ROE, profit margins, balance sheet health) during sideways markets.
    help_zh: 震盪橫盤體制下賦予品質因子（ROE、毛利率、負債健康度）之核心權重（預設 35.0%）。
  - key: factor_low_vol_weight_bear
    group: allocation
    type: float
    default: 0.40
    min: 0.15
    max: 0.70
    label_en: Low volatility factor weight during Bear/Crisis regime
    label_zh: 熊市危機體制低波動因子權重
    help_en: Allocation weight of low volatility factor (inverse annualized volatility & downside semi-variance) during Bear Crisis.
    help_zh: 熊市危機體制下賦予低波動因子之最高防禦權重（預設 40.0%）。
  - key: factor_winsorize_std
    group: allocation
    type: float
    default: 3.0
    min: 1.5
    max: 5.0
    label_en: Factor winsorization standard deviation threshold
    label_zh: 因子橫截面縮尾標準差倍數
    help_en: Number of standard deviations from the cross-sectional mean at which extreme factor values are winsorized to prevent distortion.
    help_zh: 橫截面因子評分極端值縮尾截斷之標準差倍數門檻（預設 3.0 個標準差）。
  - key: hmm_regime_enabled
    group: allocation
    type: bool
    default: true
    label_en: Enable Bayesian HMM regime transition & nowcasting
    label_zh: 啟用貝葉斯隱馬爾可夫體制轉移與在線現在預測
    help_en: Replaces discrete boundary regime classifications with continuous Bayesian posterior probability distributions.
    help_zh: 以連續貝葉斯後驗機率分佈取代傳統單點階梯式硬門檻體制判定，杜絕臨界抖動與斷崖式跳躍。
  - key: hmm_transition_persistence
    group: allocation
    type: float
    default: 0.92
    min: 0.50
    max: 0.99
    label_en: HMM regime transition persistence
    label_zh: HMM 體制狀態延續性對角機率
    help_en: Diagonal persistence probability in the HMM transition matrix, governing regime stickiness and memory.
    help_zh: 隱馬爾可夫模型狀態轉移矩陣之對角延續機率（預設 0.92），控制市場體制之延續性與時序記憶。
  - key: hmm_min_confidence_threshold
    group: allocation
    type: float
    default: 0.40
    min: 0.10
    max: 0.90
    label_en: HMM regime minimum confidence threshold
    label_zh: HMM 體制最低置信度門檻
    help_en: Confidence index threshold below which the market is recognized as in a choppy or ambiguous transition zone.
    help_zh: 依據香農體制熵計算之最低置信度門檻（預設 0.40）；低於此值代表市場處於體制轉換混沌期。
  - key: hmm_vix_bear_threshold
    group: allocation
    type: float
    default: 28.0
    min: 20.0
    max: 50.0
    label_en: HMM Bear Crisis VIX center threshold
    label_zh: HMM 熊市危機 VIX 中心門檻
    help_en: VIX baseline anchor around which Bear Crisis emission likelihood peaks.
    help_zh: 熊市危機體制發射高斯分佈之 VIX 中心錨定值（預設 28.0）。
  - key: hmm_vix_bull_threshold
    group: allocation
    type: float
    default: 19.0
    min: 10.0
    max: 25.0
    label_en: HMM Bull Momentum VIX upper threshold
    label_zh: HMM 牛市進攻 VIX 上限門檻
    help_en: VIX baseline ceiling below which Bull Momentum emission likelihood operates.
    help_zh: 牛市進攻體制發射高斯分佈之 VIX 波動率參考值（預設 19.0）。
  - key: adaptive_intelligence_enabled
    group: allocation
    type: bool
    default: true
    label_en: Enable unified adaptive portfolio intelligence orchestrator
    label_zh: 啟用統一投組自適應智慧聚合中樞
    help_en: Unifies M1-M6, E1, and O1 into a central portfolio diagnostic orchestrator with five-dimensional health radar scoring.
    help_zh: 統整 M1~M6、E1 與 O1 八大核心模組，提供五維健康雷達、全方位投組診斷與端到端執行排程。
  - key: adaptive_health_min_score_alert
    group: allocation
    type: float
    default: 60.0
    min: 30.0
    max: 90.0
    label_en: Adaptive health score minimum alert threshold
    label_zh: 自適應健康總分最低警報門檻
    help_en: Minimum acceptable overall portfolio adaptive health score (0-100) below which caution or critical warnings are triggered.
    help_zh: 投組自適應綜合健康總評分之最低容許警報門檻（預設 60.0）；低於此分數時觸發防禦預警。
  - key: adaptive_auto_rebalance_trigger
    group: allocation
    type: bool
    default: false
    label_en: Enable automatic rebalance trigger on critical score
    label_zh: 啟用嚴重健康惡化時之自動再平衡觸發
    help_en: Automatically dispatches M3 rebalance plans through E1 smart order routing when health score drops to CRITICAL level.
    help_zh: 當投組健康評分跌入 CRITICAL 嚴重警戒且 M3 緩衝帶突破時，是否自動授權生成調倉執行單（預設 false 需人機確認）。
  - key: evt_tail_risk_enabled
    group: allocation
    type: bool
    default: true
    label_en: Enable extreme value theory (EVT) tail risk extrapolation
    label_zh: 啟用黑天鵝極值理論尾部風險外推
    help_en: Activates Peaks-Over-Threshold (POT) and Generalized Pareto Distribution (GPD) modeling to capture non-linear black swan fat tails beyond Gaussian limits.
    help_zh: 啟用超額峰值法 (POT) 與廣義帕雷托分佈 (GPD)，精準捕捉超越常態與經驗分佈邊界之 99.9% 極端黑天鵝尾部損失。
  - key: evt_threshold_quantile
    group: allocation
    type: float
    default: 0.90
    min: 0.80
    max: 0.98
    label_en: EVT POT exceedance threshold quantile
    label_zh: 極值理論 POT 超額門檻分位數
    help_en: High loss quantile used to establish threshold u for Generalized Pareto exceedance modeling.
    help_zh: 用於界定超額損失門檻 u 之損失分位數（預設 0.90，即右側 10% 尾部超額擬合）。
  - key: evt_tail_fatness_alert_threshold
    group: allocation
    type: float
    default: 1.80
    min: 1.20
    max: 3.50
    label_en: EVT tail fatness alert ratio threshold
    label_zh: 極值理論肥尾倍數預警門檻
    help_en: Multiplier of EVT 99.9% VaR over Gaussian 99.9% VaR above which elevated or critical black swan risk is declared.
    help_zh: EVT 99.9% VaR 相對常態分佈 99.9% VaR 之倍數門檻（預設 1.80x）；超過此值即判定市場或投組具備嚴重黑天鵝厚尾脆弱性。
  - key: evt_max_shape_xi
    group: allocation
    type: float
    default: 0.80
    min: 0.30
    max: 1.50
    label_en: EVT GPD shape parameter upper bound
    label_zh: 極值理論 GPD 形狀參數上限保護
    help_en: Upper cap on shape parameter xi to ensure numerical stability and prevent infinite mean distortion during extreme disruptions.
    help_zh: 廣義帕雷托形狀參數 xi 之數值截斷上限（預設 0.80），確保極端動盪環境下數值運算穩定性。
  - key: initial_capital_deposited_usd
    group: allocation
    type: float
    default: 1711.00
    min: 0.0
    max: 10000000.0
    label_en: Initial Deposited Capital (USD)
    label_zh: 初始存入本金基準 (USD)
    help_en: Total user-contributed capital benchmark used for calculating true cumulative return and audit reconciliations.
    help_zh: 用戶實盤存入之本金基準（預設 1711.00 USD），用於精確計算全帳戶真實累計損益與真實驗資對帳，杜絕浮動損益誤報。
  - key: target_cash_ratio
    group: allocation
    type: float
    default: 0.2
    min: 0.0
    max: 1.0
    label_en: Target cash ratio
    label_zh: 目標現金比例
    help_en: >-
      Read in four places with three different hardcoded fallbacks (0.1, 0.10,
      0.20) before this schema existed — the exact drift a registry prevents.
    help_zh: 此鍵原本在四處被讀取、各自帶 0.1 / 0.10 / 0.20 三種不同預設值。
  - key: risk_max_sector_exposure
    group: allocation
    type: float
    default: 0.35
    min: 0.0
    max: 1.0
    label_en: Max sector exposure (risk guard)
    label_zh: 產業曝險上限（風控）
  - key: max_single_position_pct
    group: allocation
    type: float
    default: 0.25
    min: 0.0
    max: 1.0
    label_en: Max single position (fraction)
    label_zh: 單一部位上限（比例）
  - key: max_single_position_weight
    group: allocation
    type: float
    default: 25.0
    min: 0.0
    max: 100.0
    label_en: Max single position (percent)
    label_zh: 單一部位上限（百分比）
    help_en: Percent-scaled twin of max_single_position_pct, kept for the sentinel path.
  - key: target_allocation
    group: allocation
    type: json
    default: {}
    label_en: Target allocation
    label_zh: 目標配置
    help_en: 'JSON map of ticker to target weight, e.g. {"NVDA": 0.1}.'
  - key: auto_reinvest_threshold
    group: allocation
    type: float
    default: 0.0
    min: 0.0
    label_en: Auto-reinvest cash above (USD)
    label_zh: 現金超過此金額自動再投入（USD）
  - key: cash_deployment_cooldown_hours
    group: allocation
    type: int
    default: 4
    min: 0
    max: 168
    label_en: Cash deployment cooldown (hours)
    label_zh: 現金投入冷卻（小時）
  - key: flat_market_threshold
    group: allocation
    type: float
    default: 0.5
    min: 0.0
    label_en: Flat-market threshold
    label_zh: 盤整判定門檻
  - key: universe_auto_refresh_enabled
    group: allocation
    type: bool
    default: true
    label_en: Enable dynamic universe evolution
    label_zh: 啟用自選標的池動態進化
    help_en: Dynamically evict degraded tickers and screen market candidates based on macro regime.
  - key: universe_min_quality_score
    group: allocation
    type: float
    default: 6.5
    min: 0.0
    max: 10.0
    label_en: Universe minimum admission score
    label_zh: 標的池入選最低綜合品質分 (0-10)
    help_en: Candidates must reach this score to be admitted to the universe.
  - key: universe_eviction_threshold
    group: allocation
    type: float
    default: 4.0
    min: 0.0
    max: 10.0
    label_en: Universe eviction score threshold
    label_zh: 標的池剔除品質分門檻 (0-10)
    help_en: Active tickers scoring below this threshold are removed from the active universe.
  - key: universe_max_active_tickers
    group: allocation
    type: int
    default: 8
    min: 3
    max: 50
    label_en: Max active universe size
    label_zh: 標的池最大活躍標的數量
  - key: universe_max_candidate_tickers
    group: allocation
    type: int
    default: 30
    min: 5
    max: 100
    label_en: Max candidate universe size
    label_zh: 標的池最大候選標的數量
    help_en: Target capacity for reserve candidates managed through dynamic elimination and retention.
    help_zh: 候選池中定期汰弱留強之儲備標的數量上限。
  - key: universe_rotation_hurdle
    group: allocation
    type: float
    default: 1.5
    min: 0.5
    max: 5.0
    label_en: Active vs Candidate rotation hurdle
    label_zh: 活躍池動態輪換淘汰利差門檻 (0.5-5.0)
    help_en: Minimum score advantage required for a top candidate to replace an unpinned active ticker.
    help_zh: 候選股評分超越未鎖定活躍股的最低利差，達到門檻方能觸發活躍池汰弱留強替換。
  - key: universe_max_rotations_per_cycle
    group: allocation
    type: int
    default: 2
    min: 1
    max: 5
    label_en: Max rotations per lifecycle cycle
    label_zh: 單輪週期最大替換標的數 (1-5)
    help_en: Maximum number of unpinned active tickers that can be replaced by candidates in one review cycle to prevent churn.
    help_zh: 單次審查週期中允許被候選股替換之未鎖定活躍股數量上限，防止換手率過高。
  - key: universe_min_market_cap_billions
    group: allocation
    type: float
    default: 2.0
    min: 0.0
    label_en: Universe minimum market cap ($B)
    label_zh: 標的池最低市值門檻（十億美元）
  - key: universe_min_daily_volume_millions
    group: allocation
    type: float
    default: 5.0
    min: 0.0
    label_en: Universe minimum daily dollar volume ($M)
    label_zh: 標的池最低每日成交金額（百萬美元）
  - key: pyramid_screener_enabled
    group: allocation
    type: bool
    default: true
    label_en: Enable two-stage pyramid screener
    label_zh: 啟用兩階段金字塔標的初篩器
    help_en: Run deterministic quant filters on expanded candidate pool before deep quality gate.
    help_zh: 於標的池生命週期演化前，先對 150+ 檔標的執行純 Python 量化快速過濾收窄至菁英候選。
  - key: pyramid_screener_top_candidates
    group: allocation
    type: int
    default: 12
    min: 3
    max: 50
    label_en: Pyramid screener top candidates
    label_zh: 金字塔初篩保留菁英標的數
    help_en: Number of top-ranked candidates retained from Stage 1 quant screening.
    help_zh: 第一階段量化動量評分中保留之候選標的數量（送往第二階段深層審查）。
  - key: pyramid_screener_min_dollar_volume_m
    group: allocation
    type: float
    default: 10.0
    min: 1.0
    label_en: Pyramid screener min daily dollar volume ($M)
    label_zh: 金字塔初篩最低每日成交金額（百萬美元）
    help_en: Liquidity threshold for candidate stocks in Stage 1 screening.
    help_zh: 第一階段篩選候選標的之每日成交金額門檻（百萬美元）。
  - key: universe_require_shadow_validation
    group: allocation
    type: bool
    default: true
    label_en: Require shadow validation for admitted candidates
    label_zh: 候選標的晉級實盤前強制執行影子交易驗證軌道 (P2)
    help_en: When enabled, candidates admitted by the screener enter 'shadow' status for 7-14 days of virtual tracking before graduating to the live active pool.
    help_zh: 開啟時，篩選出的候選標的會先進入影子驗證軌道進行 7-14 天虛擬跟單考核，達成損益與回撤門檻方晉升為實盤活躍股。
  - key: shadow_validation_min_days
    group: allocation
    type: int
    default: 7
    min: 1
    max: 90
    label_en: Minimum shadow validation observation days
    label_zh: 影子交易考核最低觀察天數（天）
    help_en: Minimum days a candidate must trade virtually before graduation evaluation.
    help_zh: 候選標的在影子軌道中必須累積虛擬運行的最短交易天數方可參與畢業審查。
  - key: shadow_validation_min_return
    group: allocation
    type: float
    default: 0.0
    label_en: Minimum shadow validation return (%)
    label_zh: 影子交易考核最低浮動報酬率 (%)
    help_en: Minimum cumulative return required for graduation (net of simulated fees).
    help_zh: 扣除模擬滑價與手續費後，影子部位必須達成的最低累計浮動報酬率。
  - key: shadow_validation_max_drawdown
    group: allocation
    type: float
    default: 5.0
    min: 0.5
    max: 30.0
    label_en: Maximum shadow validation drawdown (%)
    label_zh: 影子交易考核最大回撤上限 (%)
    help_en: Maximum peak-to-trough drawdown tolerated during validation period.
    help_zh: 影子考核期間從波段高點允許之最大回撤幅度上限。
  - key: shadow_require_support_held
    group: allocation
    type: bool
    default: true
    label_en: Require institutional support integrity for graduation
    label_zh: 影子交易考核必須保持主力籌碼支撐未跌破
    help_en: When enabled, candidates that breach institutional support (Anchored VWAP / POC) fail validation.
    help_zh: 開啟時，若價格跌破主力籌碼成本防線即判定考核失敗，不予提拔實盤。
  - key: shadow_auto_rotation_enabled
    group: allocation
    type: bool
    default: false
    danger: true
    label_en: Enable automated shadow-to-live rotation
    label_zh: 啟用影子交易自動實盤輪轉換庫 (P5)
    help_en: When enabled, qualified shadow positions that clear the opportunity cost hurdle will automatically execute live capital replacement and SOR orders without manual confirmation.
    help_zh: 開啟時，考核合格之影子標的若突破非線性換庫機會成本門檻，將由系統自動執行實盤置換與 E1 SOR 拆單，無需人工手動點擊確認。
  - key: shadow_rotation_min_edge
    group: allocation
    type: float
    default: 0.015
    min: 0.005
    max: 0.10
    label_en: Minimum shadow rotation excess edge
    label_zh: 影子換庫超額淨利差最低門檻
    help_en: Minimum net expected edge advantage (over two-way friction and hurdle) required to trigger holding replacement.
    help_zh: 扣除雙向摩擦阻尼與基本門檻後，影子標的相較於被替換持倉必須保有的最低淨超額利差優勢（預設 1.5%）。
  - key: shadow_max_active_positions
    group: allocation
    type: int
    default: 10
    min: 1
    max: 50
    label_en: Maximum active live positions limit
    label_zh: 實盤活躍持倉數量上限
    help_en: Capacity threshold beyond which shadow graduations must displace an existing decaying holding instead of opening direct new lots.
    help_zh: 投組實盤活躍持倉上限；超出此上限之影子畢業標的必須透過置換淘汰衰減持倉進行換庫，不可直接開立新倉。
  - key: enable_sector_drift_guard
    group: allocation
    type: bool
    default: true
    label_en: Enable sector drift guard & dynamic universe balance
    label_zh: 啟用行業主題漂移守衛與自適應板塊平衡
    help_en: "Monitors sector concentration, guards against single-sector over-crowding (>30%), and dynamically admits thematic contenders from under-represented sectors."
    help_zh: "實時監控投組與標的池行業集中度，嚴格防範單一產業過度擁擠（>30%），並自適應擴充低配產業優質龍頭。"
  - key: sector_concentration_cap_pct
    group: allocation
    type: float
    default: 0.30
    min: 0.10
    max: 0.60
    label_en: Sector concentration hard limit cap
    label_zh: 單一行業集中度剛性上限
    help_en: "Rigid ceiling for any single sector aggregate weight in the active universe or portfolio positions (default: 30%)."
    help_zh: "活躍標的池或投組合計在任一單一產業之剛性持倉上限比例（預設 30%）。"
  - key: sector_drift_warning_pct
    group: allocation
    type: float
    default: 0.25
    min: 0.10
    max: 0.50
    label_en: Sector drift warning threshold
    label_zh: 單一行業集中度預警門檻
    help_en: "Early warning threshold triggering diagnostic alerts before a sector reaches the hard concentration cap (default: 25%)."
    help_zh: "行業集中度早期預警臨界值（預設 25%），超標時發出診斷預警並優先引導資金轉向多元平衡產業。"


  # ── Sentinel ─────────────────────────────────────────────────────────────
  - key: sentinel_p1_limit_mins
    group: sentinel
    type: int
    default: 15
    min: 1
    label_en: P1 alert window (minutes)
    label_zh: P1 告警窗口（分鐘）
  - key: sentinel_p2_limit_mins
    group: sentinel
    type: int
    default: 60
    min: 1
    label_en: P2 alert window (minutes)
    label_zh: P2 告警窗口（分鐘）
  - key: sentinel_p3_limit_mins
    group: sentinel
    type: int
    default: 240
    min: 1
    label_en: P3 alert window (minutes)
    label_zh: P3 告警窗口（分鐘）
  - key: sentinel_p4_limit_mins
    group: sentinel
    type: int
    default: 720
    min: 1
    label_en: P4 alert window (minutes)
    label_zh: P4 告警窗口（分鐘）
  - key: sentinel_p5_limit_mins
    group: sentinel
    type: int
    default: 1440
    min: 1
    label_en: P5 alert window (minutes)
    label_zh: P5 告警窗口（分鐘）
  # The three expensive tick dimensions. They used to gate on `now.minute % N`,
  # which silently changed meaning when the tick moved off every-minute.
  # 這三個原本用 now.minute % N 判斷，tick 頻率一改語意就跑掉。
  - key: sentinel_breaking_news_interval_min
    group: sentinel
    type: int
    default: 30
    min: 1
    label_en: Breaking-news scan interval (minutes)
    label_zh: 突發新聞掃描間隔（分鐘）
    help_en: Hits the paid Tavily search. Lower means more spend.
  - key: sentinel_macro_interval_min
    group: sentinel
    type: int
    default: 60
    min: 1
    label_en: Macro (FRED) scan interval (minutes)
    label_zh: 總經（FRED）掃描間隔（分鐘）
  - key: sentinel_deep_interval_min
    group: sentinel
    type: int
    default: 60
    min: 1
    label_en: Global macro scan interval (minutes)
    label_zh: 全球總經掃描間隔（分鐘）
  - key: auto_hedge_score
    group: sentinel
    type: int
    default: 8
    min: 0
    max: 10
    danger: true
    label_en: Auto-hedge trigger score
    label_zh: 自動避險觸發分數
  - key: emergency_liquidation_score
    group: sentinel
    type: int
    default: 9
    min: 0
    max: 10
    danger: true
    label_en: Emergency liquidation score
    label_zh: 緊急清倉分數
  - key: emergency_hedge_amount
    group: sentinel
    type: float
    default: 50.0
    min: 0
    danger: true
    label_en: Emergency hedge amount (USD)
    label_zh: 緊急避險金額（USD）
  - key: risk_appetite_score
    group: sentinel
    type: int
    default: 5
    min: 0
    max: 10
    label_en: Risk appetite score
    label_zh: 風險偏好分數
  - key: event_bias_enabled
    group: sentinel
    type: bool
    default: true
    label_en: Enable Event Impact Bias Loop
    label_zh: 啟用市場事件量化偏置閉環
    help_en: Quantifies market events (Micro vs Macro) into exponential time-decay biases affecting buy confidence, exit urgency, and cash buffer.
    help_zh: 將市場事件 (個經/總經) 量化為指數時間衰減偏置，動態微調買進信心、出場急迫性與防禦性現金水位。
  - key: event_bias_micro_half_life_hours
    group: sentinel
    type: float
    default: 36.0
    min: 6.0
    max: 168.0
    depends: event_bias_enabled
    label_en: Micro Event Half-Life (Hours)
    label_zh: 個經事件半衰期 (小時)
    help_en: Half-life in hours for ticker-specific events (analyst downgrades, earnings misses, etc.).
    help_zh: 單一標的特異性事件 (券商降評、財報、管理層異動等) 之指數衰減半衰期。
  - key: event_bias_macro_half_life_hours
    group: sentinel
    type: float
    default: 96.0
    min: 12.0
    max: 336.0
    depends: event_bias_enabled
    label_en: Macro Event Half-Life (Hours)
    label_zh: 總經事件半衰期 (小時)
    help_en: Half-life in hours for systemic market events (FOMC rates, CPI inflation, geopolitics).
    help_zh: 總體經濟與系統性事件 (FOMC 利率決議、通膨數據、地緣衝突) 之指數衰減半衰期。
  - key: event_bias_max_micro_impact
    group: sentinel
    type: float
    default: 1.5
    min: 0.5
    max: 3.0
    depends: event_bias_enabled
    label_en: Max Micro Score Bias (+/- pt)
    label_zh: 個經評分最大微調幅度 (±分)
    help_en: Maximum score delta that micro events can apply to ticker composite score.
    help_zh: 單一標的因個經事件最多微調的分數上限 (0-10 分制)。
  - key: event_bias_max_macro_cash_buffer
    group: sentinel
    type: float
    default: 0.15
    min: 0.05
    max: 0.35
    depends: event_bias_enabled
    label_en: Max Macro Cash Reserve Expansion
    label_zh: 總經最大現金防禦擴增比例
    help_en: Maximum additional cash reserve ratio dynamically held during severe macro stress.
    help_zh: 遭遇嚴重總經壓力衝擊時，投資組合自動額外保留現金防禦比率的上限。

  # ── Notifications ────────────────────────────────────────────────────────
  - key: notification_routing
    group: notify
    type: json
    default: {}
    label_en: Category routing
    label_zh: 類別路由
    help_en: 'JSON map of category (report/sentinel/approval/trading/ops) to channels.'
  - key: channel_telegram_enabled
    group: notify
