  # A schema default that disagrees with the code's own constant is worse than
  # no default: it silently changes behaviour the moment the key is absent.
  # 預設值必須與 RiskKeywordService 的常數一致；不一致的預設值會在鍵缺失時
  # 靜默改變行為，比沒有預設值更糟。
