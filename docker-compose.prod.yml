include:
  - path: infra/signoz/docker/docker-compose.yaml

services:
  # 1. API Gateway & Backend Engine (FastAPI)
  mcp_server:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: advisor_prod_api
    restart: always
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    # `pip install itsdangerous` used to run here on every container start.
    # It existed for Starlette's SessionMiddleware, which went with the OAuth
    # flows; the package is no longer a dependency, and `uv venv` does not
    # install pip into the venv anyway, so the command could only fail.
    # 此處原本每次啟動都 pip install itsdangerous（為已移除的 SessionMiddleware
    # 而存在）；該套件已不再是相依，且 uv venv 不含 pip，只會失敗。
    command: sh -c "python scripts/init_db.py && uvicorn services.mcp_server.src.app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3001
      - FRONTEND_CALLBACK_URL=http://localhost:3001/auth/callback
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=advisor_prod_db
      - OTEL_SERVICE_NAME=mcp_server_prod
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - ./src:/workspace/src:ro
      - ./prompts:/workspace/prompts:ro
      # config/ holds the settings registry (settings_schema.yaml), provider
      # and persona manifests — the low-code surface. It was baked into the
      # image only, so editing the schema on the host changed nothing until a
      # rebuild, which defeats the point of a file-driven registry.
      # config/ 是低程式碼設定面（settings_schema.yaml 等）。原本只烤進映像，
      # 在主機上編輯要等重建才生效，與檔案驅動註冊表的目的相違。
      # WRITABLE for this service only: the workflow editor writes
      # config/workflows/*.yaml through PUT /api/v1/workflows/{id}.
      # worker and celery_beat keep :ro — they only ever read these files,
      # and a scheduler that can rewrite its own workflow definitions is a
      # larger blast radius than the feature needs.
      # 僅此服務可寫：workflow 編輯器需寫入 config/workflows/*.yaml。
      # worker 與 beat 維持唯讀——它們只讀取，且能改寫自身流程定義的排程器
      # 影響範圍遠大於此功能所需。
      - ./config:/workspace/config
      - ./secrets/client_secret.json:/workspace/client_secret.json:ro
      # 2026-07-14: alembic/ was never bind-mounted, so the container's
      # baked-in migration files went stale the moment any new revision
      # was added on the host — init_db.py's `alembic upgrade head` then
      # crash-loops with "Can't locate revision" the instant
      # alembic_version is stamped past whatever was baked in at last
      # image build. src/ and prompts/ already follow this live-reload
      # pattern; alembic/ needs it just as much.
      - ./alembic:/workspace/alembic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      # 2026-08-10: 30s → 60s. At 30s this probe opened 2,880 Redis sockets a
      # day that /health never closed, and exhausted maxclients in ~3.5 days.
      # The leak itself is fixed; halving the rate keeps the blast radius
      # smaller if any future handler regresses the same way.
      # 2026-08-10：30s → 60s。原本此探針每天讓 /health 洩漏 2880 條 Redis
      # 連線，約 3.5 天打滿 maxclients。洩漏已修，降頻是縮小未來回歸的影響面。
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net

  # 2. Modern Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: advisor_prod_ui
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      mcp_server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - advisor-net

  # 3. Task Scheduler — REMOVED 2026-07-12.
  # The `scheduler` service ran `celery beat` identically to the `celery_beat`
  # service below, so every beat task fired TWICE (double sentinel ticks,
  # duplicate daily reports/digests) against a live brokerage. Single beat
  # authority is now `celery_beat` (container advisor_prod_beat). If a
  # multi-user fan-out dispatcher is introduced later (see roadmap Phase 3),
  # it must be a NEW command — never a second `celery beat`.
  # 2026-07-12 移除：scheduler 與下方 celery_beat 執行相同的 celery beat,
  # 導致所有排程任務重複觸發 2 次。唯一 beat 權威為 celery_beat。

  # 4. PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: advisor_prod_db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASS:?DB_PASS must be set in .env}
      - POSTGRES_DB=advisor_prod
    volumes:
      - advisor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - advisor-net

  # 5. Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: advisor_prod_cache
    restart: always
    # 2026-08-10: --maxclients raised from the 10000 default and nofile pinned.
    # Defence in depth only — the real fix for the outage was closing the
    # leaked async clients (see src/infrastructure/cache/redis_client.py).
    # A higher ceiling buys time to notice a future leak; it does not cure one.
    # 2026-08-10：maxclients 由預設 10000 提高並固定 nofile。此為縱深防禦，真正
    # 的修復是關閉洩漏的 async client；提高上限只是爭取發現問題的時間，不是解方。
    # `advisor_redis_data` was declared at the bottom of this file but never
    # mounted, so Redis ran purely in memory: every restart dropped the Celery
    # result backend, the report queues and the sentinel buffer. Persist it and
    # turn on AOF so a `docker compose restart` is not a data event.
    # 此 volume 先前宣告卻未掛載，Redis 狀態每次重啟即消失。
    command: sh -c "redis-server --requirepass \"$$REDIS_PASSWORD\" --maxclients 20000 --appendonly yes"
    volumes:
      - advisor_redis_data:/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - advisor-net

  # 6. n8n Workflow Automation
  n8n:
    # Optional third-party connector hub — NOT part of the product's boot path.
    #
    # n8n used to run three schedules against this app (RSS ingest every 15m,
    # skill learning daily, podcast extraction every 4h), each a round-trip back
    # into our own /webhook endpoints. Those now live in Celery Beat
    # (src/infrastructure/tasks.py), so nothing here depends on n8n any more.
    #
    # It stays available because its 400+ connectors are genuinely useful for
    # wiring external services in without code; inbound automation can also
    # still POST to /webhook/{source} (make, pipedream and ifttt are already
    # first-class parsers).
    #
    #   docker compose --profile n8n up -d n8n
    #
    # n8n 的三個排程已改由 Celery Beat 執行；此服務降級為選配連接器，
    # 不再位於開機路徑上。
    profiles: [n8n]
    # Pinned to the same digest dev uses. `:latest` meant a `docker compose
    # pull` could swap the workflow engine under a running deployment.
    image: n8nio/n8n@sha256:fdf1e22bc04a03e38da41da5a56ba9b9a48510f480874290ea9c180844cbdb0c
    container_name: advisor_prod_n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_OTEL_SDK_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=n8n_prod
    volumes:
      - advisor_n8n_data:/home/node/.n8n
      - ./n8n_workflow_template.json:/home/node/template.json:ro
    depends_on:
      mcp_server:
        condition: service_healthy
    networks:
      - advisor-net

  # 7. Worker Pool
  # Single Celery worker at concurrency 4.
  #
  # This was two identical services — worker_1 and worker_2, each `-c 2`, whose
  # 40-line blocks differed only in container_name, WORKER_ID and
  # OTEL_SERVICE_NAME. Two processes each running two child processes is not
  # more resilient than one running four on a single box: they share the host,
  # the Redis broker and the database, so there is no failure they survive
  # independently. One service, same total concurrency, half the containers.
  #
  # 原本是兩個除了名字之外完全相同的 worker（各 -c 2）。單機上兩個行程並不比
  # 一個行程跑四個子行程更耐故障——共用主機、broker 與資料庫。合併為一個。
  worker:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: advisor_prod_worker
    restart: always
    command: sh -c "celery -A src.infrastructure.celery_app worker --loglevel=info -c ${WORKER_CONCURRENCY:-4}"
    user: root
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=advisor_prod_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OTEL_SERVICE_NAME=worker_prod
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - ./src:/workspace/src:ro
      - ./prompts:/workspace/prompts:ro
      # config/ holds the settings registry (settings_schema.yaml), provider
      # and persona manifests — the low-code surface. It was baked into the
      # image only, so editing the schema on the host changed nothing until a
      # rebuild, which defeats the point of a file-driven registry.
      # config/ 是低程式碼設定面（settings_schema.yaml 等）。原本只烤進映像，
      # 在主機上編輯要等重建才生效，與檔案驅動註冊表的目的相違。
      - ./config:/workspace/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import os,redis; redis.Redis(host='redis', port=6379, password=os.environ['REDIS_PASSWORD']).ping()" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # P2-3: Celery Beat
  celery_beat:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: advisor_prod_beat
    restart: always
    command: sh -c "celery -A src.infrastructure.celery_app beat --loglevel=info"
    user: root
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=advisor_prod_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - OTEL_SERVICE_NAME=celery_beat_prod
    volumes:
      - ./src:/workspace/src:ro
      - ./prompts:/workspace/prompts:ro
      # config/ holds the settings registry (settings_schema.yaml), provider
      # and persona manifests — the low-code surface. It was baked into the
      # image only, so editing the schema on the host changed nothing until a
      # rebuild, which defeats the point of a file-driven registry.
      # config/ 是低程式碼設定面（settings_schema.yaml 等）。原本只烤進映像，
      # 在主機上編輯要等重建才生效，與檔案驅動註冊表的目的相違。
      - ./config:/workspace/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if any('celery' in open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net

  # 10. Lightweight Web Scraper Service
  # The `scraper` service (a FastAPI + pyppeteer/Chromium sidecar) was removed:
  # nothing in the stack depended on it, it had no healthcheck, and the main
  # image already carries browser automation via the optional `scrape` extra.
  # scraper 服務無人依賴、無健檢，且主映像已可透過 scrape extra 提供瀏覽器自動化。

  ngrok:
    # ⚠️  PUBLIC EXPOSURE — opt-in only, and deliberately pointed at :8080.
    #
    # ngrok reaches nginx over advisor-net, which BYPASSES the 127.0.0.1 port
    # publishing that protects every other service. Aimed at :80 it put the
    # unauthenticated dashboard and the whole /api/ surface on the internet —
    # confirmed live on 2026-09-11, when GET /api/v1/settings returned 200 with
    # full settings to an anonymous caller.
    #
    # :8080 is the webhook-only vhost in infra/nginx/nginx.conf: it publishes
    # /webhook/* and /callback/* (which carry their own X-API-Key / provider
    # signatures) and returns 404 for everything else. `./start.sh tunnel`
    # refuses to start if this is repointed at :80 or that vhost is missing.
    #
    # This service was accidentally deleted during the M3 compose consolidation
    # — it sat between `scraper` and `nginx`, and the edit that removed the
    # scraper took the range between them. `./start.sh tunnel` then passed its
    # own guards and failed with "no such service: ngrok".
    #
    # ⚠️ 此通道走 docker 網路，會繞過 127.0.0.1 綁定。指向 :80 等於把無登入的
    #    儀表板與 /api/ 對全網開放（2026-09-11 實測 200）。:8080 是只公開
    #    webhook/callback 的 vhost。此服務曾在 M3 整併 compose 時被誤刪。
    profiles: [tunnel]
    image: ngrok/ngrok:3-alpine
    container_name: advisor_prod_ngrok
    restart: always
    command: http --url=${NGROK_DOMAIN} advisor_prod_gateway:8080
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - nginx
    networks:
      - advisor-net

  nginx:
    image: nginx:alpine
    container_name: advisor_prod_gateway
    restart: always
    ports:
      # 127.0.0.1:8088 (was 0.0.0.0:80) — localhost-only; privileged :80 needs vmnetd helper.
      # ngrok reaches nginx over advisor-net (advisor_prod_gateway:80), unaffected by host port.
      - "127.0.0.1:8088:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      mcp_server:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - advisor-net

  # ───────────────────────────────────────────────────────────────────────────
  # SigNoz observability stack — OPT-IN ONLY.
  #   docker compose --profile observability up -d
  # These services come from `include: infra/signoz/docker/docker-compose.yaml`
  # (ClickHouse + ZooKeeper + collector + 2 migrators ≈ 4-6GB RAM). A single-box
  # deployment does not pay that by default; the app degrades to structured logs
  # because src/utils/tracing.py disables tracing when
  # OTEL_EXPORTER_OTLP_ENDPOINT is unset.
  # 可觀測性堆疊改為選配，預設不啟動以省下 4-6GB RAM。
  # ───────────────────────────────────────────────────────────────────────────

  init-clickhouse:
    profiles: [observability]

  zookeeper-1:
    profiles: [observability]

  clickhouse:
    profiles: [observability]

  signoz:
    profiles: [observability]

  otel-collector:
    profiles: [observability]

  schema-migrator-sync:
    profiles: [observability]

  schema-migrator-async:
    profiles: [observability]

volumes:
  advisor_db_data:
  advisor_redis_data:
  advisor_n8n_data:

networks:
  advisor-net:
    driver: bridge