include:
  - path: infra/signoz/docker/docker-compose.yaml

services:
  # 1. API Gateway & Backend Engine (FastAPI)
  mcp_server:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: advisor_prod_api
    restart: always
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    command: sh -c "/opt/venv/bin/pip install itsdangerous>=2.2.0 && python scripts/init_db.py && uvicorn services.mcp_server.src.app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3001
      - FRONTEND_CALLBACK_URL=http://localhost:3001/auth/callback
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=advisor_prod_db
      - OTEL_SERVICE_NAME=mcp_server_prod
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - ./src:/workspace/src:ro
      - ./prompts:/workspace/prompts:ro
      - ./secrets/client_secret.json:/workspace/client_secret.json:ro
      # 2026-07-14: alembic/ was never bind-mounted, so the container's
      # baked-in migration files went stale the moment any new revision
      # was added on the host — init_db.py's `alembic upgrade head` then
      # crash-loops with "Can't locate revision" the instant
      # alembic_version is stamped past whatever was baked in at last
      # image build. src/ and prompts/ already follow this live-reload
      # pattern; alembic/ needs it just as much.
      - ./alembic:/workspace/alembic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      # 2026-08-10: 30s → 60s. At 30s this probe opened 2,880 Redis sockets a
      # day that /health never closed, and exhausted maxclients in ~3.5 days.
      # The leak itself is fixed; halving the rate keeps the blast radius
      # smaller if any future handler regresses the same way.
      # 2026-08-10：30s → 60s。原本此探針每天讓 /health 洩漏 2880 條 Redis
      # 連線，約 3.5 天打滿 maxclients。洩漏已修，降頻是縮小未來回歸的影響面。
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net

  # 2. Modern Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: advisor_prod_ui
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      mcp_server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - advisor-net

  # 3. Task Scheduler — REMOVED 2026-07-12.
  # The `scheduler` service ran `celery beat` identically to the `celery_beat`
  # service below, so every beat task fired TWICE (double sentinel ticks,
  # duplicate daily reports/digests) against a live brokerage. Single beat
  # authority is now `celery_beat` (container advisor_prod_beat). If a
  # multi-user fan-out dispatcher is introduced later (see roadmap Phase 3),
  # it must be a NEW command — never a second `celery beat`.
  # 2026-07-12 移除：scheduler 與下方 celery_beat 執行相同的 celery beat,
  # 導致所有排程任務重複觸發 2 次。唯一 beat 權威為 celery_beat。

  # 4. PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: advisor_prod_db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASS:?DB_PASS must be set in .env}
      - POSTGRES_DB=advisor_prod
    volumes:
      - advisor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - advisor-net

  # 5. Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: advisor_prod_cache
    restart: always
    # 2026-08-10: --maxclients raised from the 10000 default and nofile pinned.
    # Defence in depth only — the real fix for the outage was closing the
    # leaked async clients (see src/infrastructure/cache/redis_client.py).
    # A higher ceiling buys time to notice a future leak; it does not cure one.
    # 2026-08-10：maxclients 由預設 10000 提高並固定 nofile。此為縱深防禦，真正
    # 的修復是關閉洩漏的 async client；提高上限只是爭取發現問題的時間，不是解方。
    command: sh -c "redis-server --requirepass \"$$REDIS_PASSWORD\" --maxclients 20000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - advisor-net

  # 6. n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: advisor_prod_n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_OTEL_SDK_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=n8n_prod
    volumes:
      - advisor_n8n_data:/home/node/.n8n
      - ./n8n_workflow_template.json:/home/node/template.json:ro
    depends_on:
      mcp_server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - advisor-net

  # 7. Worker Pool
  worker_1:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: advisor_prod_worker_1
    restart: always
    command: sh -c "celery -A src.infrastructure.celery_app worker --loglevel=info -c 2"
    user: root
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_ID=worker-1
      - WORKER_CONCURRENCY=2
      - DB_HOST=advisor_prod_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OTEL_SERVICE_NAME=worker_1_prod
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - ./src:/workspace/src:ro
      - ./prompts:/workspace/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import os,redis; redis.Redis(host='redis', port=6379, password=os.environ['REDIS_PASSWORD']).ping()" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker_2:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: advisor_prod_worker_2
    restart: always
    command: sh -c "celery -A src.infrastructure.celery_app worker --loglevel=info -c 2"
    user: root
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_ID=worker-2
      - WORKER_CONCURRENCY=2
      - DB_HOST=advisor_prod_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OTEL_SERVICE_NAME=worker_2_prod
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - ./src:/workspace/src:ro
      - ./prompts:/workspace/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import os,redis; redis.Redis(host='redis', port=6379, password=os.environ['REDIS_PASSWORD']).ping()" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # P2-3: Celery Beat
  celery_beat:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: advisor_prod_beat
    restart: always
    command: sh -c "celery -A src.infrastructure.celery_app beat --loglevel=info"
    user: root
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=advisor_prod_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - OTEL_SERVICE_NAME=celery_beat_prod
    volumes:
      - ./src:/workspace/src:ro
      - ./prompts:/workspace/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if any('celery' in open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net

  # 10. Lightweight Web Scraper Service
  scraper:
    build:
      context: ./services/scraper
      dockerfile: Dockerfile
    container_name: advisor_prod_scraper
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - advisor-net
  # 8. ngrok Tunnel (Webhook / External Access)
  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: advisor_prod_ngrok
    restart: always
    command: http --url=${NGROK_DOMAIN} advisor_prod_gateway:80
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - nginx
    networks:
      - advisor-net

  nginx:
    image: nginx:alpine
    container_name: advisor_prod_gateway
    restart: always
    ports:
      # 127.0.0.1:8088 (was 0.0.0.0:80) — localhost-only; privileged :80 needs vmnetd helper.
      # ngrok reaches nginx over advisor-net (advisor_prod_gateway:80), unaffected by host port.
      - "127.0.0.1:8088:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      mcp_server:
        condition: service_healthy
      worker_1:
        condition: service_started
      worker_2:
        condition: service_started
    networks:
      - advisor-net

volumes:
  advisor_db_data:
  advisor_redis_data:
  advisor_n8n_data:

networks:
  advisor-net:
    driver: bridge