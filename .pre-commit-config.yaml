repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        exclude: package.lock.json
# 2026-07-12 (open-source Phase 0): second, independent secret scanner —
# .env.bak-20260711 was git-tracked with secret var names for weeks
# without either scanner catching it (it predates this hook). Two
# scanners with different heuristics reduce the chance of a repeat.
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
    -   id: gitleaks
