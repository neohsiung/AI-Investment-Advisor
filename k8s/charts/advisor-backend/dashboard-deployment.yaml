apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-dashboard
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-dashboard
  template:
    metadata:
      labels:
        app: streamlit-dashboard
    spec:
      containers:
      - name: dashboard
        image: gcr.io/YOUR_GCP_PROJECT_ID/investment-advisor-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: MCP_SERVER_URL
          value: "http://mcp-server-service:8000"
        - name: MEMORY_BACKEND
          value: "redis"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: DB_HOST
          value: "postgres-service"
        livenessProbe:
          httpGet:
            path: /health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  type: ClusterIP
  ports:
  - port: 8501
    targetPort: 8501
  selector:
    app: streamlit-dashboard
