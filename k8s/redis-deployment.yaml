apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-memory-service
  namespace: default
  labels:
    app: redis-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-memory
  template:
    metadata:
      labels:
        app: redis-memory
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {} 
        # In production, use PersistentVolumeClaim:
        # persistentVolumeClaim:
        #   claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-memory
  namespace: default
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-memory
  type: ClusterIP
