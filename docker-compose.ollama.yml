version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: advisor_ollama_service
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama:rw
      - ./ollama_models:/models:ro
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - advisor-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    stdin_open: true
    tty: true

networks:
  advisor-net:
    driver: bridge
    external: true
