[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
markers =
    integration: tests requiring external services (DB, MCP)

# The [coverage:run] and [coverage:report] sections that used to live here were
# dead: coverage.py reads .coveragerc, setup.cfg, tox.ini and pyproject.toml —
# never pytest.ini. Their `fail_under = 70` had therefore never applied (the
# real gate is --cov-fail-under=65 in .github/workflows/ci-cd.yml) and the
# `omit` list had never filtered anything. Live config is now
# [tool.coverage.*] in pyproject.toml.
# 原本這裡的 [coverage:*] 區塊是死設定 —— coverage.py 不讀 pytest.ini，
# 那個 fail_under = 70 從來沒生效過。實際設定已移到 pyproject.toml。
