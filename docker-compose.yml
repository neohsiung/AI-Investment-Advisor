services:
  dashboard:
    build: .
    container_name: investment_advisor_dashboard
    command: streamlit run src/dashboard.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./client_secret.json:/app/client_secret.json # Expected to be in project root
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      mcp_server:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: investment_advisor_mcp
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build: .
    container_name: investment_advisor_scheduler
    command: python src/cli.py --mode scheduler
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./client_secret.json:/app/client_secret.json # Expected to be in project root
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mcp_server:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: investment_advisor_db
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASS:-postgres}"
      POSTGRES_DB: "${DB_NAME:-portfolio}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: investment_advisor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  ngrok:
    image: ngrok/ngrok:latest
    container_name: investment_advisor_ngrok
    command: "http dashboard:8501"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - dashboard
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
