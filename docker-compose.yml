# version is handled automatically by Compose V2

include:
  - infra/signoz/docker/docker-compose.yaml

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://mcp_server:8000
    container_name: investment_advisor_frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_URL=http://mcp_server:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - OTEL_SERVICE_NAME=nextjs_frontend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - advisor-net
    depends_on:
      mcp_server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 60s
      timeout: 10s
      retries: 3

  mcp_server:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: investment_advisor_mcp
    ports:
      - "8001:8000"
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./prompts:/workspace/prompts
      - ./services/mcp_server:/workspace/services/mcp_server
      - ./secrets/client_secret.json:/workspace/client_secret.json:ro
    env_file:
      - .env
    environment:
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OTEL_SERVICE_NAME=mcp_server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - DB_HOST=postgres

      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - advisor-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: investment_advisor_scheduler
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./prompts:/workspace/prompts
      - ./secrets/client_secret.json:/workspace/client_secret.json:ro
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://investment_advisor_redis:6379/0
      - OTEL_SERVICE_NAME=scheduler
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317

      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=investment_advisor_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python3 src/cron/scheduler.py' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net
    depends_on:
      postgres:
        condition: service_healthy
      mcp_server:
        condition: service_started
      redis:
        condition: service_healthy

      otel-collector:
        condition: service_started

  celery_worker:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: investment_advisor_worker
    command: celery -A src.infrastructure.celery_app worker --loglevel=info
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./prompts:/workspace/prompts
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - OTEL_SERVICE_NAME=celery_worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.infrastructure.celery_app inspect ping -d celery@investment_advisor_worker"]
      interval: 60s
      timeout: 30s
      retries: 3
    networks:
      - advisor-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: investment_advisor_beat
    command: celery -A src.infrastructure.celery_app beat --loglevel=info
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./prompts:/workspace/prompts
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - OTEL_SERVICE_NAME=celery_beat
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if any('celery' in open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - advisor-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: investment_advisor_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - advisor-net

  redis:
    image: redis:7-alpine
    container_name: investment_advisor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - advisor-net
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: investment_advisor_nginx
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      mcp_server:
        condition: service_healthy
    networks:
      - advisor-net
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: investment_advisor_ngrok
    command: "http nginx:80"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - advisor-net
    restart: unless-stopped

  otel-collector:
    # Overriding infra/signoz/docker/docker-compose.yaml to remove incompatible healthcheck
    # Keeping it simple as the image lacks curl/wget
    restart: unless-stopped

  n8n:
    image: n8nio/n8n@sha256:fdf1e22bc04a03e38da41da5a56ba9b9a48510f480874290ea9c180844cbdb0c
    container_name: investment_advisor_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=https://chummy-nonpathologically-lilla.ngrok-free.dev/
      - N8N_OTEL_SDK_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=n8n
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console,file
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflow_template.json:/home/node/template.json:ro
    restart: unless-stopped
    networks:
      - advisor-net
    depends_on:
      - mcp_server

  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    container_name: investment_advisor_scraper
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    networks:
      - advisor-net

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  advisor-net:
    driver: bridge
