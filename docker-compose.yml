version: "3.8"
include:
  - infra/signoz/docker/docker-compose.yaml

services:
  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: investment_advisor_dashboard
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./prompts:/workspace/prompts
      - ./secrets/client_secret.json:/workspace/client_secret.json:ro
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OTEL_SERVICE_NAME=dashboard
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - NOTIFICATION_API_URL=http://notification:8001/api/v1/notify
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
    restart: unless-stopped
    depends_on:
      - mcp_server
      - redis

  mcp_server:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: investment_advisor_mcp
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./prompts:/workspace/prompts
      - ./services/mcp_server:/workspace/services/mcp_server
    env_file:
      - .env
    environment:
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OTEL_SERVICE_NAME=mcp_server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - NOTIFICATION_API_URL=http://notification:8001/api/v1/notify
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - redis
      - postgres

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: investment_advisor_scheduler
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./prompts:/workspace/prompts
      - ./secrets/client_secret.json:/workspace/client_secret.json:ro
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OTEL_SERVICE_NAME=scheduler
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - NOTIFICATION_API_URL=http://notification:8001/api/v1/notify
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
    restart: unless-stopped
    depends_on:
      - postgres
      - mcp_server
      - redis
      - notification

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: investment_advisor_notification
    ports:
      - "8001:8001"
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
    env_file:
      - .env
    environment:
      - OTEL_SERVICE_NAME=notification_service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: investment_advisor_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: investment_advisor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  ngrok:
    image: ngrok/ngrok:latest
    container_name: investment_advisor_ngrok
    command: "http mcp_server:8000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - mcp_server
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: investment_advisor_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=https://chummy-nonpathologically-lilla.ngrok-free.dev/
      - N8N_OTEL_SDK_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflow_template.json:/home/node/template.json:ro
    restart: unless-stopped
    depends_on:
      - mcp_server

volumes:
  postgres_data:
  redis_data:
  n8n_data:
