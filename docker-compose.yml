version: "3.8"
services:
  dashboard:
    build: .
    container_name: investment_advisor_dashboard
    command: streamlit run src/Dashboard.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./client_secret.json:/app/client_secret.json # Expected to be in project root
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OTEL_SERVICE_NAME=dashboard
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - NOTIFICATION_API_URL=http://notification:8001/api/v1/notify
    restart: unless-stopped
    depends_on:
      - mcp_server
      - redis

  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: investment_advisor_mcp
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./prompts:/app/prompts
    env_file:
      - .env
    environment:
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OTEL_SERVICE_NAME=mcp_server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - NOTIFICATION_API_URL=http://notification:8001/api/v1/notify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - redis
      - postgres

  scheduler:
    build: .
    container_name: investment_advisor_scheduler
    command: python src/cli.py --mode scheduler
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./client_secret.json:/app/client_secret.json # Expected to be in project root
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000
      - MEMORY_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - OTEL_SERVICE_NAME=scheduler
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - NOTIFICATION_API_URL=http://notification:8001/api/v1/notify
    restart: unless-stopped
    depends_on:
      - postgres
      - mcp_server
      - redis
      - notification

  notification:
    build: .
    container_name: investment_advisor_notification
    command: uvicorn src.notification_app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - OTEL_SERVICE_NAME=notification_service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: investment_advisor_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: investment_advisor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  ngrok:
    image: ngrok/ngrok:latest
    container_name: investment_advisor_ngrok
    command: "http mcp_server:8000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - mcp_server
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
