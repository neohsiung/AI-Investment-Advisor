services:
  dashboard:
    build: .
    container_name: investment_advisor_dashboard
    command: streamlit run src/dashboard.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./client_secret.json:/app/client_secret.json # Expected to be in project root
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped

  scheduler:
    build: .
    container_name: investment_advisor_scheduler
    command: python src/cli.py --mode scheduler
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./client_secret.json:/app/client_secret.json # Expected to be in project root
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: investment_advisor_db
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASS:-postgres}"
      POSTGRES_DB: "${DB_NAME:-portfolio}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
