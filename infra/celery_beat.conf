; Supervisor configuration for Celery Beat
; 用於生產環境管理 Celery Beat 進程
;
; 安裝方式：
;   sudo cp infra/celery_beat.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start celery-beat
;
; 日誌位置：
;   /var/log/celery/beat.log
;   /var/log/celery/beat.error.log

[program:celery-beat]
command=celery -A src.infrastructure.celery_app beat --loglevel=info
directory=/Users/neohsiung/Work/Projects/AI/investment-advisor
user=neohsiung
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; 環境變數
environment=
    PYTHONPATH="%(ENV_PYTHONPATH)s:/Users/neohsiung/Work/Projects/AI/investment-advisor",
    REDIS_URL="%(ENV_REDIS_URL)s",
    IS_CELERY_WORKER="true"

; 日誌配置
stdout_logfile=/var/log/celery/beat.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/celery/beat.error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; 日誌輪替
redirect_stderr=false