events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker's embedded DNS server. Required because proxy_pass targets below
    # are variables — see the note on each location.
    # Docker 內建 DNS；下方 proxy_pass 使用變數時必須設定 resolver。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # NOTE: the `upstream frontend { server frontend:3000; }` /
    # `upstream mcp_backend { server advisor_prod_api:8000; }` blocks that were
    # here resolved their hostnames ONCE, at nginx startup, and cached the IP
    # forever.
    #
    # Every time the API container was recreated it got a new IP on advisor-net,
    # nginx kept proxying to the dead one, and the whole dashboard returned 502
    # until nginx was restarted by hand. That happened on three separate deploys
    # in this milestone series before being fixed here.
    #
    # Using a variable in proxy_pass forces nginx to resolve per request through
    # the resolver above, so a recreated container is picked up within the TTL.
    # The cost is that variable proxy_pass disables nginx's automatic URI
    # rewriting, so each location passes $request_uri explicitly (which already
    # carries the original path AND query string).
    #
    # 原本的 upstream 區塊只在 nginx 啟動時解析一次主機名並永久快取 IP：
    # API 容器每次重建都會換 IP，nginx 仍指向舊 IP，整個儀表板 502 直到手動重啟
    # nginx（本次里程碑期間已發生三次）。改用變數可讓 nginx 每次請求重新解析；
    # 代價是變數形式會關閉自動 URI 改寫，故各 location 明確傳入 $request_uri。

    server {
        listen 80;
        server_name localhost;

        # Frontend (Next.js) - Default Root
        location / {
            set $upstream_frontend "frontend:3000";
            proxy_pass http://$upstream_frontend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Next.js HMR (if used in dev)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # MCP Server API
        location /api/ {
            set $upstream_api "advisor_prod_api:8000";
            proxy_pass http://$upstream_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for MCP Dashboard
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Webhook Entry Points (MCP Direct)
        location /webhook/ {
            set $upstream_api "advisor_prod_api:8000";
            proxy_pass http://$upstream_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Channel Callbacks (LINE, Slack, etc.)
        location /callback/ {
            set $upstream_api "advisor_prod_api:8000";
            proxy_pass http://$upstream_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Error Pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

    # ── Public tunnel vhost (port 8080) ───────────────────────────────────────
    #
    # ngrok points at THIS server block, not the one above.
    #
    # Why a separate vhost: the tunnel reaches nginx over the docker network, so
    # it bypasses the 127.0.0.1 port publishing that protects everything else.
    # Pointed at port 80 it exposed the dashboard and the whole /api/ surface to
    # the internet — with no login, since this is a single-operator deployment.
    #
    # Only endpoints that carry their own credentials are published here:
    #   /webhook/*   — X-API-Key, resolved in webhook_service._resolve_user()
    #   /callback/*  — provider-signed (e.g. X-Line-Signature)
    # Everything else returns 404, including /api/ and the dashboard itself.
    #
    # 通道專用 vhost：ngrok 只指向此區塊。因為通道走 docker 網路、繞過 127.0.0.1
    # 綁定，若指向上面的 :80 等於把無登入的儀表板與 /api/ 對外全開。
    # 這裡只公開自帶憑證的端點（webhook 的 X-API-Key、callback 的簽章），其餘一律 404。
    server {
        listen 8080;
        server_name _;

        location /webhook/ {
            set $upstream_api "advisor_prod_api:8000";
            proxy_pass http://$upstream_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /callback/ {
            set $upstream_api "advisor_prod_api:8000";
            proxy_pass http://$upstream_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else — dashboard, /api/, /docs — is not published here.
        location / {
            return 404;
        }
    }
}
