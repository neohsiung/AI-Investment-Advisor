# Simplified Firecrawl Self-Hosted (No API Key)
# Based on official firecrawl/docker-compose.yaml
# Uses community Docker Hub images when available

services:
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:0.1.0
    container_name: advisor_prod_firecrawl_browser
    restart: always
    environment:
      - PORT=3000
      - MAX_CONCURRENT_PAGES=5
    networks:
      - advisor-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl:
    image: firecrawl/firecrawl:latest
    container_name: advisor_prod_firecrawl
    restart: always
    ports:
      - "3002:3002"
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000/scrape
      - POSTGRES_USER=postgres
      - POSTGRES_DB=firecrawl_local
      - POSTGRES_HOST=advisor_prod_db
      - POSTGRES_PORT=5432
      - USE_DB_AUTHENTICATION=false
      - NUM_WORKERS_PER_QUEUE=2
      - CRAWL_CONCURRENT_REQUESTS=5
      - MAX_CONCURRENT_JOBS=3
      - BROWSER_POOL_SIZE=5
      - LOGGING_LEVEL=INFO
      - NO_API_KEY_REQUIRED=true
    depends_on:
      playwright-service:
        condition: service_started
      redis:
        condition: service_healthy
      advisor_prod_db:
        condition: service_healthy
      playwright-service:
        condition: service_healthy
    networks:
      - advisor-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  advisor-net:
    external: true