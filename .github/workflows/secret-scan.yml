name: Secret Scan

# 2026-07-12 (open-source Phase 0): .env.bak-20260711 was git-tracked with
# secret variable names for weeks — this workflow is the CI-side gate that
# should have caught it before merge (complements the pre-commit hooks,
# which only run locally and can be skipped).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # Least privilege for GITHUB_TOKEN, matching both jobs in ci-cd.yml.
    # gitleaks-action reads PR commits through the API, so it needs read on
    # contents and pull-requests — and nothing else.
    # 最小權限，與 ci-cd.yml 兩個 job 一致；gitleaks 只需讀取 commit 與 PR。
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
