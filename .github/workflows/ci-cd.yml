name: CI/CD Pipeline

on:
  # `push` runs only on main (the post-merge check). PR branches are covered by `pull_request` alone, so a
  # PR-branch push does not run the workflow twice. Prd still runs only on workflow_dispatch.
  # `push` 只在 main 觸發（合併後檢查）；PR 分支只由 pull_request 觸發，不會重複執行。Prd 仍只由 workflow_dispatch 觸發。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_gcp:
        description: "Deploy to GCP (Prd)?"
        required: true
        default: false
        type: boolean

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1
  GAR_LOCATION: asia-east1
  REPOSITORY: investment-advisor
  IMAGE: investment-advisor

jobs:
  lab:
    name: Lab (CI / Validation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    services:
      postgres:
        # pgvector, not stock postgres: the baseline migration's first act is
        # CREATE EXTENSION "vector", so `alembic upgrade head` below dies
        # immediately on an image without it. Same image as advisor_prod_db.
        # 必須用 pgvector 版：baseline migration 一開始就 CREATE EXTENSION
        # "vector"，stock postgres 會讓下面的 alembic 步驟當場失敗。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret (throwaway CI service container)
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Cheap gates first, before the heavy install. 先跑便宜的閘門。
      - name: Agent rule files in sync (dev-standard)
        run: python3 .dev-standard/sync.py check

      - name: Lint (ruff, new violations only)
        # Version must match .ruff-baseline.json; the script fails on a mismatch. 版本須與 baseline 一致。
        run: |
          python -m pip install "ruff==$(python -c 'import json;print(json.load(open(".ruff-baseline.json"))["ruff_version"])')"
          python scripts/ruff_baseline.py check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          # Install the versions pinned in uv.lock, not a fresh resolve. 安裝 uv.lock 鎖定的版本，不重新解析。
          uv export --locked --no-hashes --no-emit-project --extra dev --extra scrape --extra memory --extra obs -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests with coverage
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres  # pragma: allowlist secret
          DB_NAME: portfolio
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AI_PROVIDER: mock
        run: |
          python -m pytest -n 4 --dist loadfile --cov=src --cov-report=xml --cov-fail-under=65 tests/

      - name: Verify Alembic Migrations
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres  # pragma: allowlist secret
          DB_NAME: portfolio
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          alembic upgrade head
          alembic check

      - name: Security Scan (Bandit)
        run: |
          # Fail if there are medium or high severity issues
          python -m bandit -r src/ -ll -f screen

      - name: Wiki Integrity Check (Flat-Linking)
        run: |
          python .agent/skills/wiki-maintainer/scripts/verify_wiki_links.py

      - name: License Compliance Check
        run: |
          pip-licenses --format=markdown --summary > license_report.md
          # Basic check for non-permissive licenses
          pip-licenses --format=json | python3 -c "import sys, json; licenses = json.load(sys.stdin); violations = [p['Name'] for p in licenses if (('GPL' in p['License'] or 'AGPL' in p['License']) and 'LGPL' not in p['License'])]; sys.exit(1) if violations else sys.exit(0)"

  frontend:
    # The dashboard had no tests at all until 2026-08-14, so no frontend change
    # has ever been able to fail CI. It runs as its own job rather than a step
    # in `lab`: it needs Node instead of Python and none of that job's Postgres
    # or Redis services, and keeping them separate means a frontend failure
    # reads as a frontend failure.
    # 儀表板在 2026-08-14 之前完全沒有測試，前端改動從來無法讓 CI 失敗。
    # 獨立成一個 job：它需要的是 Node 而非 Python，也用不到 lab 的資料庫服務。
    name: Frontend (Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  prd:
    name: Prd (Cloud Deployment)
    needs: [lab, frontend]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_gcp == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Dashboard (Cloud Run Service)
        run: |
          gcloud run deploy investment-dashboard \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --port 8501 \
            --command "streamlit" \
            --args "run,src/dashboard.py,--server.port,8501,--server.address,0.0.0.0" \
            --set-env-vars "AI_PROVIDER=${{ secrets.AI_PROVIDER }},AI_MODEL_SMART=${{ secrets.AI_MODEL_SMART }},AI_MODEL_FAST=${{ secrets.AI_MODEL_FAST }}" \
            --set-env-vars "DB_TYPE=postgres,DB_HOST=${{ secrets.DB_HOST }},DB_USER=${{ secrets.DB_USER }},DB_PASS=${{ secrets.DB_PASS }},DB_NAME=${{ secrets.DB_NAME }}" \
            --set-env-vars "GOOGLE_CLIENT_SECRET_JSON=${{ secrets.GOOGLE_CLIENT_SECRET_JSON }},REDIRECT_URI=${{ secrets.REDIRECT_URI }}" \
            --set-env-vars "API_KEY=${{ secrets.API_KEY }},FRED_API_KEY=${{ secrets.FRED_API_KEY }}"

      - name: Update Cloud Run Jobs
        run: |
          SERVICES=("daily-check" "weekly-report" "monthly-refinement")
          TASKS=("daily" "weekly" "monthly")

          for i in "${!SERVICES[@]}"; do
            gcloud run jobs update ${SERVICES[$i]} \
              --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
              --region ${{ env.REGION }} \
              --command "python" \
              --args "src/cli.py,--mode,scheduler,--task,${TASKS[$i]}" \
              --set-env-vars "AI_PROVIDER=${{ secrets.AI_PROVIDER }},AI_MODEL_SMART=${{ secrets.AI_MODEL_SMART }},AI_MODEL_FAST=${{ secrets.AI_MODEL_FAST }}" \
              --set-env-vars "DB_TYPE=postgres,DB_HOST=${{ secrets.DB_HOST }},DB_USER=${{ secrets.DB_USER }},DB_PASS=${{ secrets.DB_PASS }},DB_NAME=${{ secrets.DB_NAME }}" \
              --set-env-vars "API_KEY=${{ secrets.API_KEY }},FRED_API_KEY=${{ secrets.FRED_API_KEY }}"
          done
