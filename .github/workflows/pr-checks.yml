# 由 dev-standard v0.23.2 產生，請勿手改；要改請改 dev-standard 的 components/pr-checks，再跑 sync.py update
name: pr-checks
# 選用的外殼：只跑七項檢查的靜態項（風險級、檔案範圍、對外影響、DERIVED、驗收）。
# 需要留言標記、CI 結論、其他 PR 的項目，與合併本身，由本機 run.py <PR> [--merge] 在合併當下做；Actions 停用時照樣能合併。
# 風險級設定讀 base 分支的 .dev-standard/risk.json，PR 不能在同一個改動裡改掉自己的門檻。

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# 同一個 PR 只留最新一次：edited（改說明）與 synchronize（新 push）連續來時，舊的那次結論已經過時。
# 檢查讀的是當下的 PR 說明與 diff，最新一次跑完的結論就是現況。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: 七項檢查（靜態項）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .dev-standard/bin/pr_checks/run.py "$PR_NUMBER" --ci
